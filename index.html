/* Live per-channel meters. The analyser hanging off each channel's panner is
   already there for the auto-mix, so this costs one read per channel per frame
   and no new nodes. Peak-hold with a slow fall, because a bar that tracks the
   waveform instantly reads as noise rather than level. */
/* The channel list, in display order. Everything that draws or walks the strip
   goes through this, so re-ordering it (master into the row, music channels
   starting at 1) is one edit rather than ten. */
/* MASTER sits at the right end of the strip as channel 0, so the digit row IS
   the mixer: 1-9 are music, 0 is the master, exactly where the key is.
   presets[0] is retired rather than reindexed — renumbering every saved
   pattern to gain one channel is not a trade worth making. */
const METER={pk:new Array(11).fill(0), buf:new Float32Array(256)};
function masterLevel(){
  const a=engine.mAn; if(!a)return 0;
  a.getFloatTimeDomainData(METER.buf);
  let mx=0; for(let k=0;k<METER.buf.length;k++){const v=METER.buf[k]<0?-METER.buf[k]:METER.buf[k]; if(v>mx)mx=v;}
  METER.pk[10]=mx>METER.pk[10]?mx:METER.pk[10]*0.86;
  return METER.pk[10];
}
const BARS=' ▁▂▃▄▅▆▇█';
function chLevel(i){
  const b=engine.buses[i]; if(!b||!b.an)return 0;
  b.an.getFloatTimeDomainData(METER.buf);
  let mx=0;
  for(let k=0;k<METER.buf.length;k++){const a=METER.buf[k]<0?-METER.buf[k]:METER.buf[k]; if(a>mx)mx=a;}
  METER.pk[i]=mx>METER.pk[i]?mx:METER.pk[i]*0.86;
  return METER.pk[i];
}
/* level -> bar index, on a dB-ish curve: a linear map spends most of its
   travel on the top 6dB and reads as an on/off lamp. */
const meterCh=v=>BARS[clamp(Math.round(Math.pow(clamp(v,0,1),0.35)*8),0,8)];
/* 50L .. C .. 50R — an amount you can read, not a picture of a knob */
/* eighths, upward — a level is a height, so the bar is one */
const VBLK=' \u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588';
function fillBar(v,w){
  return VBLK[clamp(Math.round(clamp(v,0,1)*8),0,8)].repeat(w);
}
/* pan on a track: a rule with the marker where the signal sits */
function panBar(v,w){
  const mid=(w-1)/2;
  const at=clamp(Math.round(mid+clamp(v,-1,1)*mid),0,w-1);
  let out='';
  for(let k=0;k<w;k++)out+=k===at?'\u2588':(k===mid?'\u2502':'\u2500');
  return out;
}
/* A FADER IS NOT A GAIN. Level was stored, shown and stepped as raw amplitude,
   and loudness is roughly logarithmic — so 0.15→0.30 is a doubling you hear
   while 0.70→0.85 is almost nothing, and every useful setting for a loud sound
   crowds into the bottom sixth of the travel. That is exactly the symptom.

   What a console does is spread the range in dB. This is the standard taper:
   position^2.5 — unity at the top, about −15dB at the halfway mark, −30dB at a
   third, so the travel is even to the ear and the quiet end keeps resolution.
   The STORED value is still the gain; only what you turn and what you read
   changed, so nothing already made sounds any different.

   NOT applied to operator levels: an op's `amt` is a ratio between oscillators
   and an FM index, not an output fader. Linear is correct there. */
const VOLT=2.5;
const volToF=g=>Math.pow(clamp(g,0,1),1/VOLT)*100;      // gain → 0..100 on the fader
const fToVol=f=>Math.pow(clamp(f,0,100)/100,VOLT);      // and back
const panCh=v=>{
  const n=Math.round(Math.abs(v)*50);
  return n<1?'  C':(String(n)+(v<0?'L':'R')).padStart(3);
};

/* VERTICAL GRID. Time runs down, one column per channel, aligned to the mixer
   strip above so a channel and its part are one object.

   The playhead is a single line across every channel — which is the whole
   point, and something ten separate horizontal lanes cannot show.

   Lanes are polymetric here: each has its own length. So the axis is ABSOLUTE
   time from the pattern anchor and every column wraps at its own loop point,
   exactly as playback does. A 3-beat lane against a 4-beat one visibly
   phases, which the lane view could only imply. */
const VROWS=()=>CFG.vrows??16;                // one bar of rows — everything squeezes into it
const CELLW=8;                                // lit characters in one cell; the 9th is the gap
const COLW=CELLW+1;                           // ...so this is the column pitch
const GUTW=4;                                 // the left label / row-number column
const ctr=g=>{const l=Math.floor((CELLW-1)/2);return ' '.repeat(l)+g+' '.repeat(CELLW-1-l);};
const velCls=v=>'n'+clamp(Math.round((v??0.9)*5),0,5);
/* Every column is its OWN loop, top to bottom, so a lane's LENGTH is the
   height of its column — the thing you could not see when the axis was
   absolute time and everything wrapped invisibly.

   Each column also carries its own playhead, because with different lengths
   they are at different places at the same moment. Watching four playheads
   drift apart is the clearest picture of polymetry the screen can give.

   White boxes are reserved for the cursor. A playing note is bright, not
   boxed — otherwise half the grid is boxes and the cursor stops meaning
   anything. */
/* EVERY CHANNEL IS THE SAME HEIGHT AND ITS OWN RESOLUTION.

   Not text rows: a row is shared by all nine columns, so the moment one lane
   is four bars every other lane gets sliced the same way. So the grid is a row
   of COLUMNS, each dividing the same vertical budget by its own step count.
   Length becomes density instead of a scroll.

   Inside a column the notes are not characters — they are BARS, absolutely
   placed: down the column for time (so a held note is a long bar, which is the
   thing a letter could never show) and across it for pitch. The pitch axis is
   scaled to the notes actually in that lane, so a bassline and a lead each get
   the full width instead of both huddling in one corner of a fixed range. */
/* declared with the other globals — applyTheme() runs long before this point
   in the file and writes CHWdone, which a `let` down here would put in TDZ */
function measureChar(){
  const p2=document.createElement('span');
  p2.textContent='0'.repeat(100);
  p2.style.cssText='position:absolute;visibility:hidden;white-space:pre;';
  screen.appendChild(p2);
  const w=p2.getBoundingClientRect().width/100;
  p2.remove();
  if(w>0)CHW=w;
  /* The strip's gap is a text advance minus two bleeds; the grid's was
     calc(1ch - 2px), which the browser rounds to a different pixel. Same
     number, measured once, handed to both — arithmetic that agrees on paper
     is not the same as arithmetic that agrees on screen. */
  const r=document.documentElement.style;
  r.setProperty('--gapw',(CHW-2).toFixed(3)+'px');
  /* The cell's WIDTH, not a border: Chrome snaps painted border widths to half
     a pixel, so asking for 5.8 drew 5.5 and the grid's gap came out a third
     narrower than the strip's however carefully the number was computed.
     Widths keep their subpixels. This is the strip's fill exactly — eight
     characters plus the bleed at each end. */
  r.setProperty('--cellw',(CELLW*CHW+2).toFixed(3)+'px');
  /* ...and a strip cell's PAINTED height, which is not its line's height: a
     fill is the font's content box plus the padding the class carries, and the
     leading around it stays background. Measuring the span on its own gave the
     line box instead, because position:absolute blockifies it — so it has to
     be measured inline, inside a wrapper. */
  const w3=document.createElement('div');
  w3.style.cssText='position:absolute;visibility:hidden;white-space:pre;';
  w3.innerHTML='<span class="k">0</span>';
  screen.appendChild(w3);
  const hh=w3.firstChild.getBoundingClientRect().height;
  w3.remove();
  if(hh>4)r.setProperty('--striph',hh.toFixed(2)+'px');
}
const autoOn=()=>S.aView!==null;
/* which address is in front, remembered BY ADDRESS: recording a point on some
   other knob must not slide the overlay onto it mid-take. */
/* the address the param cursor is standing on, or null if it is not standing
   on a parameter at all */
function cursorAddr(pre){
  if(S.layer<2||S.mSel||pre!==S.presets[S.editSnd])return null;
  const M=MODULES[S.curMod]; if(!M||!M.id||M.prs)return null;
  const px=flatView(S.curMod)?S.curParam:S.slotParam;
  return autoAddr(pre,S.curMod,M.flat?-1:S.curSlot,px);
}
/* WHICH CURVE IS LIT: the one under the cursor. Walking onto a knob with
   automation brings its curve forward, and walking onto one without leaves
   nothing lit — which is the honest answer, and it means the arrows and [ ]
   are the same gesture rather than two ways of choosing.
   S.aAddr only carries it where there IS no param cursor — out on the desk,
   where [ ] is the only way to pick. */
function aFront(pre){
  const ls=autoLanes(pre); if(!ls.length)return null;
  const c=cursorAddr(pre);
  if(c)return ls.find(l=>sameAddr(l.a,c))||null;
  return ls.find(l=>l.k===S.aAddr)||null;
}
/* autoLanes rebuilds its entries every call, so two calls never share an
   object and indexOf is always -1. Position is asked for by ADDRESS, which is
   the only thing that survives the rebuild — and the only thing that means
   anything anyway. */
const aIndexOf=(ls,k)=>ls.findIndex(l=>l.k===k);
/* One channel's automation, drawn over its column. Value runs across, time
   runs down with the notes — so a sweep leans the way you hear it lean.
   It is a STAIRCASE because playback is one: a point sets the parameter and it
   stays there until the next one. Drawing straight lines between them would
   show a glide the ear never gets. */
function autoCurves(pre,laneLen,anc,H,CW,frontKey){
  const ls=autoLanes(pre); if(!ls.length||laneLen<=0)return '';
  const ml=pre.modLoop, mlen=ml.len;
  if(mlen<=0)return '';
  let h='';
  for(const L of ls){
    const w=autoWhere(pre,L.a); if(!w)continue;   // unresolved — nothing to point at
    const pts=L.pts.filter(p=>p.t<mlen-1e-9);     // what occur() will actually play
    if(!pts.length)continue;
    const X=v=>1+spanPos(w.spec,v)*Math.max(1,CW-2);
    /* the automation loop and the note lane are two clocks. Walk the column in
       ITS time and ask the mod loop what it is doing there, so a 2-bar sweep
       under a 1-bar part draws the half you are actually going to hear. */
    const ph0=fmod(anc,mlen);
    /* the top of the column is mid-ramp, not on a point, so it takes the
       INTERPOLATED value there — reading the last point instead drew a flat
       run into the first point that the playback does not play */
    let heldSt=false;
    for(const p of pts)if(p.t<=ph0+1e-9)heldSt=!!p.st;
    const brk=[{ct:0,v:autoValueAt(w.spec,pts,ph0,mlen),st:heldSt}];
    for(let base=-ph0;base<laneLen-1e-9&&brk.length<400;base+=mlen)
      for(const p of pts){
        const t=base+p.t;
        if(t>1e-9&&t<laneLen-1e-9)brk.push({ct:t,v:p.v,st:!!p.st});
      }
    const front=L.k===frontKey;
    /* JOINED, NOT STEPPED. A recorded move is continuous; drawing it as a
       staircase showed jumps the playback no longer makes. A STEP point still
       holds — that is what a parameter lock is — so the two shapes live in one
       path and you can see at a glance which kind of point you are looking at. */
    let d='M'+X(brk[0].v).toFixed(1)+',0';
    for(let j=1;j<brk.length;j++){
      const y=(brk[j].ct/laneLen*H).toFixed(1);
      if(brk[j-1].st)d+='V'+y+'H'+X(brk[j].v).toFixed(1);   // hold, then jump
      else d+='L'+X(brk[j].v).toFixed(1)+','+y;             // ramp straight to it
    }
    /* and the bottom is mid-ramp too: the curve leaves the column heading for
       the next point, wrapping if that point is in the following cycle. A bare
       vertical here dropped the line straight down at the last value. */
    if(brk[brk.length-1].st)d+='V'+H.toFixed(1);
    else d+='L'+X(autoValueAt(w.spec,pts,fmod(ph0+laneLen,mlen),mlen)).toFixed(1)
            +','+H.toFixed(1);
    h+='<path class="acv'+(front?' af':'')+'" d="'+d+'"/>';
    if(front)for(const b of brk)
      h+='<circle class="apt" cx="'+X(b.v).toFixed(1)+'" cy="'+
         (b.ct/laneLen*H).toFixed(1)+'" r="1.7"/>';
  }
  return h?'<svg class="alay" width="'+CW.toFixed(1)+'" height="'+H+'">'+h+'</svg>':'';
}
function gridHTML(pat,pos,anc,chans){
  const step=0.25;
  /* A row was a whole 22.75px line because it used to BE one. It is a div
     now, and at one bar the numbers down the side had more air between them
     than they had height — so the budget is its own number, tunable. */
  const H=Math.round(VROWS()*(CFG.rowH??14));
  const editing=pat.state==='edit';
  const soloing=pat.lanes.some(l=>l.solo);
  const dimOf=i=>pat.lanes[i].mute||(soloing&&!pat.lanes[i].solo);
  const CW=CELLW*CHW;                         // a cell's lit width in pixels

  const cu=pat.lanes[S.curPreset];
  const curStep=cu?Math.round(curCell(cu)*cellOf(cu)/step):-1;
  /* the automation belongs to the CHANNEL, not to the pattern being peeked at,
     so it reads the desk directly. Only the channel you are on has a front
     curve; everywhere else every address draws faint, which is how you see
     that channel 7 is moving without going to look. */
  const PR2=i=>S.presets[i];
  const frontKey=(x=>x&&x.k)(aFront(S.presets[S.curPreset]));
  const nowOf=i=>{const l=pat.lanes[i];
    return (T.playing&&l&&l.len>0)?Math.floor(fmod(pos-anc,l.len)/step):-1;};

  let h='<div class="grid">';
  {const raw=cu?Math.max(1,Math.round(cu.len/step)):16;
   /* the same last-resort packing the columns do. Without it a 16-bar loop
      gave the gutter 256 cells that could not shrink below their floor, and
      the column it was supposed to be labelling was a third of its height. */
   const gper=Math.max(1,Math.ceil(raw/Math.max(1,Math.floor(H/5.4))));
   const n=Math.ceil(raw/gper), ch=H/n;
   const u=Math.max(1,Math.round((cu?Math.max(1,Math.round(UNITS[cu.unit]/step)):4)/gper));
   h+='<div class="gcol gut" style="width:'+(GUTW+1)+'ch">';
   for(let r=0;r<n;r++){
     const tick=r%u===0;
     const txt=(ch>=13||(tick&&ch*u>=13))?String(r*gper+1).padStart(GUTW)+(tick?'│':' '):'';
     h+='<div class="gc '+(tick?'a':r%4===0?'v':'d')+'" style="height:'+ch.toFixed(2)+
        'px;line-height:'+ch.toFixed(2)+'px">'+txt+'</div>';
   }
   h+='</div>';}

  for(const i of chans){
    const lane=pat.lanes[i], sel=i===S.curPreset, dim=dimOf(i);
    const n16=(lane&&!isAudioCh(i))?Math.max(1,Math.round(lane.len/step)):0;
    h+='<div class="gcol" style="width:'+COLW+'ch">';
    if(!n16){ h+='<div class="gc k" style="height:'+H+'px"></div></div>'; continue; }
    /* a cell cannot render below about five pixels, so past that density the
       column would grow instead of staying level — the last resort, and only
       then, is more than one 16th to a cell */
    const per=Math.max(1,Math.ceil(n16/Math.max(1,Math.floor(H/5.4))));
    const n=Math.ceil(n16/per), ch=H/n;
    const u=Math.max(1,Math.round(Math.max(1,Math.round(UNITS[lane.unit]/step))/per));
    const now=nowOf(i), nowR=now<0?-1:Math.floor(now/per);
    const curR=curStep<0?-1:Math.floor(curStep/per);
    const base=sel?(dim?'kqs':'ks'):dim?'kq':'k';
    const lift=sel?'ksp':dim?'kqs':'ks';       // the one you are on flashes hardest
    for(let r=0;r<n;r++){
      const playing=nowR===r, cursor=sel&&(editing?curR===r:(nowR>=0?nowR===r:curR===r));
      const atUnit=(r+1)%u===0||r+1>=n;
      const rule=r%4===0?' bt':(r%2?' z':'');
      let cls=(playing?lift:base)+rule;
      if(cursor)cls='cur'+rule+(editing?' inv':'');
      /* the gap does the dividing: a hair inside a unit, a full line at its
         edge. You see every cell AND where the unit ends, which the solid
         block could only do one of. */
      const g=atUnit?(ch>=11?2.6:ch>=7?1.6:1):(ch>=11?0.9:ch>=7?0.6:0);
      h+='<div class="gc '+cls+'" style="height:'+ch.toFixed(2)+'px;line-height:'+
         ch.toFixed(2)+'px;border-bottom-width:'+g+'px" data-h="cell:'+r+'"></div>';
    }
    /* the notes, over the top of the grid rather than inside its cells */
    /* only what actually SOUNDS: occur() skips events at or past the loop end,
       so drawing them put bars below the grid for notes you cannot hear —
       usually the tail of a phrase left behind when the loop was halved */
    const evs=lane.events.filter(e=>e.t<lane.len-1e-9);
    if(evs.length){
      let lo=Infinity, hi=-Infinity;
      for(const e of evs){const m=heardMidi(i,e.midi); if(m<lo)lo=m; if(m>hi)hi=m;}
      if(hi-lo<4){const c2=Math.round((lo+hi)/2); lo=c2-2; hi=c2+2;}
      const span=hi-lo+1, nw=Math.max(1.4,CW/span);
      h+='<div class="nlay">';
      for(const e of evs){
        const m=heardMidi(i,e.midi);
        const top=(e.t/step)/n16*H;
        const full=Math.max(1.6,((e.dur||0.25)/step)/n16*H-0.6);
        const left=(m-lo)/span*CW;
        const cls=(dim||autoOn())?'n1':velCls(e.vel);
        const bar=(y,ht)=>'<i class="pk '+cls+'" style="top:'+y.toFixed(1)+
          'px;height:'+ht.toFixed(1)+'px;left:'+left.toFixed(1)+'px;width:'+nw.toFixed(1)+'px"></i>';
        /* A note held past the loop point is still sounding when the loop comes
           round, so it is drawn where it will be heard: the tail re-enters at
           the top. Cutting it off at the bottom drew a note shorter than it is. */
        h+=bar(top,Math.min(full,H-top));
        let over=full-(H-top);
        for(let g=0;over>0.5&&g<4;g++){ h+=bar(0,Math.min(over,H)); over-=H; }
        /* WHERE THE NOTE ACTUALLY BEGINS. A long note whose tail wraps into
           the top of the same column joins its own head, and one unbroken bar
           down the whole column says nothing about when it was played. The
           attack gets a hairline; the wrapped tail does not. */
        h+='<i class="nst" style="top:'+top.toFixed(1)+'px;left:'+left.toFixed(1)+
           'px;width:'+nw.toFixed(1)+'px"></i>';
      }
      h+='</div>';
    }
    /* over the notes, not under them — the curve is what you came to look at */
    if(autoOn())h+=autoCurves(PR2(i),lane.len,anc,H,CW,frontKey);
    h+=autoDots(PR2(i),anc,CW,frontKey);      // always: closed, the dots ARE the display
    h+='</div>';
  }
  /* THE MASTER COLUMN — the song, where the song lives. Lane 0 has held the
     arrangement since clip recalls moved onto it, and it was the one lane with
     no column: the scheduler played it, recClip wrote to it, and nothing drew
     it. So a performance you recorded was real, audible, and invisible.
     It is not pitched, so it does not draw like notes. A DJ WINDOW is a band
     across the whole width for as long as it holds, because it is on the whole
     mix. A CLIP RECALL is a mark placed at the channel it moved, left to right
     in strip order — so a scene change is a mark at the far left and a single
     channel flipping clips is a mark under roughly where that channel sits. */
  {
    const ml=pat.lanes[0], sel=S.mSel;
    h+='<div class="gcol mcol" style="width:'+COLW+'ch">';
    const n16=ml?Math.max(1,Math.round(ml.len/step)):0;
    if(!n16){ h+='<div class="gc k" style="height:'+H+'px"></div></div>'; }
    else{
      const per=Math.max(1,Math.ceil(n16/Math.max(1,Math.floor(H/5.4))));
      const n=Math.ceil(n16/per), ch=H/n;
      const u=Math.max(1,Math.round(Math.max(1,Math.round(UNITS[ml.unit]/step))/per));
      const now=(T.playing&&ml.len>0)?Math.floor(fmod(pos-anc,ml.len)/step):-1;
      const nowR=now<0?-1:Math.floor(now/per);
      const base=sel?'ks':'k', lift=sel?'ksp':'ks';
      for(let r=0;r<n;r++){
        const atUnit=(r+1)%u===0||r+1>=n;
        const rule=r%4===0?' bt':(r%2?' z':'');
        const g=atUnit?(ch>=11?2.6:ch>=7?1.6:1):(ch>=11?0.9:ch>=7?0.6:0);
        h+='<div class="gc '+((nowR===r?lift:base)+rule)+'" style="height:'+ch.toFixed(2)+
           'px;line-height:'+ch.toFixed(2)+'px;border-bottom-width:'+g+'px"></div>';
      }
      const evs=ml.events.filter(e=>e.t<ml.len-1e-9);
      if(evs.length){
        h+='<div class="nlay">';
        for(const e of evs){
          const top=(e.t/step)/n16*H;
          if(e.dj!==undefined){
            const ht=Math.max(2,((e.dur||1)/step)/n16*H-0.6);
            h+='<i class="djw" style="top:'+top.toFixed(1)+'px;height:'+
               Math.min(ht,H-top).toFixed(1)+'px"></i>';
          }else if(e.clip!==undefined){
            const c2=clamp(e.ch|0,0,9);
            h+='<i class="clw" style="top:'+top.toFixed(1)+'px;left:'+
               (c2/9*Math.max(1,CW-3)).toFixed(1)+'px"></i>';
          }
        }
        h+='</div>';
      }
      h+='</div>';
    }
  }
  return h+'</div>';
}
/* One row, one cell per channel, lined up with the grid columns above it.
   Anything that is better SEEN than read gets built with this rather than
   with characters. */
function colRow(cls,cellFn,gut,mst){
  /* gutter keeps its character width; the channel cells are measured in pixels */
  let h='<div class="crow"><div class="ccell" style="width:calc('+(GUTW+1)+
        'ch + var(--bleed));margin-right:0">'+(gut||'')+'</div>';
  /* +1px because the cell bleeds 1px left, exactly as the strip's do — without
     it every column owes a pixel and the ninth is ten short */
  const cell=body=>'<div class="ccell '+cls+
    '" style="width:var(--cellw);margin-right:calc(var(--gapw) + var(--bleed))">'+
    (body||'')+'</div>';
  for(const i of CHANS())h+=cell(cellFn(i));
  if(mst!=null)h+=cell(mst);              // the master is a column like any other
  return h+'</div>';
}
/* Level, left to right, under the column it belongs to. A meter is a moving
   thing; putting it in a text row meant one of eight glyphs and a lot of
   flicker between them. */
/* vol, live level and pan drawn as one thing. `lvl` is measured AFTER the
   fader, so dividing it back out is what makes the fill mean "how hard this
   channel is being driven" rather than repeating the width underneath it —
   otherwise a quiet channel would read quiet twice and you could never see it
   clipping into its own ceiling. */
function mixCell(vol,pan,lvl,live){
  const c=clamp((clamp(pan,-1,1)+1)/2,0,1), v=clamp(vol,0,1);
  const bl=c*(1-v), br=c+(1-c)*v;                 // the whole cell at full, the line at nothing
  const g=live?Math.pow(clamp(lvl/Math.max(v,0.06),0,1),0.55):0;
  const fl=c-(c-bl)*g, fr=c+(br-c)*g;
  const pc=x=>(x*100).toFixed(2)+'%';
  /* the line is a real pixel, so it has to be pulled back inside the cell at
     the extremes — at hard right `left:100%` is simply not on screen */
  const line='min(calc(100% - 1px), max(0px, calc('+pc(c)+' - 0.5px)))';
  return '<i class="mvol" style="left:'+pc(bl)+';width:'+pc(br-bl)+(live?'':';opacity:.07')+'"></i>'+
         (g>0.004?'<i class="mfill" style="left:'+pc(fl)+';width:'+pc(fr-fl)+'"></i>':'')+
         '<i class="mctr" style="left:'+line+'"></i>';
}
function meterRow(LN,PR,peeking){
  const soloing=CHANS().some(i=>LN(i).solo);
  return colRow('mrow',i=>{
    const audible=!LN(i).mute&&(!soloing||LN(i).solo)&&!peeking;
    const mx=PR(i).mix||{lvl:0.8,pan:0};
    return mixCell(mx.lvl,mx.pan,audible?chLevel(i):0,audible);
  }, sp('d',pad('Mix',GUTW)),
     mixCell(S.mLvl!==undefined?S.mLvl:1,0,peeking?0:masterLevel(),!peeking));
}
/* WHERE EACH AUTOMATED KNOB STARTS THE BAR. One small dot per automated
   parameter, sitting at the top of that channel's own column at the x its
   curve begins from — so with the overlay closed you still see how many knobs
   a channel moves and roughly where they sit, and with it open each dot is the
   head of the line below it. It needed a row of its own only while it was
   pretending to be a strip; in the column it belongs to, it needs nothing. */
function autoDots(pre,anc,CW,frontKey){
  const ls=autoLanes(pre); if(!ls.length)return '';
  const ml=pre.modLoop, mlen=ml.len; if(mlen<=0)return '';
  const ph0=fmod(anc,mlen);
  let h='';
  for(const L of ls){
    const w=autoWhere(pre,L.a);
    const pts=L.pts.filter(p=>p.t<mlen-1e-9);
    const u=(w&&pts.length)?spanPos(w.spec,autoValueAt(w.spec,pts,ph0,mlen)):0;
    h+='<i class="adot'+(L.k===frontKey?' af':'')+(w?'':' dead')+'" style="left:'+
       (1+u*Math.max(1,CW-2)).toFixed(1)+'px"></i>';
  }
  return '<div class="dlay">'+h+'</div>';
}
/* What each channel is sounding RIGHT NOW, under its own column — the names
   the pixels gave up, put back where they belong instead of on one line that
   could only ever describe the channel you happened to be on. */
function liveRow(pat,pos,anc){
  const nm=m=>NN[((m%12)+12)%12]+(Math.floor(m/12)-1);
  return colRow('lrow',i=>{
    const lane=pat.lanes[i];
    if(!lane||isAudioCh(i)||!T.playing)return '';
    const t=fmod(pos-anc,lane.len);
    const on=lane.events.filter(e=>{const en=e.t+(e.dur||0.25);
      return e.t<=t+1e-9&&en>t-1e-9&&e.t<lane.len-1e-9}).sort((a,b)=>a.midi-b.midi);
    if(!on.length)return '';
    const txt=on.slice(0,3).map(e=>nm(heardMidi(i,e.midi))).join(' ')+(on.length>3?'+':'');
    return sp(i===S.curPreset?'a':'v',txt.slice(0,CELLW));
  });
}
/* What is sounding, or — when you are editing — what is under the cursor.
   The pixels give you shape and lose the names; this is where the names went. */
function noteReadout(pat,pos,anc){
  const i=S.curPreset, lane=pat.lanes[i];
  if(!lane||isAudioCh(i))return '';
  /* the overlay takes the readout line while it is up: which knob is in front,
     where it is in its own list, and how to get to the next one. */
  if(autoOn()){
    const pre=S.presets[i], ls=autoLanes(pre), fr=aFront(pre);
    if(!ls.length)return '   '+sp('i',' AUTO ')+sp('d','  no automation on '+pre.name+
      ' — hold tab with the transport rolling, then move a knob');
    /* the channel HAS automation, you are just not standing on any of it —
       so say how much there is rather than claiming there is none */
    if(!fr)return '   '+sp('i',' AUTO ')+sp('d','  '+ls.length+' knob'+
      (ls.length>1?'s':'')+' automated on '+pre.name+' — arrows or [ ] to one of them');
    const w=autoWhere(pre,fr.a);
    const now=w?fmtVal(w.spec,getV(pre,w.mi,w.si,w.spec)):'—';
    return '   '+sp('i',' AUTO ')+' '+sp('a',destLabel(fr.a))+
      sp('v','  '+now)+
      sp('d','   '+(aIndexOf(ls,fr.k)+1)+'/'+ls.length+' · '+fr.pts.length+' pts'+
        (w?'':' · slot is gone — kept, not played')+(ls.length>1?'   [ ] next knob':'')+
        '   ⌥⌫ clears it');
  }
  if(SELALL!=null){
    const l2=pat.lanes[SELALL];
    return '   '+sp('i',' SEL ')+' '+sp('a',(l2?l2.events.length:0)+' notes on ch '+SELALL)+
      sp('d','   ↑↓ nudges by '+gridName(gridOf(l2))+' · esc clears');
  }
  const nm=m=>NN[((m%12)+12)%12]+(Math.floor(m/12)-1);
  if(pat.state==='edit'){
    const cell=cellOf(lane), t0=curCell(lane)*cell;
    const at=lane.events.filter(e=>e.t>=t0-1e-9&&e.t<t0+cell-1e-9)
      .sort((a,b)=>a.midi-b.midi).map(e=>nm(heardMidi(i,e.midi)));
    return '   '+sp('i',' EDIT ')+' '+sp('a',(curCell(lane)+1)+'/'+stepCells(lane))+
      (at.length?'  '+sp('v',at.join(' ')):sp('d','  —'));
  }
  if(!T.playing)return '';
  const t=fmod(pos-anc,lane.len);
  const on=lane.events.filter(e=>{const en=e.t+(e.dur||0.25);
    return e.t<=t+1e-9&&en>t-1e-9&&e.t<lane.len-1e-9;}).sort((a,b)=>a.midi-b.midi);
  /* grey, and only the channel you are on: a readout you have to scan is not
     a readout, and nine of them at once was nothing but movement */
  return '   '+sp('d','▸ '+(on.length?on.map(e=>nm(heardMidi(i,e.midi))).join(' '):''));
}

function renderPat(L,pos){
  const pat=S.patterns[S.editPat];
  const edit=pat.state==='edit';
  const anc=editAnchor();
  /* PEEK: while shift is held in the load picker the WHOLE desk shows the other
     set — grid and strip together — and the cursor points inside it using the
     ordinary channel box. A preview that needed its own row of text to say
     where you were pointing was a second interface for something the desk
     already draws; the answer was to let it draw it. */
  const PK=(PICK&&PICK.peek&&PICK.mode==='load')?peekSet(PICK.sel):null;
  const pkL=PK&&PK.patterns&&PK.patterns[0]?PK.patterns[0].lanes.map(Looper.from):null;
  const LN=i=>(pkL&&pkL[i])||pat.lanes[i];
  const PR=i=>(pkL&&PK.presets&&PK.presets[i])||S.presets[i];
  const CLAT=i=>(pkL?(PK.clipAt||{}):(S.clipAt||{}))[i]??0;
  const SEL=pkL?(PICK.ch??S.curPreset):S.curPreset;
  const mSel=pkL?false:S.mSel;
  /* The desk, one row per property, each row named down the left edge. The
     label column is GUTW wide so a column boundary here is the same column
     boundary in the grid below — read straight down from a name to its notes. */
  const soloing=CHANS().some(i=>LN(i).solo);
  /* K(i) = the fill for channel i's cells: brighter on the one you are on, so
     the whole column lifts together and you can see where you are without
     hunting for a highlighted word. */
  /* A channel is DIMMED when it cannot be heard — muted, or soloed out by
     somebody else. Same treatment for both, because they are the same fact. */
  const dimmed=i=>LN(i).mute||(soloing&&!LN(i).solo);
  /* focused and silenced are independent facts, so the fill carries both */
  /* the master is a channel, so selecting it must UNselect the others —
     two lit columns read as two cursors */
  const K=i=>(i===SEL&&!mSel)?(dimmed(i)?'kqs':'ks'):dimmed(i)?'kq':'k';
  const T=i=>(i===SEL&&!mSel)?'a':dimmed(i)?'d':'u';
  /* centre in exactly w — anything longer is cut, because one over-long cell
     shunts every column to its right and the strip stops lining up with the grid */
  const ctrC=(t0,w)=>{const t=t0.length>w?t0.slice(0,w):t0;
    const l=Math.max(0,Math.floor((w-t.length)/2));
    return ' '.repeat(l)+t+' '.repeat(Math.max(0,w-t.length-l));};
  const rows=[
    /* the number is the thing you press, so the number is what gets the box */
    ['Ch',  i=>{
      const m=LN(i).mute, so=LN(i).solo;
      /* the channel wears the clip it is in — 1a, 2c — so the shelf does not
         have to be a screen you open. Pulsing while its digit is held says the
         letters are live without covering anything up. */
      const at=(pkL&&i===SEL&&PICK.clip!=null)?PICK.clip:CLAT(i);
      const tag=String(i)+CLIPKEYS[at]+(so?' S':m?' M':'');
      /* the white box marks WHERE YOU ARE — unless you are editing, when the
         step cursor takes it over and two full-white marks would compete */
      const sel=i===SEL&&(!edit||!!pkL)&&!mSel;   // the master takes the cursor with it
      const live=(pkL?PICK.dig:HOLD.dig)===i?' puls':'';
      if(!pkL&&CHSEL.has(i))return spH('ri',ctrC(tag,CELLW),'ch',i)+' ';   // picked out
      return spH((sel?'i':T(i)+' '+K(i))+live,ctrC(tag,CELLW),'ch',i)+' ';
    }, ()=>spH((mSel&&!edit?'i':'v k')+(!pkL&&HOLD.dig===0?' puls':''),
        ctrC('0'+CLIPKEYS[pkL?(PK.sceneAt??0):(S.sceneAt??0)],CELLW),'mst0',0)+' '],
    ['Inst',i=>spH(T(i)+' '+K(i),ctrC(instLabel(PR(i)),CELLW),'ch',i)+' ',
            ()=>sp((mSel?'a':'v')+' '+(mSel?'ks':'k'),ctrC('MASTR',CELLW))+' '],

    /* Mix used to be a row of characters here and a meter row above it: a
       number for the level, a track for the pan, and the thing you were
       actually listening to somewhere else. They are one picture now, drawn in
       pixels between the grid and the strip — see mixCell(). */

    ['__loop',i=>{
      const l=LN(i);
      /* `auto` reads as a DIM row rather than a '~' prefix, which buys back the
         character "0.25xbar" and "16x16th" need. Strictly ASCII here: '×' and
         '¼' are a hair narrower than one cell in this font, and a fraction of a
         column per channel is half a character of skew by the ninth one. */
      const c2=l.count%1?String(l.count).replace(/^0/,''):String(l.count);
      const t=isAudioCh(i)?'clip':c2+' '+UNIT_NAMES[l.unit];
      return sp(T(i)+' '+K(i),' '+pad(t,CELLW-1))+' ';
    }, ()=>sp(mSel?'ks':'k',' '.repeat(CELLW))+' '],

    ['__grid',i=>{
      const g=gridOf(LN(i)), k=GRIDS.findIndex(x=>x&&Math.abs(x-g)<1e-9);
      return sp(T(i)+' '+K(i),' '+pad(k>0?k+' '+GRIDN[k]:'?',CELLW-1))+' ';
    }, ()=>sp(mSel?'ks':'k',' '.repeat(CELLW))+' '],

    /* transpose in the unit it actually means. An octave down is −12st, not
       "−1" of something you have to remember the size of; the channel's octave
       and semitone offsets are one number because they are one pitch. */
    ['__tr',  i=>{
      const st=trSemis(PR(i));
      return sp((st?T(i):'d')+' '+K(i),ctrC(st?(st>0?'+':'')+st+'st':'',CELLW))+' ';
    }, ()=>sp(mSel?'ks':'k',' '.repeat(CELLW))+' '],
  ];
  /* INNER is every channel column plus master, so the frame closes exactly on
     the last one. Text this dense reads as a spreadsheet the moment it has an
     edge; without one it is just words hanging in space. */
  /* THE VIEW IS UPSIDE DOWN ON PURPOSE. Notes at the top, then the lane's own
     settings, then the mix, then the channel, then the rack at the very bottom.
     Reading UP from the bottom follows the signal: this channel, what it is,
     how loud, how long its loop, and finally what it plays. It also puts the
     things your hands are on nearest the keys and the thing you watch highest. */
  /* SETTINGS SIT AT THE TOP, above the notes. The rack belongs at the bottom
     because it belongs to the channel row it sits under; settings belong to
     the whole instrument, and the whole instrument is what the grid shows. */
  if(PICK){pickerRack(L);}
  else if(S.layer===-1){settingsRack(L); L.push('');}
  /* PEEK: the other set's grid, in place of yours, while shift is held. Nothing
     is loaded — this is a look, and the digit that follows takes one channel. */
  const showPat=pkL?{state:'on',lanes:pkL}:pat;
  if(CFG.vgrid){
    if(!CHWdone){measureChar(); CHWdone=true;}
    const ro=noteReadout(pat,pos,anc);     // just this channel, quietly, above the notes
    L.push(ro||' ');
    gridAt=L.length;                       // one entry, emitted as raw markup
    L.push(gridHTML(showPat,pos,anc,CHANS()));
  }
  /* the mix picture is the top of the strip, not a footnote to the grid — it
     belongs to the channel columns and has to be there whether the grid is
     drawn vertically or not */
  {if(!CHWdone){measureChar(); CHWdone=true;}
   rawAt.add(L.length); L.push(meterRow(LN,PR,!!pkL));}
  /* Loop length and transpose are things you set and then stop thinking about,
     so they are not worth two permanent rows. They appear on the hold that
     edits them — tab for the loop, n for the pitch — which is exactly when
     you want to see them and never otherwise. */
  const showLoop=HOLD.tab, showTr=HOLD.n, showGrid=HOLD.q;
  for(const [name,cell,mcell] of rows.slice().reverse()){
    if(name==='__loop'&&!showLoop)continue;
    if(name==='__tr'&&!showTr)continue;
    if(name==='__grid'&&!showGrid)continue;
    let row=sp('d',pad(name==='__loop'?'Loop':name==='__tr'?'Tr':name==='__grid'?'Grid':name,GUTW))+' ';
    for(const i of CHANS())row+=cell(i);
    L.push(row+mcell());
  }
  /* while a channel is held, its shelf — so the letters you are about to
     press are labelled rather than remembered */
  /* Everything opens in the same place — above the desk, under the notes.
     Settings were the last thing that swapped the screen for another screen,
     and there was no reason for it: they are a rack like any other rack. */
  if(S.mSel&&S.layer>=2)masterRack(L);
  else if(S.layer>=2){
    L.push('');
    (S.layer===2?renderSnd:renderSlots)(L,pos);
  }
  const lanes=[];
  for(let i=0;i<10;i++)if(!CFG.vgrid&&(i===S.curPreset||pat.lanes[i].events.length))lanes.push(i);
  for(const li of lanes){
    const lane=pat.lanes[li];
    if(isAudioCh(li)){
      const cnt2=(lane.count%1?lane.count.toFixed(1):lane.count)+({s:'st',e:'8th',b:'bt',h:'hlf',B:'br'})[lane.unit];
      L.push('  '+(li===S.curPreset?spH('a',` ${li}${pad(S.presets[li].name,5)} `,'ch',li):spH('d',` ${li}${pad(S.presets[li].name,5)} `,'ch',li))+
        sp('d',pad(lane.solo?'SOLO':lane.mute?'MUTE':cnt2,6))+' '+
        (engine.audBuf[li]?sp('a','≈≈≈ '+(engine.audName[li]||'clip')+' ≈≈≈'):sp('d','≈ no clip — drop audio or tab-record'))+
        (engine.audRec&&engine.audRec.pi===li?sp('r','  ● REC'):''));
      continue;
    }
    if(lane._cap){
      L.push('  '+sp('a',` ${li}${pad(S.presets[li].name,5)} `)+sp('r','● listening — play; loop length suggests itself after a bar of silence'));
      continue;
    }
    const cell=cellSize(lane.len,64);
    const ph=T.playing?Math.floor(fmod(pos-anc,lane.len)/cell):-1;
    const cnt=(lane.count%1?lane.count.toFixed(1):lane.count)+({s:'st',e:'8th',b:'bt',h:'hlf',B:'br'})[lane.unit];
    let lbl=` ${li}${pad(S.presets[li].name,5)} `;
    L.push('  '+(lane.mute?spH('r',lbl,'ch',li):li===S.curPreset?spH('a',lbl,'ch',li):spH('d',lbl,'ch',li))+
      sp('d',pad(lane.solo?'SOLO':lane.mute?'MUTE':lane.auto?'new':cnt,6))+' '+
      gridRow(lane,cell,ph,(a,b)=>{
        const hits=lane.events.filter(e=>e.t>=a-1e-9&&e.t<b-1e-9);
        if(!hits.length)return '·';
        if(hits.length>1)return '≡';
        return PCH[hits[0].midi%12];
      },(edit&&li===S.curPreset)?curCell(lane):-1));
  }
}
function renderSnd(L,pos){
  /* PRST and MIX were blanked in place to keep every module index stable, so a
     cursor parked on one of them now points at nothing. Nudge it to a real
     rack rather than rendering the reserved branch. */
  if(!MODULES[S.curMod]||!MODULES[S.curMod].id)
    S.curMod=Math.max(0,MODULES.findIndex(m=>m.id));
  const pre=S.presets[S.editSnd], ml=pre.modLoop;
  const edit=ml.state==='edit';
  /* The chain reads left to right in the order it runs, each stage named over
     the slots it holds — the same label-over-value shape as a param row, so
     the whole screen is one idea repeated instead of three different ones. */
  chainRow(L,pre,sectionChips(pre));
  L.push('');

  // this channel's pattern lane — only when the grid below isn't already showing it
  if(!CFG.vgrid){const pat=S.patterns[S.editPat], lane=pat.lanes[S.editSnd];
   const rec=pat.state==='rec'&&T.playing, cap=lane._cap;
   if(!isAudioCh(S.editSnd)){
     const cell=cellSize(lane.len,48), anc=editAnchor();
     const ph=T.playing?Math.floor(fmod(pos-anc,lane.len)/cell):-1;
     const cnt=lane.auto?'new':(lane.count%1?lane.count.toFixed(1):lane.count)+({s:'st',e:'8th',b:'bt',h:'hlf',B:'br'})[lane.unit];
     L.push('  '+sp(rec?'r':'d','pattern '+S.editPat+(rec?' ●REC':cap?' ○listen':'')+' ')+sp('d',pad(cnt,5))+'  '+
       (cap?sp('r','listening — play; loop sets itself'):
        gridRow(lane,cell,ph,(a,b)=>{const hits=lane.events.filter(e=>e.t>=a-1e-9&&e.t<b-1e-9);
          return !hits.length?'·':hits.length>1?'≡':PCH[hits[0].midi%12];},-1))+
       sp('d','  · tab '+(rec?'stops':'records')));
     L.push('');
   }}
  prepLine(L,pre);
  layerBanner(L,pre);
  const M=MODULES[S.curMod];
  if(M.id==='osc'&&isCodeCh(S.editSnd)){
    const e=engine.cn&&engine.cn[S.editSnd];
    const names=(e&&e.names)||[];
    const _pl=procPresets(pre.pmodel||'trumpet');
    const _pn=_pl.length?(_pl[clamp(pre.psel|0,0,_pl.length-1)]||{}).n:'';
    L.push('  '+sp('a','⚙ PROCEDURAL  ')+sp('i',' '+(pre.pmodel||'trumpet')+' ')
      +(_pn?sp('a','  '+_pn):'')
      +sp('d','  '+((PROCLIB[pre.pmodel||'trumpet']||{}).fam||'')+'   ')+(e&&e.err
      ? sp('r','error: '+e.err)
      : sp('d','worklet ')+sp(e&&e.ready?'a':'r',e&&e.ready?'live':'compiling…')
        +sp('d','  '+((pre.code||CODE_DEFAULT).split('\n').length)+' lines · '+
             (engine.act[S.editSnd]||[]).length+' voices')));
    L.push('');
    let lr='   ', vr='   ';
    CODEF().forEach((pspec,i)=>{
      const foc=i===S.curParam;
      const v=fmtVal(pspec,(pre.cp&&pre.cp[i])??0);
      lr+=(foc?spH('a','▸'+pad(names[i]||pspec.lbl,8),'cp',i):spH('d',' '+pad(names[i]||pspec.lbl,8),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,8),'cp',i):spH('v',' '+pad(v,8),'cp',i))+' ';
    });
    L.push(lr); L.push(vr);
    L.push('');
    L.push('   '+sp('d','real DSP in an audio-thread worklet · PRST ▸model picks the instrument'));
    L.push('   '+sp('d','modal = struck bars/tines · waveguide = recursion the rack cannot express'));
    L.push('   '+sp('d','←→ pick a param · ↑↓ change it while it plays · cmd+E exports the session with the code'));
  }
  else if(M.id==='osc'&&isAudioCh(S.editSnd)){
    const buf=engine.audBuf[S.editSnd];
    L.push('  '+sp('a','≈ AUDIO CHANNEL  ')+(buf
      ?sp('d','clip: ')+sp('a',(engine.audName[S.editSnd]||'clip')+' · '+buf.duration.toFixed(2)+'s')
      :sp('r','no clip — drop an audio file here, or hold tab to record the mic')));
    L.push('');
    let lr='   ', vr='   ';
    AUDF.forEach((pspec,i)=>{
      const foc=i===S.curParam;
      const v=fmtVal(pspec,pre.au[pspec.key]??0);
      lr+=(foc?spH('a','▸'+pad(pspec.lbl,8),'cp',i):spH('d',' '+pad(pspec.lbl,8),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,8),'cp',i):spH('v',' '+pad(v,8),'cp',i))+' ';
    });
    L.push(lr); L.push(vr);
    L.push('');
    L.push('   '+sp('d','loops in sync with this channel’s lane length · fit stretches trim to the loop'));
    L.push('   '+sp('d','tab = record from input (mic, or mstr = resample the master mix) · modes in settings'));
  }
  else if(M.prs){
    /* preset fields THEN voice params, one row. Two systems share it: preset
       fields are actions dispatched by name, voice ones are ordinary specs.
       instFields() is the single list both the render and the arrows walk, so
       they cannot disagree about which index means what. */
    const flds=instFields();
    S.curParam=clamp(S.curParam|0,0,Math.max(0,flds.length-1));
    const w=clamp(Math.floor(88/Math.max(1,flds.length))-1,5,10);
    let lr='   ', vr='   ';
    flds.forEach((fd,i)=>{
      const foc=i===S.curParam;
      const v=fd.spec?fmtVal(fd.spec,pre.vox[fd.spec.key]):fd.v();
      lr+=(foc?spH('a',' '+pad(fd.k,w),'cp',i):spH('d',' '+pad(fd.k,w),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,w),'cp',i):spH('v k',' '+pad(v,w),'cp',i))+' ';
    });
    L.push(lr); L.push(vr);
  }
  else if(M.flat){
    let lr='   ', vr='   ';
    M.flat.forEach((pspec,i)=>{
      const foc=i===S.curParam;
      const pd=prepDisp(pre,S.curMod,-1,pspec);
      const v=(pd.dot?'•':'')+fmtVal(pspec,pd.v);
      lr+=(foc?spH('a','▸'+pad(pspec.lbl,9),'cp',i):spH('d',' '+pad(pspec.lbl,9),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,9),'cp',i):(pd.dot?spH('r',' '+pad(v,9),'cp',i):spH('v',' '+pad(v,9),'cp',i)))+' ';
    });
    L.push(lr); L.push(vr);
    L.push('');
    L.push('   '+sp('d','←→ params → next rack · shift+←→ jumps rack · digits rack · ↑↓ adjust · ⌫ reset'));
  }else if(M.slot){
    /* modHolder, not pre[M.id]: on a kit channel the rack you EDIT belongs to
       the focused pad, and rendering the channel's rack here would show one
       set of values while every edit went to another. */
    const rackA=modHolder(pre,M.id)[M.id];
    rackParams(L,pre,paramsFor(S.curMod,rackA[S.curSlot]));
    /* right under the row it belongs to — this is the view the sound layer
       actually draws through, and the browser has to open where you are */
    if(DPICK){ if(M.id==='mod')renderDestPick(L,pre); else DPICK=null; }
  }
  autoRows(L,pre);          // the channel layer is where you actually record them
}

/* param display: when a note is focused, show its EFFECTIVE value in place,
   with a • marking params that carry a per-note override */
function stackStrip(){}          // (stacking removed — kits are per-pad chains)
function layerBanner(L,pre){     // which kit pad you're editing
  if(!isKit(pre))return;
  const M=MODULES[S.curMod];
  /* WHICH KEYS HOLD SOMETHING. Twelve pads, named by the note that plays
     them: filled ones bright, empty ones dim. An empty pad is silent now, so
     the row is the difference between "this key does nothing" and "this key
     is broken" — which is exactly what was impossible to tell before. */
  const row='  '+NN.map((n,i)=>{
    const has=pre.kit&&pre.kit[i];
    const here=S.prepFocus!=null&&pcOf(S.prepFocus)===i;
    const lbl=' '+pad(n,3);
    return here?sp('i',lbl):has?sp('a',lbl):sp('d',lbl);
  }).join('');
  const nHas=(pre.kit||[]).filter(Boolean).length;
  L.push(row+sp('d','   '+nHas+'/12 pads'));
  if(S.prepFocus==null){L.push('  '+sp('r','◆ KIT')+sp('d','  play a pad (a note) to pick which instrument you edit'));return;}
  const pc=pcOf(S.prepFocus);
  if(M.prs)return;
  const K=kitSlot(pre,S.prepFocus,true);
  L.push('  '+sp('r','◆ pad '+NN[pc])+sp('a',' '+K.name+' ('+(K.cat||'kik')+')')+
    sp('d',' — this pad is its own full chain; every rack edits THIS pad'));
}
function prepDisp(pre,mi,si,spec){
  const holder=modHolder(pre,MODULES[mi].id);
  if(holder!==pre)return {v:getV(holder,mi,si,spec),dot:false};   // editing a layer
  const f=S.prepFocus;
  if(f==null||!pre.prep||!pre.prep.notes||!pre.prep.notes[f])
    return {v:getV(pre,mi,si,spec),dot:false};
  const node=pre.prep.notes[f];
  const key=MODULES[mi].id+':'+(MODULES[mi].flat?'-':si)+':'+spec.key;
  return {v:getV(prepEffective(pre,f),mi,si,spec),dot:!!(node.k&&node.k[key]!==undefined)};
}
function prepLine(L,pre){        // per-note prep overrides (non-kit channels)
  if(isKit(pre))return;          // kits show their pad banner instead
  const anyPrep=pre.prep&&pre.prep.notes&&Object.keys(pre.prep.notes).length;
  if(!anyPrep)return;
  const f=S.prepFocus;
  const has=f!=null&&pre.prep&&pre.prep.notes&&pre.prep.notes[f];
  L.push('  '+sp('r','◆ PREP')+
    sp('d','  note: ')+(f!=null?sp('a',NN[f%12]+(Math.floor(f/12)-1)+(has?' ●':'')):sp('d','play a note'))+
    sp('d','  ·  cmd+↑↓ tweaks this note only (• marks it) · ⌫ removes'));
  L.push('');
}
/* AUTOMATION YOU CAN SEE. It was invisible in both directions: nothing said
   the mod loop was armed, and nothing showed the points it had written — so
   the only evidence a channel was automated at all was a knob moving on its
   own. One line per automated param, under the rack that owns it, drawn
   against the mod loop's own length with the playhead riding across.

   Under the rack rather than over the note loop on purpose: automation belongs
   to the thing it moves. The note lane is the part; this is the patch. */
function autoRows(L,pre){
  const ml=pre.modLoop;
  const armed=ml&&ml.state==='rec';
  if(!ml||(!ml.events.length&&!armed))return;
  const W2=48, L2=ml.len;
  const head=T.playing?Math.floor(fmod(posNow()-editAnchor(),L2)/L2*W2):-1;
  /* group by the address a point belongs to: rack, slot, param */
  const by=new Map();
  for(const ev of ml.events){
    const k=addrKey(evAddr(pre,ev));
    if(!by.has(k))by.set(k,[]);
    by.get(k).push(ev);
  }
  L.push('');
  L.push('   '+sp('d',pad('Auto',7))+
    (armed?sp('r','● recording — knobs you move are written to the loop')
          :sp('d',by.size+' automated · ⌥⌫ clears this rack · ⌥⇧⌫ clears the channel')));
  if(!by.size)return;
  const rows=[...by.entries()].sort((a,b2)=>a[0].localeCompare(b2[0])).slice(0,8);
  for(const [k,evs] of rows){
    const [mi,si,px]=k.split('/').map(Number);
    const M2=MODULES[mi];
    if(!M2||!M2.id)continue;
    const specs=M2.flat?M2.flat:M2.params(modHolder(pre,M2.id)[M2.id][si<0?0:si]);
    const nm=(M2.name||'?').toLowerCase()+(si>=0?' '+((si+1)%10):'')+' '+((specs[px]||{}).lbl||'p'+px);
    const cells=new Array(W2).fill(null);
    for(const ev of evs){
      const i=clamp(Math.floor(fmod(ev.t,L2)/L2*W2),0,W2-1);
      cells[i]=ev;
    }
    const here=mi===S.curMod&&(si<0||si===S.curSlot);
    let bar='';
    for(let i=0;i<W2;i++){
      const on=cells[i]!==null;
      if(i===head)bar+=sp(on?'ri':'ai','▌');
      else if(on)bar+=sp(here?'a':'v','▌');
      else bar+=sp('d',i%8===0?'·':'─');
    }
    L.push('   '+sp(here?'a':'d',pad(nm,18))+bar+sp('d','  '+evs.length));
  }
  if(by.size>rows.length)L.push('   '+sp('d',pad('',18)+'+'+(by.size-rows.length)+' more'));
}
function renderSlots(L){
  const pre=S.presets[S.editSnd], M=MODULES[S.curMod];
  if(M.prs){renderExplore(L,pre);return;}
  prepLine(L,pre);
  layerBanner(L,pre);
  if(!M.slot){L.push('   '+sp('d','no slots'));return;}
  const rackA=modHolder(pre,M.id)[M.id];
  rackStrip(L,rackA,M);
  L.push('');
  const sl=rackA[S.curSlot];
  rackParams(L,pre,paramsFor(S.curMod,sl));
  if(DPICK){ if(M.id==='mod')renderDestPick(L,pre); else DPICK=null; }
  autoRows(L,pre);
  L.push('');
  // per-module summary line
  let sum='  '+sp('d','rack: ');
  if(M.id==='osc'){
    rackA.forEach((o,i)=>{
      if(i>0&&o.amt<=0.001)return;
      const d=o.dst||0, dT=d>0?''+d:'prev';
      const seg=i===0?((i+1)%10)+WAVES[o.wav]
        :o.mode===1?`  ${(i+1)%10}${WAVES[o.wav]}→fm(${dT})`
        :o.mode===2?`  ${(i+1)%10}${WAVES[o.wav]}→ring(${dT})`
        :`  +${(i+1)%10}${WAVES[o.wav]}`;
      sum+=(i===S.curSlot?sp('a',seg):sp('d',seg));
    });
  }else if(M.id==='mod'){
    rackA.forEach((m2,i)=>{
      if(!m2.src)return;
      const tgts=(m2.routes||[]).map(rt=>rt.tgt?tgtLabel(rt.tgt):MDST[rt.dst||0]+((rt.dst===3||rt.dst===5)?rt.idx:'')).join(',');
      const seg=`  ${(i+1)%10}${MSRC[m2.src]}→${tgts}`;
      sum+=(i===S.curSlot?sp('a',seg):sp('d',seg));
    });
  }else{
    rackA.forEach((s2,i)=>{
      const ab=M.abbr(s2); if(ab==='···')return;
      sum+=(i===S.curSlot?sp('a','  '+((i+1)%10)+ab):sp('d','  '+((i+1)%10)+ab));
    });
  }
  /* Hard cap: this line is assembled from unbounded per-slot descriptions and
     a fully routed MOD rack reached 248ch, which shoves the whole centred page
     sideways. Trim on the rendered text, so short racks look exactly as before. */
  L.push(clipLine(sum,100));
  L.push('');
  /* THE OLD MOD-LOOP STRIP IS GONE. It counted points and drew a row of dots
     scoped to this slot, which is what the desk's Auto row and the \ overlay
     both do now and do better — and its EDIT line described a state nothing
     can reach, because modLoop.state is only ever 'on' or 'rec'. What is left
     is the one thing neither of those says: whether moving a knob right now
     is being written down. */
  const ml=pre.modLoop;
  if(ml.state==='rec')
    L.push('  '+sp('r',T.playing?'● REC — knob moves are recording':'● armed — press space')
      +sp('d','   ⌥⌫ clears this rack\u2019s points'));
  L.push('');
  const hints={osc:'dest routes fm/ring/sync at any op · sync: ratio = the sweep, pitch follows the master · edits are live on held notes',
    flt:'peq/lsh/hsh use gain — stack EQ bands alongside filters',
    mod:'src = env/lfo/vel/key/rnd/press · dest = amp/pitch/filt/pan/op · cmd+C then cmd+V learns any param',
    fx:'serial chain top to bottom · dist holds every drive/crush curve (drv + crush retired into it)',
    ply:'chord (±strum: + low→high, − high→low) · arp needs transport · grv = this part’s groove · rpit = per-note random pitch'};
  L.push('   '+sp('d','←→ flows params → next slot · shift+←→ jumps slot · digits pick slot · ↑↓ value'));
  L.push('   '+sp('d',hints[M.id]||''));
}

/* THE DESTINATION BROWSER. Seventy-odd entries is not a list you arrow
   through — it is a place you look something up. Racks across the top, what is
   in the one you are standing in below it, and the thing you pick is an
   address. It is built from the same live table the picker uses, so what you
   see here is exactly what exists right now. */
let DPICK=null;                                   // {gi, si} while it is open
const DPICK_ORDER=['osc','flt','mod','fx','ply','vox','voice','mix'];
const dpickGroups=()=>destGroups(S.presets[S.editSnd],
  MODULES[S.curMod]&&MODULES[S.curMod].id==='mod'?S.curSlot:null);
function destGroups(pre,selfSlot){
  const g=new Map();
  for(const d of destList(pre)){
    /* NOTHING MODULATES ITSELF. An LFO speeding up its own rate is not a
       feature, it is a runaway — and `mod*` would sweep every slot including
       this one, so the wildcard goes too. */
    if(d.rack==='mod'&&selfSlot!=null&&(d.slot==='*'||d.slot===selfSlot))continue;
    if(!g.has(d.rack))g.set(d.rack,[]); g.get(d.rack).push(d);
  }
  return DPICK_ORDER.filter(k=>g.has(k)&&g.get(k).length).map(k=>({rack:k,items:g.get(k)}));
}
function dpickRoute(){
  const pre=S.presets[S.editSnd], rk=modHolder(pre,'mod').mod;
  const m=rk&&rk[S.curSlot];
  return m?modRt(m):null;
}
function openDestPick(){
  const pre=S.presets[S.editSnd], G=dpickGroups();
  if(!G.length){flash('nothing to modulate yet — add a slot to a rack first');return;}
  DPICK={gi:0,si:0};
  const rt=dpickRoute();
  if(rt&&rt.addr){                                // open standing on where it already points
    const k=G.findIndex(x=>x.rack===rt.addr.rack);
    if(k>=0){DPICK.gi=k;
      const j=G[k].items.findIndex(d=>String(d.slot)===String(rt.addr.slot)&&d.key===rt.addr.key);
      if(j>=0)DPICK.si=j;}
  }
  dirty=true;
}
function renderDestPick(L,pre){
  const G=dpickGroups(); if(!G.length){DPICK=null;return;}
  DPICK.gi=clamp(DPICK.gi|0,0,G.length-1);
  const items=G[DPICK.gi].items;
  DPICK.si=clamp(DPICK.si|0,0,items.length-1);
  const rt=dpickRoute();
  L.push('');
  L.push('  '+sp('d','destination → ')+
    G.map((g,i)=>(i===DPICK.gi?sp('i',' '+g.rack+' '):sp('d',' '+g.rack+' '))).join(''));
  L.push('');
  const N=8, page=Math.floor(DPICK.si/N);
  for(let i=page*N;i<Math.min(items.length,page*N+N);i++){
    const d=items[i], sel=i===DPICK.si;
    const here=rt&&rt.addr&&rt.addr.rack===d.rack&&String(rt.addr.slot)===String(d.slot)&&rt.addr.key===d.key;
    const line=' '+pad(d.rack+slotNo(d.slot)+(d.typ&&d.typ!=='all'?' '+d.typ:''),14)
      +pad(d.lbl,10)
      +pad(d.rate==='audio'?'audio':d.rate==='ctrl'?'live':'next note',10)
      +(here?'● here':'');
    L.push('   '+(sel?sp('i',line):sp(here?'a':'d',line)));
  }
  if(items.length>N)L.push('   '+sp('d','   '+(page*N+1)+'-'+Math.min(items.length,page*N+N)+' of '+items.length));
  L.push('');
  L.push('   '+sp('d','←→ rack · ↑↓ param · enter picks · ⌫ clears it · esc closes')+
    sp('d','    '+destList(pre).length+' destinations live'));
}
function renderExplore(L,pre){
  const cat=pre.cat||'misc', pool=libAll().filter(en=>en.cat===cat);
  S.libSel=clamp(S.libSel||0,0,Math.max(0,pool.length-1));
  const page=Math.floor(S.libSel/10), pages=Math.max(1,Math.ceil(pool.length/10));
  L.push('  '+sp('d','library / ')+sp('a',cat)+sp('d','  ·  '+pool.length+' presets · page '+(page+1)+'/'+pages));
  L.push('');
  if(!pool.length)L.push('   '+sp('d','(empty — save or randomize some '+cat+' sounds first)'));
  for(let i=page*10;i<Math.min(pool.length,page*10+10);i++){
    const en=pool[i], sel=i===S.libSel, loaded=en.name===pre.name;
    L.push('   '+sp('d',((i%10+1)%10)+' ')+
      (sel?sp('i',' '+pad(en.name,10)):sp(loaded?'a':'d',' '+pad(en.name,10)))+
      (loaded?sp('a',' ● loaded'):'')+(en.factory?sp('d','  factory'):sp('d','  yours')));
  }
  L.push('');
  L.push('   '+sp('d','digits/↑↓ audition · ←→ page · letters play · ⌫ delete (yours only)'));
  if(S.libStash)L.push('   '+sp('a','enter = keep this sound')+sp('d','  ·  ')+
    sp('a','esc = back to your '+S.libStash.name)+sp('d','  (browsing never loses your sound)'));
}

/* The master IS a channel — it has a chain of inserts and a set of params,
   which is what every other channel has. It had its own page, its own key
   handling and its own idea of what a slot looks like; now it draws with the
   same chain row and the same param row, in the same place under the strip. */
/* A HELD OR LATCHED PAD OWNS THE RACK. The ten dj effects had no way in at
   all: masterRack drew the inserts and nothing else, and the editor that knew
   about S.mDj lived on the master PAGE, which is retired. Holding the pad you
   want to change is the obvious gesture — your hand is already on it — and
   latching one keeps it there while you work. */
function djEditing(){
  const held=Object.keys(djHeld).filter(k=>djHeld[k]);
  const latched=Object.keys(djLatch).filter(k=>djLatch[k]);
  const a=held.length?held:latched;
  return a.length?+a[a.length-1]:null;
}
function masterRack(L){
  if(!Array.isArray(S.master)){S.master=mkMaster(); dirtySave=true;}
  if(!Array.isArray(S.dj))S.dj=DJ0();
  L.push('');
  const dk=djEditing();
  if(dk!=null){
    const sl2=S.dj[dk]||(S.dj[dk]={typ:0,p1:0.3,p2:0.3,p3:0.5,mix:0.5});
    L.push('   '+sp('d',pad(' DJ pad',12))+
      DJKEYS.map((ch,i)=>spH(i===dk?'ri':(S.dj[i]&&S.dj[i].typ?'v k':'d k'),' '+ch+' ','dj',i)).join(' '));
    const specs2=[SP('fx','typ','enum',{opts:XTYPES})].concat(FX_P(sl2));
    S.mParam=clamp(S.mParam|0,0,specs2.length-1);
    const w2=clamp(Math.floor(88/specs2.length)-1,5,10);
    let l2='   ', v2='   ';
    specs2.forEach((sp2,i)=>{
      const foc=i===S.mParam;
      l2+=(foc?spH('a',' '+pad(sp2.lbl,w2),'mpr',i):spH('d',' '+pad(sp2.lbl,w2),'mpr',i))+' ';
      v2+=(foc?spH('i',' '+pad(fmtVal(sp2,getSP(sl2,sp2)),w2),'mpr',i)
             :spH('v k',' '+pad(fmtVal(sp2,getSP(sl2,sp2)),w2),'mpr',i))+' ';
    });
    L.push(''); L.push(l2); L.push(v2);
    return;
  }
  const items=[];
  S.master.forEach((sl,i)=>{
    if(sl.typ)items.push({i,label:XTYPES[sl.typ]+(Math.round(sl.rt)===1?'ˢ':'')});
  });
  const free=S.master.findIndex(sl=>!sl.typ);
  if(!items.length&&free>=0)items.push({i:free,label:'—',empty:true});
  const RW=Math.max(10,Math.floor(92/2));
  const n=Math.max(1,items.length), cw=Math.max(1,Math.floor(RW/n)), lit=cw>=3?cw-1:cw;
  let lab='   '+sp('d',pad(' Master',RW)), cells='   ';
  let used=0;
  for(const c of items){
    const on=c.i===(S.mSlot||0);
    cells+=spH(on?'i':(c.empty?'d k':'v k'),ctrIn(c.label,lit),'msl',c.i)+' '.repeat(cw-lit);
    used+=cw;
  }
  cells+=' '.repeat(Math.max(0,RW-used));
  L.push(lab); L.push(cells);
  L.push('');
  /* same param row as a slot rack, down to the '+' at the end */
  const sl=S.master[S.mSlot||0]||S.master[0];
  const specs=FX_P(sl).concat([SP('route','rt','enum',{opts:['mstr','send']})]);
  const extra=free>=0?1:0;
  S.mParam=clamp(S.mParam|0,0,Math.max(0,specs.length-1+extra));
  const w=clamp(Math.floor(88/Math.max(1,specs.length+extra))-1,5,10);
  let lr='   ', vr='   ';
  specs.forEach((sp2,i)=>{
    const foc=i===S.mParam;
    lr+=(foc?spH('a',' '+pad(sp2.lbl,w),'mpr',i):spH('d',' '+pad(sp2.lbl,w),'mpr',i))+' ';
    vr+=(foc?spH('i',' '+pad(fmtVal(sp2,getSP(sl,sp2)),w),'mpr',i)
           :spH('v k',' '+pad(fmtVal(sp2,getSP(sl,sp2)),w),'mpr',i))+' ';
  });
  if(extra){
    const i=specs.length, foc=i===S.mParam;
    lr+=sp('d',' '+pad('new',w))+' ';
    vr+=spH(foc?'i':'d k',' '+pad('+',w),'mpr',i)+' ';
  }
  L.push(lr); L.push(vr);
}
const getSP=(o,spec)=>spec.get?spec.get(o):o[spec.key];
function renderMaster(L){
  if(!Array.isArray(S.master)){S.master=mkMaster(); dirtySave=true;
    flash('master rack was malformed — rebuilt from defaults');}
  const onDj=S.mDj!=null;
  let tabs='  ';
  S.master.forEach((sl2,i)=>{
    const ab=sl2.typ?XTYPES[sl2.typ]:'···';
    const lbl=` ${(i+1)%10}${ab}${sl2.typ?(Math.round(sl2.rt)===1?'ˢ':'ᵐ'):''} `;
    tabs+=(!onDj&&i===(S.mSlot||0)?spH('i',lbl,'msl',i):(sl2.typ?spH('a',lbl,'msl',i):spH('d',lbl,'msl',i)));

    djr+=(onDj&&i===S.mDj?spH('i',lbl,'dj',i):on?spH('r',lbl,'dj',i):(sl2.typ?spH('a',lbl,'dj',i):spH('d',lbl,'dj',i)));
  });
  L.push(djr+sp('d',' hold=audition ⇧=latch'));

  const sl=onDj?S.dj[S.mDj]:S.master[S.mSlot||0];
  const specs=onDj?FX_P(sl):FX_P(sl).concat([SP('route','rt','enum',{opts:['mstr','send']})]);
  S.mParam=Math.min(S.mParam||0,specs.length-1);
  let lr='   ', vr='   ';
  specs.forEach((pspec,i)=>{
    const foc=i===S.mParam;
    const v=fmtVal(pspec,sl[pspec.key]??0);
    lr+=(foc?spH('a','▸'+pad(pspec.lbl,9),'mst',i):spH('d',' '+pad(pspec.lbl,9),'mst',i))+' ';
    vr+=(foc?spH('i',' '+pad(v,9),'mst',i):spH('v',' '+pad(v,9),'mst',i))+' ';
  });
  L.push(lr); L.push(vr);
  L.push('');
  L.push('   '+sp('d','digits = master slots · letters = dj pads (a s d f g h j k l ;) · ↑↓ value · ⌫ '+(onDj?'reset pad':'clear')));
  L.push('   '+sp('d','route: ˢsend = parallel bus (channels feed it via an fx \'send\' slot) · ᵐmstr = mix insert'));
  L.push('   '+sp('d','dj pads play from ARRANGE: hold = momentary · shift = latch · rec/edit = automation (≈)'));
}

/* the picker, drawn like every other rack: a row of cells, one lit */
/* TWO LINES. This had grown a title, two lines of instructions, a blank, the
   slots, and a status line — seven rows of screen to choose between ten
   things. The keys live in ? like everything else; what belongs here is the
   name of what you are doing, the slots, and a warning when one is coming. */
function pickerRack(L){
  const slots=sessAll();
  const n=(PICK.sel+1)%10;
  if(PICK.mode==='export'){
    const opts=[['set','the whole instrument as a .json — reload it anywhere'],
                ['mixdown','one stereo wav of the master, rendered by playing it'],
                ['channels','the master plus a wav per channel, all in one pass']];
    L.push('   '+sp('a','EXPORT')+sp('d','   ←→ or 1-3 · enter · esc'+
      (PICK.sel?'   ·   '+Math.round(Math.max(...S.patterns[S.curPat].lanes.map(l=>l.len||0),4)*spb()+2.5)+'s in real time':'')));
    let row='   ';
    opts.forEach((o,i)=>{row+=spH(i===PICK.sel?'i':'d k',' '+(i+1)+' '+o[0]+' ','exp',i)+' ';});
    L.push(row);
    L.push('   '+sp('d',opts[PICK.sel][1]));
    return;
  }
  if(PICK.mode==='bak'){
    const B=bakAll();
    L.push('   '+sp('a','GO BACK')+(PICK.confirm
      ?sp('r','   enter again — this replaces what is on the desk')
      :sp('d','   automatic snapshots · ←→ or digits · enter · b returns · esc')));
    if(!B.length){L.push('   '+sp('d','(nothing yet — the ring fills as you work)')); return;}
    let row='   ';
    B.forEach((b,i)=>{const on=i===PICK.sel;
      row+=spH(on?(PICK.confirm?'ri':'i'):(b.n>0?'v k':'d k'),
        ' '+((i+1)%10)+' '+bakAge(b.t)+'·'+b.n+'n ','bak',i)+' ';});
    L.push(row);
    L.push('   '+sp('d',(B[PICK.sel]?B[PICK.sel].why:'')));
    return;
  }
  if(PICK.mode==='new'){
    L.push('   '+sp('r','NEW SET')+sp('d','   every lane empty · tempo, key and settings stay · enter · esc'
      +(noteCount()>0?'   ·  b = go back to a snapshot':'')));
    L.push(''); return;
  }
  let head='   '+sp('a',PICK.mode==='save'?'SAVE SET':'LOAD SET');
  if(PICK.del===PICK.sel)      head+=sp('r','   ⇧⌫ again deletes slot '+n);
  else if(PICK.confirm)        head+=sp(PICK.mode==='save'?'r':'a','   enter '+
    (PICK.mode==='save'?'overwrites slot '+n:'starts a new set in slot '+n));
  else if(PICK.peek)           head+=sp('d','   looking inside slot '+n+' — nothing is loaded');
  else if(PICK.gen===PICK.sel) head+=sp('r','   / again writes a whole new song over slot '+n);
  else                         head+=sp('d','   enter '+(PICK.mode==='save'?'saves':'loads')+
    (PICK.mode==='load'?' · ⇧ looks inside':'')+' · / generates · ⇧⌫ deletes · esc');
  L.push(head);
  let row='   ';
  for(let i=0;i<10;i++){
    const on=i===PICK.sel, has=!!slots[i];
    row+=spH(on?((PICK.confirm||PICK.del===i)?'ri':'i'):has?'v k':'d k',
      ' '+((i+1)%10)+(has?slots[i].at.slice(5,10):' new ')+' ','sess',i)+' ';
  }
  L.push(row);
}
function settingsRack(L){
  /* The same shape as a rack: a row of named groups, then the row belonging to
     the group you are in. Thirty entries on one line was something you scanned
     rather than read — now you go to the group, then to the thing. SETS is a
     group like any other, because a saved set is just another thing this
     screen holds. */
  const cur=SETTINGS[S.setSel||0]||SETTINGS[0];
  const groups=SETSECT.map(n=>({n,items:SETTINGS.filter(x=>x.g===n)})).filter(g=>g.items.length);
  {const RW=Math.max(10,Math.floor(92/(groups.length+1)));
   let lab='   ', cells='   ';
   for(const g of groups){
     const on=g.n===cur.g;
     lab+=sp('d',pad(' '+g.n,RW));
     cells+=spH(on?'i':'v k',ctrIn(g.n.toLowerCase(),RW-1),'sgrp',SETSECT.indexOf(g.n))+' ';
   }
   L.push(lab); L.push(cells);}
  L.push('');
  {const here=SETTINGS.filter(x=>x.g===cur.g);
   const w=clamp(Math.floor(88/Math.max(1,here.length))-1,5,10);
   let lr='   ', vr='   ';
   here.forEach(it=>{
     const i=SETTINGS.indexOf(it), foc=i===(S.setSel||0);
     lr+=(foc?spH('a',' '+pad(it.n,w),'set',i):spH('d',' '+pad(it.n,w),'set',i))+' ';
     vr+=(foc?spH('i',' '+pad(it.v(),w),'set',i):spH('v k',' '+pad(it.v(),w),'set',i))+' ';
   });
   L.push(lr); L.push(vr);}
  /* The row of set slots that used to sit here, with its own digit-picks /
     ⇧digit-saves rules, is gone: sets have ⌘S and ⌘L and a picker of their
     own, and two ways to do the same thing is one too many. The key hints went
     with it — a settings screen should show what the settings ARE. What stays
     is the live HID readout, because that is state rather than explanation. */
  {const C=HE.cfg();
   if(HE.on)L.push('   '+sp('a','   '+HE.srcName)+sp('d','  frames ')+sp(HE.fps<125?'r':'a',HE.fps+'Hz')+
     sp('d','  last vel ')+sp('a',String(Math.round(HE.lastVel*127)))+
     sp('d','  slope '+C.soft.toFixed(3)+'…'+C.hard.toFixed(3)+(C.auto?' (auto)':'')));
   if(HE.learn)L.push('   '+sp('ri',' LEARN ')+sp('a',' press '+HE.learn.order[HE.learn.i]+' on the keyboard')+
     sp('d','   esc cancels'));}
}

function renderHelp(L){
  /* Rewritten against the build rather than accumulated on top of it. The old

     were longer than that — the overflow ran off the layout rather than
     wrapping, so the ends of the sentences were simply not there. Narrower
     column, and anything still too long wraps under itself at a word break. */
  const KW=22, W2=W-KW-5;
  for(const [k,d] of rows){
    if(!d){L.push('   '+sp('a',k)); continue;}
    const words=String(d).split(' ');
    const lines=['']; 
    for(const w of words){
      const i=lines.length-1;
      if((lines[i]+' '+w).trim().length<=W2)lines[i]=(lines[i]+' '+w).trim();
      else lines.push(w);
    }
    lines.forEach((ln,i)=>L.push('   '+sp('a',pad(i?'':k,KW))+' '+sp('d',ln)));
  }

let lastR=0, lastF=0, cpuLoad=0;
/* MODULATION DOES NOT BELONG TO THE RENDERER. This rode the animation frame,
   so every control-rate route — an fx mix, a delay time, an LFO's rate, an
   envelope shape — moved at whatever rate the screen happened to be drawing,
   stalled when the UI was busy and stopped dead when the tab went to the
   background. Its own clock, faster than a frame and independent of one.
   It is still a main-thread clock; making it sample-accurate is what moving
   the DSP onto the audio thread buys. */
setInterval(()=>{try{engine.modTick();}catch(_){}
                 try{engine.autoTick();}catch(_){}},8);
(function raf(t){
  requestAnimationFrame(raf);
  if(lastF){                       // main-thread load: how far frames stretch past 60fps
    const gap=t-lastF;
    if(gap<500)cpuLoad=cpuLoad*0.95+clamp((gap-17)/17,0,1)*100*0.05;
  }
  lastF=t;
  eraseSweep();
  if(T.playing)finalizeCaptures(false);
  if(!T.playing&&t-lastR>250)dirty=true;   // keep the cpu meter live while idle
  if((T.playing||dirty)&&t-lastR>33){lastR=t;dirty=false;render();}
})(0);
</script>
