/* ---------------- undo / redo ---------------------------------------
   Snapshot-based. Structural user actions push; mod-loop playback (which
   also writes params through applyParam) never does. */
const UNDO={stack:[],redo:[],lastLabel:'',lastAt:0};
function pushUndo(label){
  /* The latched roll fires every cycle. Left in the history it becomes the
     history — one bar of jamming and every step you actually took is off the
     end of the 60-deep stack. A performance is not an edit. */
  if(AUTORND.firing)return;
  const now=performance.now();
  if(label===UNDO.lastLabel&&now-UNDO.lastAt<1500){UNDO.lastAt=now;return;}  // collapse knob turns etc
  UNDO.stack.push({label,snap:serialize()});
  if(UNDO.stack.length>60)UNDO.stack.shift();
  UNDO.redo.length=0; UNDO.lastLabel=label; UNDO.lastAt=now;
}
function doUndo(){
  const u=UNDO.stack.pop();
  if(!u){flash('nothing to undo');return;}
  UNDO.redo.push({label:u.label,snap:serialize()});
  load(u.snap); UNDO.lastLabel='';
  flash('undo: '+u.label); dirty=true; dirtySave=true;
}
function doRedo(){
  const u=UNDO.redo.pop();
  if(!u){flash('nothing to redo');return;}
  UNDO.stack.push({label:u.label,snap:serialize()});
  load(u.snap); UNDO.lastLabel='';
  flash('redo: '+u.label); dirty=true; dirtySave=true;
}

      {SETTINGS[S.setSel||0].a(c==='ArrowUp'?1:-1);saveCfg();dirty=true;}
    else if(/^Digit\d$/.test(c)&&!e.repeat){        // ten song slots: digit selects, enter loads
      const n=+c.slice(5), i=n===0?9:n-1, slots=sessAll();
      if(rs(e)){                               // save / overwrite here
        slots[i]={at:new Date().toISOString().slice(0,10),snap:serialize(),cfg:{...CFG}};
        sessStore(slots); S.sessSel=i;
        flash('song saved → slot '+n+' (tempo+key+settings included · audio buffers not)');
      }else{
        S.sessSel=i;
        flash(slots[i]?'song '+n+' ('+slots[i].at+') — enter loads · ⇧'+n+' overwrites · ⌫ clears'
          :'slot '+n+' empty — shift+'+n+' saves the current song here');
      }
      dirty=true;
    }
    else if(c==='Backspace'&&!e.repeat&&S.sessSel!=null){
      const slots=sessAll();
      if(slots[S.sessSel]){slots[S.sessSel]=null;sessStore(slots);
        flash('slot '+((S.sessSel+1)%10)+' cleared');dirty=true;}
    }
    else if(c==='Slash'&&!e.repeat){                // '/' in SESSION = generate a whole song (⇧⌥ = wild)
      pushUndo('song gen'); genSong(rs(e)&&e.altKey); S.layer=0;
    }
    else if(c==='Space'&&!e.repeat)T.playing?stop():play();
    return;
  }

  if(c==='Space'){e.preventDefault(); if(!e.repeat)T.playing?stop():play(); return;}
  if(c==='Tab'){e.preventDefault();
    if(!e.repeat){
      /* pressing the button that is currently latched RELEASES it — the way
         out is the same key you came in on, no special chord to remember */
      if(LATCH.on&&!KM.sl){
        latchReleaseAll(); flash('rec unlatched');
        dirty=true; dirtySave=true; return;
      }
      HOLD.tab=true; HOLD.tabAt=performance.now(); HOLD.tabUsed=false;
      HOLD.tabLatch=KM.sl;                     // may still become true at latch-down
      if(KM.sl)LATCH.used=true;
      const mode=CFG.looper||0, noteCh=S.layer>=2?S.editSnd:S.curPreset;
      if(S.layer>=1&&isAudioCh(noteCh)){                 // audio channel: tab = mic record
        if(engine.audRec)engine.audRecStop();
        else{pushUndo('audio take');engine.audRecStart(noteCh);}
      }
      /* retro used to fire here, so every hold also grabbed a take. It fires
         on release now, and only if the hold was short and did nothing else. */
      else if(mode===0&&S.layer>=1){
        const pat2=S.patterns[S.editPat];
        if(pat2.state!=='rec'){pushUndo('take');pat2.state='rec';}
      }
      else if(S.layer>=1){                               // pattern rec — notes, in pattern AND sound layers
        const pat=S.patterns[S.editPat];
        if(mode===2){const was=pat.state;pat.state=pat.state==='rec'?'on':'rec';   // latch
          if(was==='rec')finalizeCaptures(true); else pushUndo('take');}
        else if(pat.state!=='rec'){pushUndo('take');pat.state='rec';}              // momentary arm
        /* In a sound layer the same key also arms the channel's MOD LOOP, so
           holding it and moving a param records the move. Nothing ever set
           this state — cycleState() was written for it and never wired up —
           so parameter automation had no way to be armed at all. */
        if(S.layer>=2&&!isAudioCh(S.editSnd)){
          const ml=S.presets[S.editSnd].modLoop;
          if(mode===2)ml.state=ml.state==='rec'?'on':'rec';
          else if(ml.state!=='rec')ml.state='rec';
          if(ml.state==='rec'&&!T.playing)
            flash('● armed — press space; automation records against the loop');
        }
      }
      dirty=true;dirtySave=true;}
    return;}
  if(c==='Enter'){e.preventDefault(); if(!e.repeat)diveIn(); return;}
  if(c==='Escape'){e.preventDefault();
    if(HE.cancelLearn())return;
    const h=curHolder();
    if(S.layer===3&&MODULES[S.curMod].prs&&S.libStash){   // leaving explorer: restore what you came in with
      const st=S.libStash; S.libStash=null;
      if(JSON.stringify(st.data)!==JSON.stringify(presetData(S.presets[S.editSnd]))){
        applyPresetData(S.editSnd,st.name,st.cat,st.data);
        flash('↩ back to your '+st.name);
      }
    }
    if(rs(e))S.layer=0;
    else if(h.state==='edit')h.state='on';
    else if(S.layer===0){S.layer=-1;S.sessSel=null;}  // up from arrange = session (nothing preselected)
    else surface();
    dirty=true; return;}
  if(c==='CapsLock'){e.preventDefault(); return;}   // the state is read, not toggled
  if(c==='Backquote'){e.preventDefault();
    if(!e.repeat){HOLD.r=true; HOLD.rUsed=false; HOLD.rLatch=KM.sl; if(KM.sl)LATCH.used=true;}
    return;}
  if(c==='Slash'){e.preventDefault();      // legacy alias for `
    if(!e.repeat)roll(rs(e)?(e.altKey?'wild':'fresh'):'var');
    return;}
  if(S.layer===0&&DJCODE[c]!==undefined){e.preventDefault();     // DJ pads: full home row
    if(e.repeat)return;
    const k=DJCODE[c];
    if(!rs(e)&&S.arr.state==='edit'){                        // edit: toggle a dj block at the cursor
      pushUndo('dj place');
      const cell=cellOf(S.arr), t0=curCell(S.arr)*cell;
      const ex=S.arr.events.findIndex(ev=>ev.dj===k&&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
      if(ex>=0)S.arr.events.splice(ex,1);
      else S.arr.events.push({t:t0,dj:k,dur:cell});
      dirtySave=true; djApply(); return;
    }
    if(!rs(e)&&!djLatch[k]&&S.arr.state==='rec'&&T.playing)
      djRecStart[k]=posNow();                                     // record the fx move into the arrangement
    djPress(k,rs(e)); return;}
  if(c==='Comma'||c==='Period'){
    const d=c==='Period'?1:-1;
    if(S.layer===1&&!rs(e)){          // quick channel volume in the pattern layer
      const p=S.presets[S.curPreset];
      p.mix.lvl=clamp(Math.round((p.mix.lvl+d*0.05)*100)/100,0,1);
      engine.refresh(S.curPreset);
      flash(p.name+' vol '+Math.round(p.mix.lvl*100)+'%');
      dirty=true; dirtySave=true; return;
    }
    setBpm(T.bpm+d*(rs(e)?10:1)); return;
  }
  if(c==='KeyM'){
    if(!e.repeat){HOLD.m=true; HOLD.mUsed=false;}
    return;}
  if(c==='KeyB'&&!e.repeat){                        // tap tempo
    const n2=performance.now();
    taps=taps.filter(t2=>n2-t2<3000); taps.push(n2);
    if(taps.length>=2){
      const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);
      setBpm(Math.round(60000/iv));
      flash('tap → '+T.bpm+'bpm ('+taps.length+')');
    }else flash('tap…');
    return;}
  if(c==='KeyT'&&S.layer===0&&!e.repeat){        // t = timeline on/off (focus mode)
    S.arrOn=S.arrOn===false?true:false;
    flash(S.arrOn?'timeline ON — arrangement drives the song':'timeline OFF — looping the current pattern');
    dirty=true; dirtySave=true; return;}
  if(c==='KeyQ'&&!e.repeat){                     // q = live-quantize toggle, everywhere
    if(rs(e)&&S.layer===1){                 // shift+Q = snap the selected lane NOW
      pushUndo('quantize');
      const lane=S.patterns[S.editPat].lanes[S.curPreset];
      const st=lane.qlive??1;
      lane.events.forEach(ev=>{ev.t=fmod(ev.t+(Math.round(ev.t/0.25)*0.25-ev.t)*st,lane.len);});
      flash('lane '+S.curPreset+' snapped to the grid');
      dirty=true; dirtySave=true; return;
    }
    CFG.qOn=CFG.qOn?0:1; saveCfg();
    flash('live quantize '+(CFG.qOn?'ON':'OFF')+' — what you hear is what records');
    dirty=true; return;}

  const lp=curLoop();
  if(c==='Minus'||c==='Equal'){        // loop length only — values live on the arrows
    const d=c==='Equal'?1:-1;
    if(rs(e)){                    // shift = nudge the content within the loop
      if(S.layer===1&&isAudioCh(S.curPreset)){flash('audio lanes can’t nudge yet');return;}
      if(!lp.events.length){flash('nothing to nudge');return;}
      pushUndo('nudge');
      const u=UNITS[lp.unit]||1, amt=(e.altKey?0.5:1)*u*d, L=lp.len;
      lp.events.forEach(ev=>ev.t=fmod(ev.t+amt,L));
      flash('↔ nudge '+(d>0?'+':'−')+(e.altKey?u/2:u)+' beat'+(u*(e.altKey?0.5:1)>1?'s':'')+
        ' ('+lp.unit+(e.altKey?'/2':'')+')');
      dirty=true; dirtySave=true; return;
    }
    pushUndo('length');

    dirty=true; dirtySave=true; return;

  if(c==='BracketLeft'){pushUndo('length');lp.halve(); if(S.layer===1)lp.auto=false; dirty=true;dirtySave=true;return;}
  if(c==='BracketRight'){pushUndo('length');lp.double(!rs(e)); if(S.layer===1)lp.auto=false; dirty=true;dirtySave=true;return;}
  if(c==='Backslash'){pushUndo('length');lp.cycleUnit(); if(S.layer===1)lp.auto=false; dirty=true;dirtySave=true;return;}

  if(c==='Backspace'&&HOLD.tab){e.preventDefault();
    if(loopOps(e,c,curLoop()))HOLD.tabUsed=true;
    return;}
  if(c==='Backspace'){e.preventDefault();
    if(e.repeat)return;
    if(rs(e)){clearTimeout(delHoldTimer);delHoldTimer=setTimeout(layerInit,800);}
    if(S.layer>=2&&!rs(e)&&MODULES[S.curMod].prs){   // reset the focused kit pad
      const p=S.presets[S.editSnd], K=edKit(p);
      if(K){pushUndo('kit pad');
        p.kit[pcOf(S.prepFocus)]=null; kitSlot(p,S.prepFocus);
        flash('pad '+NN[pcOf(S.prepFocus)]+' reset'); dirty=true; dirtySave=true; return;}
    }
    if(S.layer===0&&rs(e)){          // clear everything inside the selected pattern
      pushUndo('pattern clear');
      const p=S.patterns[S.curPat];
      p.lanes.forEach(l=>{l.clear();delete l._cap;});
      retroBuf.forEach(b=>b.length=0);
      flash('pattern '+S.curPat+' cleared (all lanes)');
      dirty=true; dirtySave=true; return;}
    if(inEdit()){
      pushUndo('cell clear');
      const cell=cellOf(lp), t0=curCell(lp)*cell;
      if(S.layer===3)lp.clear(ev=>ev.m===S.curMod&&(ev.s??-1)===S.curSlot&&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
      else if(S.layer===2)lp.clear(ev=>ev.m===S.curMod&&(ev.s??-1)===S.curSlot&&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
      else lp.clear(ev=>ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
      dirty=true; dirtySave=true; return;}
    const recing=T.playing&&curHolder().state==='rec'&&S.layer>0;
    if(recing&&!rs(e)){
      eraseHold={sweep:posNow(),bornAt:performance.now()};
      flash('erasing while held'); return;}
    if(S.layer===0){pushUndo('timeline clear');lp.clear();flash('timeline cleared');}
    else if(S.layer===1){
      if(rs(e)){pushUndo('lane clear');lp.clear();retroBuf[S.curPreset]=[];   // length survives — only tab+⇧⌫ clears that
        flash('lane '+S.curPreset+' cleared'+(lp.auto?'':'  (still '+(lp.count%1?lp.count.toFixed(2):lp.count)+'×'+UNIT_NAMES[lp.unit]+')'));}
      else if(T.playing){muteHold={lane:S.curPreset};engine.chokeSeq(S.curPreset);
        flash('holding '+S.presets[S.curPreset].name+' silent — ⇧⌫ clears');return;}
      else{flash('⇧⌫ clears the lane');return;}
    }
    else if(S.layer===3&&MODULES[S.curMod].prs){   // explorer: delete selected user preset
      const p=S.presets[S.editSnd], pool=libAll().filter(en=>en.cat===(p.cat||'misc'));
      const en=pool[S.libSel||0];
      if(!en){flash('nothing selected');}
      else if(en.factory){flash(en.name+' is a factory preset');}
      else{
        libStore(libAll().filter(x=>x.name!==en.name));
        S.libSel=Math.max(0,(S.libSel||0)-1);
        flash('deleted '+en.name+' from library');
      }
      dirty=true; return;}
    else if(S.layer===2&&rs(e)){pushUndo('mod clear');curHolder().clear(ev=>ev.m===S.curMod);flash('mod points cleared');}
    else if(S.layer===3&&rs(e)){pushUndo('mod clear');curHolder().clear(ev=>ev.m===S.curMod&&(ev.s??-1)===S.curSlot);flash('slot mod points cleared');}
    else {resetParam();return;}
    dirty=true; dirtySave=true; return;}

  if(/^Digit\d$/.test(c)&&HOLD.tab&&S.layer>=1){
    e.preventDefault();
    if(!e.repeat){
      HOLD.tabUsed=true;
      const bars=(+c.slice(5))||10;                  // 0 = ten bars
      retroBars(bars);
    }
    return;
  }
  if(/^Digit\d$/.test(c)){
    const n=+c.slice(5);
    if(S.layer===0){
      if(S.arr.state==='edit'){
        pushUndo('place');
        const cell=cellOf(S.arr), t0=curCell(S.arr)*cell;
        S.arr.clear(ev=>ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
        S.arr.events.push({t:t0,pattern:n});
        stepCur=(curCell(S.arr)+1)%stepCells(S.arr);
        dirty=true; dirtySave=true; return;}
      if(n===0&&S.curPat===0&&!S.mSel&&S.arr.state!=='rec'){  // 0 again on pattern 0 = select MASTER
        S.mSel=true; dirty=true; return;}
      S.mSel=false; S.curPat=n;
      if(T.playing)requestSwitch(n,posNow());
      if(S.arr.state==='rec'&&T.playing){
        const L=S.arr.len, t=fmod(qz(fmod(posNow(),L),1),L);
        S.arr.clear(ev=>Math.abs(ev.t-t)<1e-6);
        S.arr.events.push({t,pattern:n}); dirtySave=true;
      }
    }
    else if(S.layer===1){
      const l2=S.patterns[S.editPat].lanes[n];
      if(rs(e)||e.altKey){
        const kind=rs(e)?'solo':'mute';
        if(e.repeat)return;
        /* Latch held or not: a control that is already ON comes off. It used to
           exclude the latch case, so latch+digit could only ever turn things ON
           and the only way back was tapping latch to clear the whole desk. */
        const other=kind==='solo'?'mute':'solo';
        if(l2[kind]&&!MOM[n]){                       // already latched: this releases it
          l2[kind]=false;
          flash('lane '+n+' '+S.presets[n].name+' '+kind.toUpperCase()+' off');
        }else{
          MOM[n]={kind,prev:l2[kind],latch:KM.sl,prevOther:l2[other]};
          if(KM.sl)LATCH.used=true;
          /* you cannot both insist on a channel and silence it — asking for one
             withdraws the other, rather than leaving the pair contradicting */
          l2[kind]=true; l2[other]=false;
          flash('lane '+n+' '+kind+(KM.sl?' — latching':''));
        }
        dirty=true; dirtySave=true;
      }else if(n===0){                     // 0 = the master strip, at the row's end
        S.mSel=true; S.layer=-2; S.mSlot=S.mSlot||0; S.mDj=null; S.mParam=0;
        flash('master'); dirty=true;
      }else if(n===S.curPreset){           // same digit again = mute toggle
        l2.mute=!l2.mute;
        flash('lane '+n+' '+S.presets[n].name+(l2.mute?' MUTED':' on'));
        dirtySave=true;
      }else S.curPreset=n;
    }
    else if(S.layer===2){
      const mi2=n===0?9:n-1;
      if(!MODULES[mi2].id){flash('reserved for future racks');return;}
      S.curMod=mi2;S.curParam=0;S.curSlot=0;S.slotParam=0;}
    else if(MODULES[S.curMod].prs){        // explorer: digit loads the nth entry on the page
      const p=S.presets[S.editSnd], pool=libAll().filter(en=>en.cat===(p.cat||'misc'));
      const idx=Math.floor((S.libSel||0)/10)*10+(n===0?9:n-1);
      if(pool[idx]){S.libSel=idx;applyPresetData(S.editSnd,pool[idx].name,pool[idx].cat,pool[idx].data);flash('loaded '+pool[idx].name);}
    }
    else {
      const si=n===0?9:n-1, M=MODULES[S.curMod];
      if(si===S.curSlot&&M.slot&&!M.prs){        // same slot again = bypass on/off
        const sl=modHolder(S.presets[S.editSnd],M.id)[M.id][si];
        pushUndo('bypass');
        sl.off=sl.off?0:1;
        engine.rebuildRack(S.editSnd); engine.refresh(S.editSnd);
        if(M.id==='osc')engine.oscLive(S.editSnd,'off');   // mute the operator now, not next note
        flash(M.name+' slot '+((si+1)%10)+(sl.off?' BYPASSED':' back on'));
        dirtySave=true;
      }else S.curSlot=si;      // hold the param index, as shift+←→ does; curAddr clamps
    }
    dirty=true; return;
  }

  if((c==='ArrowLeft'||c==='ArrowRight'||c==='ArrowUp'||c==='ArrowDown')&&
     (HOLD.tab||HOLD.m||HOLD.c||HOLD.n||HOLD.r||HOLD.i)){
    e.preventDefault();
    const dv=(c==='ArrowUp'||c==='ArrowRight')?1:-1, vert=c==='ArrowUp'||c==='ArrowDown';
    if(HOLD.r){                                    // how loaded the dice are — one global number
      if(vert){CFG.wild=clamp(Math.round((CFG.wild??35)+dv*(rs(e)?1:5)),0,100);
        saveCfg(); flash('wild '+CFG.wild+'%'); HOLD.rUsed=true; dirty=true;}
      return;
    }
    if(HOLD.c){                                    // CHANNEL: this channel's place in the mix
      const pc=S.presets[S.layer>=2?S.editSnd:S.curPreset];
      if(vert){const st=rs(e)?0.01:0.1;
        pc.mix.lvl=clamp(Math.round((pc.mix.lvl+dv*st)*100)/100,0,1);
        flash(pc.name+' vol '+Math.round(pc.mix.lvl*100)+'V');
      }else{
        pc.mix.pan=clamp(Math.round((pc.mix.pan+dv*(rs(e)?0.02:0.1))*100)/100,-1,1);
        flash(pc.name+' pan '+panCh(pc.mix.pan).trim());
      }
      engine.refresh(S.layer>=2?S.editSnd:S.curPreset);
      HOLD.cUsed=true; dirty=true; dirtySave=true; return;
    }
    if(HOLD.i){                                    // INST: which sound this channel IS
      if(vert&&rs(e))      instAction('engine',dv);
      else if(vert)        instAction('prst',dv);
      else if(rs(e))       instAction('model',dv);
      else                 instAction('type',dv);
      HOLD.iUsed=true; return;
    }
    if(HOLD.n){                                    // NOTES: the pitch of what this channel plays
      const pi2=S.layer>=2?S.editSnd:S.curPreset, pn=S.presets[pi2];
      if(vert&&rs(e)){                             // ...and how hard, since that is a note property too
        EXP.bump(dv*0.05);
        flash('vel '+Math.round(clamp(CFG.kvel??0.9,0.02,1)*127));
      }
      else if(vert){pn.tr=clamp((pn.tr||0)+dv,-3,3); flash(pn.name+' '+trLabel(pn));}
      else{pn.trs=clamp((pn.trs||0)+dv,-12,12); flash(pn.name+' '+trLabel(pn));}
      HOLD.nUsed=true; dirty=true; dirtySave=true; return;
    }
    if(HOLD.m){                                    // tempo: shift ×10, option ×0.1
      if(c==='ArrowUp'||c==='ArrowDown'){
        const step=e.altKey?0.1:rs(e)?10:1, d2=c==='ArrowUp'?1:-1;
        setBpm(Math.round((T.bpm+step*d2)*10)/10);
        flash('bpm '+T.bpm); HOLD.mUsed=true; dirty=true; dirtySave=true;
      }
      return;
    }
    if(loopOps(e,c,curLoop()))HOLD.tabUsed=true;
    return;
  }
  if(c==='ArrowLeft'||c==='ArrowRight'){e.preventDefault();
    const d=c==='ArrowRight'?1:-1;
    if(inEdit()&&S.layer!==1&&!(rs(e)&&S.layer>=2)){
      /* EDIT owns the plain arrows (they walk the loop cells), but it used to
         swallow shift too — so in EDIT you could change neither slot nor param
         and could only ever place points on whatever was already focused. */
      const l2=curLoop(); stepCur=fmod(curCell(l2)+d,stepCells(l2));
    }
    else if(S.layer===0){
      if(rs(e)){                            // ⇧←→ = jump between parts (master at the end)
        if(S.mSel&&d<0){S.mSel=false;S.curPat=9;}
        else if(S.mSel&&d>0){S.mSel=false;S.curPat=0;}
        else if(S.curPat+d>9||S.curPat+d<0)S.mSel=true;
        else S.curPat=S.curPat+d;
        if(!S.mSel&&T.playing)requestSwitch(S.curPat,posNow());
      }else S.arrParam=fmod((S.arrParam||0)+d,ARRP.length);
    }
    else if(S.layer===1){S.curPreset=CH_LOW+fmod(S.curPreset-CH_LOW+d,10-CH_LOW); stepWalked=false;}
    else if(S.layer===2){
      /* Params flow left to right and spill into the next rack at the ends —
         the same gesture whether the rack is flat or holds slots. shift picks
         the SLOT, because digits already pick the rack and doing it twice left
         slots with no control of their own. On a rack with no slots shift still
         jumps rack, so the chord is never dead. */
      const pre2=S.presets[S.editSnd];
      const stepMod=dir=>{                       // next rack that actually exists
        let i=S.curMod,g=0;
        do{ i=fmod(i+dir,MODULES.length); g++; }while(!MODULES[i].id&&g<MODULES.length);
        return i;
      };
      const nParams=mi2=>{
        const M2=MODULES[mi2];
        if(M2.prs)return prsFieldDefs().length;
        if(M2.flat)return M2.flat.length;
        if(M2.id==='osc'&&isCodeCh(S.editSnd))return CODEF().length;
        if(M2.id==='osc'&&isAudioCh(S.editSnd))return AUDF.length;
        if(M2.slot)return paramsFor(mi2,modHolder(pre2,M2.id)[M2.id][S.curSlot]).length;
        return 1;
      };
      const setParam=(mi2,px)=>{ if(flatView(mi2))S.curParam=px; else S.slotParam=px; };
      if(rs(e)){
        /* ONE list of slots, across all three sections. Racks used to be pages
           you jumped between with a separate gesture; now the only structure
           you move through is the chain itself, in the order it runs. Landing
           on '+' selects the first free slot in that section, so opening a new
           one is the same key as reaching the end of the row. */
        const chips=chipList(pre2);
        if(chips.length){
          gotoChip(chips[fmod(chipIndex(chips)+d,chips.length)]);
          S.curParam=0;
        }
      }else{
        const cur=flatView(S.curMod)?S.curParam:S.slotParam;
        const np=cur+d;
        if(np>=0&&np<nParams(S.curMod))setParam(S.curMod,np);
        else{
          S.curMod=stepMod(d);

        }

    }
    else if(MODULES[S.curMod].prs){        // explorer: page

    }
    else{
      const pre=S.presets[S.editSnd], M=MODULES[S.curMod], hold=modHolder(pre,M.id);
      const specs=paramsFor(S.curMod,hold[M.id][S.curSlot]);   // same holder the render uses
      const np=S.slotParam+d;
      if(rs(e)||np<0||np>=specs.length){  // ran off the end: next slot, same strip
        S.curSlot=fmod(S.curSlot+d,10);
        const s2=paramsFor(S.curMod,hold[M.id][S.curSlot]);
        S.slotParam=(rs(e)||d>0)?0:s2.length-1;

    dirty=true; return;}
  if(c==='ArrowUp'||c==='ArrowDown'){e.preventDefault();
    const d=c==='ArrowUp'?1:-1;
    if(S.layer===1){
      /* The grid runs top to bottom, so down means LATER. Walking into it is
         also how you get in: there is no mode to arm, you just move onto a
         step and start typing notes. (transpose moved to ⌥↑↓, volume to ⇧↑↓) */
      const pat1=S.patterns[S.editPat], lane1=pat1.lanes[S.curPreset];
      if(isAudioCh(S.curPreset)){flash('audio channel — no steps to edit');return;}
      /* Walking the grid no longer switches modes — caps lock owns that, and
         two ways into one mode meant they could disagree. The cursor still
         picks itself up from under the playhead the first time you move it. */
      const entering=!stepWalked;
      stepWalked=true;
      if(entering&&T.playing){
        /* the box was riding the playhead — freeze it exactly there instead of
           snapping to wherever the cursor happened to be parked last time */
        stepCur=Math.floor(fmod(posNow()-editAnchor(),lane1.len)/cellOf(lane1));
      }else stepCur=fmod(curCell(lane1)-d,stepCells(lane1));
      dirty=true; return;}
    if(S.layer===2&&MODULES[S.curMod].id==='osc'&&isCodeCh(S.editSnd)){
      pushUndo('code'); codeAction(d,kmult(e)); return;}
    if(S.layer===2&&MODULES[S.curMod].id==='osc'&&isAudioCh(S.editSnd)){
      pushUndo('audio'); audAction(d,kmult(e)); return;}
    if(S.layer>=2&&MODULES[S.curMod].prs){
      if(S.layer===3){                    // explorer: move + load
        const p=S.presets[S.editSnd], pool=libAll().filter(en=>en.cat===(p.cat||'misc'));
        if(pool.length){
          S.libSel=clamp((S.libSel||0)-d,0,pool.length-1);
          const en=pool[S.libSel];
          applyPresetData(S.editSnd,en.name,en.cat,en.data);
        }
        dirty=true; return;
      }
      prsAction(d); return;
    }
    if(S.layer>=2){adjustParam(d,kmult(e));return;}   // shift=×10 · option=×0.1 (prep lives on cmd)
    if(S.layer===1){                      // ⌥↑↓ transposes THIS CHANNEL; z/x move the one global kb register
      const p=S.presets[S.curPreset];
      p.tr=clamp((p.tr||0)+d,-3,3);
      flash(S.presets[S.curPreset].name+' transpose '+(p.tr>=0?'+':'')+p.tr+' oct');
      dirty=true; dirtySave=true; return;}
    if(S.layer===0){                     // arrange params live on the arrows
      pushUndo('arrange param');
      const it=ARRP[S.arrParam||0]; it.a(d);
      flash(it.n+' = '+it.v());

  if(c==='KeyX'&&!e.repeat){S.oct=clamp(S.oct+1,-3,3);dirty=true;return;}

     octave. A real velocity source (midi, and later the hall-effect board)
     overrides this per note; this is what you play with until then. */
  if(c==='KeyC'&&S.layer>0&&!e.repeat&&!e.metaKey){
    e.preventDefault(); HOLD.c=true; HOLD.cUsed=false; return;}
  if(c==='KeyN'&&S.layer>0&&!e.repeat&&!e.metaKey){
    e.preventDefault(); HOLD.n=true; HOLD.nUsed=false; return;}
  if(c==='KeyI'&&S.layer>0&&!e.repeat&&!e.metaKey){
    e.preventDefault(); HOLD.i=true; HOLD.iUsed=false; return;}

  if(c in NOTEKEYS&&!e.repeat&&S.layer>0){
    e.preventDefault();

       synthesises for a midi note get through, so a note can't fire twice */
    if(EXP.solo()&&!EXP.synth)return;
    const wasHeld=new Set(kbHeld); kbHeld.add(c);
    const pi=S.layer===1?S.curPreset:S.editSnd;
    const midi=60+S.oct*12+NOTEKEYS[c];
    const hitVel=EXP.take();          // MIDI velocity if this key came from EXP, else the c/v value
    if(isAudioCh(pi)){flash('audio channel — tab records mic, drop a file to load a clip');return;}
    const pat=S.patterns[S.editPat];
    if(S.layer===1&&pat.state==='edit'){
      pushUndo('step');
      const lane=pat.lanes[S.curPreset], cell=cellOf(lane), n=stepCells(lane);
      const t0=curCell(lane)*cell;
      const i=lane.events.findIndex(ev=>ev.midi===midi&&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);

           each one in turn. So: nothing else down, this note replaces the
           cell; something else already held, it joins it. */

        lane.events.push({t:t0,midi,vel:hitVel,dur:cell,born:performance.now()});

      }
      dirty=true; dirtySave=true; return;
    }
    let at=AC.currentTime+0.005;
    const lane=(S.layer===1?pat:S.patterns[S.editPat]).lanes[pi];
    const recording=S.layer>=1&&pat.state==='rec'&&T.playing;   // record into the channel's lane from sound layer too
    /* overwrite mode, playing live but NOT recording: your live notes still
       silence the recorded lane underneath — same feel as recording, minus the write */
    if(S.layer===1&&!recording&&(CFG.overdub||0)===0&&T.playing){
      liveMute[pi]++; engine.chokeSeq(pi); nlive[c]=pi;
    }
    const patEmpty=pat.lanes.every(l=>!l.events.length);
    {
      if(recording&&patEmpty&&!lane._cap){
        T.startTime=at; T.startBeat=0; T.schedBeat=0;
        acts=[{pat:S.editPat,start:-1e9,anchor:0}];
        if(lane.auto&&CFG.listen){startCapture(lane,0);flash('● the ONE is set — listening…');}
        else if(lane.auto){lane.unit='B';lane.count=DEFLENS[CFG.defLen];lane.auto=false;
          flash('● the ONE is set — '+lane.count+' bar loop');}
        else flash('● the ONE is set');
        pend[c]={t0:0,sweep:0,ts:0,bornAt:performance.now(),lane:pi,qt:0,midi,vel:hitVel};
      }else{
        /* live quantize applies whenever it's on — stopped or playing, rec or not */
        const t0=gridNow();
        const q=qnext(t0,0.25);                       // → NEXT 16th, never earlier
        let tr=CFG.qOn?t0+(q-t0)*(lane.qlive??1):t0;
        if(recording&&S.hum)tr+=(Math.random()*2-1)*S.hum*0.12;
        if(tr<t0)tr=t0;
        /* monitor exactly where playback will put it: groove included, full
           strength — playback applies the same groove to the stored note */
        const heard=tr+grooveOff(pi,tr);
        at=Math.max(at,gridTime(heard));
        if(S.layer>=1)rPend[c]={pi,ts:tr,midi,vel:hitVel};   // retro memory hears everything
        /* an active arp generates the notes — record ITS output (recPlayNote), not the held note */
        const plyOf=isKit(S.presets[pi])?(kitSlot(S.presets[pi],midi)||{ply:[]}).ply:S.presets[pi].ply;
        const arpOn=T.playing&&plyOf.some(sl=>(sl.typ===2||sl.typ===1||sl.typ===13)&&!sl.off&&Math.round(sl.p6||0)===1);
        if(recording&&arpOn&&lane.auto&&!lane._cap&&!lane.events.length){   // arp: still start the listen window
          if(CFG.listen)startCapture(lane,tr);
          else{lane.unit='B';lane.count=DEFLENS[CFG.defLen];lane.auto=false;}
        }
        if(recording&&!arpOn){
          if(lane.auto&&!lane._cap&&!lane.events.length){
            if(CFG.listen)startCapture(lane,tr);
            else{lane.unit='B';lane.count=DEFLENS[CFG.defLen];lane.auto=false;}
          }
          const qt=lane._cap?Math.max(0,tr-lane._cap.t0):fmod(tr-editAnchor(),lane.len);
          // qt stored straight (groove is a playback layer); ts = where it actually sounds
          pend[c]={t0,sweep:t0,ts:heard,bornAt:performance.now(),lane:pi,qt,midi,vel:hitVel};
        }
      }
    }
    liveV[c]=engine.trigger(at,pi,midi,hitVel);
    if(S.layer>=2)S.prepFocus=engine.lastMidi[pi];   // last played note = per-note focus (any channel)
    dirty=true; return;
  }
};

    if(wantLatch){

      else{AUTORND.on=true; AUTORND.ch=S.curPreset; AUTORND.scope=scope||'notes';

        if(taps.length>=2){
          const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);
          setBpm(Math.round(60000/iv));
          flash('tap → '+T.bpm+'bpm ('+taps.length+')');
        }else flash('tap…');
      }else{S.metro=!S.metro; flash('click '+(S.metro?'on':'off'));}

       the latch modifier, and that combination has already set LATCH.used. */

  }
  if(DJCODE[c]!==undefined&&djHeld[DJCODE[c]]){
    const k=DJCODE[c]; delete djHeld[k];

      const st=djRecStart[k]; delete djRecStart[k];
      const L2=S.arr.len;
      S.arr.events.push({t:fmod(st,L2),dj:k,dur:Math.max(0.25,posNow()-st)});

      dirtySave=true;
    }
    djApply();
  }

  if(rPend[c]){
    const r=rPend[c];

      LATCH.on=true; pushUndo('take');

      if(pat4.state!=='rec')pat4.state='rec';

    }
    if(!wasUsed&&held<TAPMS&&(CFG.looper||0)===0&&S.layer>=1&&!isAudioCh(S.layer>=2?S.editSnd:S.curPreset)){

    if(engine.audRec)engine.audRecStop();
    const pat=S.layer>=1?S.patterns[S.editPat]:null;      // pattern rec (notes), pattern + sound layers
    if(pat&&pat.state==='rec'){pat.state='on';finalizeCaptures(true);dirty=true;dirtySave=true;}
    if(S.layer>=2&&!isAudioCh(S.editSnd)){               // ...and disarm the mod loop with it
      const ml=S.presets[S.editSnd].modLoop;
      if(ml.state==='rec'){ml.state='on';dirty=true;dirtySave=true;}
    }
  }
  let relAt=AC.currentTime+0.005;
  if(pend[c]){
    const p=pend[c], lane=S.patterns[S.editPat].lanes[p.lane];
    /* length is measured from where the note SOUNDED (post-quantize), not from
       the raw keypress — so the loop plays back the note you actually heard */
    const relG=T.playing?gridNow():p.ts+0.25;
    const dur=Math.max(0.05,relG-p.ts);
    lane.clear(ev=>ev.midi===p.midi&&Math.abs(ev.t-p.qt)<1e-6);
    lane.events.push({t:p.qt,midi:p.midi,vel:p.vel??0.9,dur,born:performance.now()});
    if(lane._cap)lane._cap.lastEnd=Math.max(lane._cap.lastEnd,p.qt+dur);
    relAt=Math.max(relAt,gridTime(p.ts+dur));   // hold the monitored note to that same length
    delete pend[c]; dirty=true; dirtySave=true;
  }
  if(nlive[c]!=null){liveMute[nlive[c]]=Math.max(0,liveMute[nlive[c]]-1);delete nlive[c];}
  if(liveV[c]){liveV[c]&&liveV[c].release&&liveV[c].release(relAt);delete liveV[c];}
});

const LS='ten-v1';
function serialize(){return JSON.stringify({v:17,bpm:T.bpm,metro:S.metro,hum:S.hum,grv:S.grv,oct:S.oct,master:S.master,dj:S.dj,arrOn:S.arrOn!==false,

function convertV3Preset(sp,i){ // v3-and-earlier preset data -> v4 racks
  const p=basePreset(sp.name||('P'+i));
  const oct=sp.osc?.oct||0, det=sp.osc?.det||0, pdrop=sp.osc?.pdrop||0;
  if(sp.ops)sp.ops.forEach((op,j)=>{if(op)Object.assign(p.osc[j],op,{ph:0});});
  else if(sp.osc&&sp.osc.type!==undefined)p.osc[0].wav=sp.osc.type;
  p.osc[0].rat=(p.osc[0].rat||1)*Math.pow(2,oct);
  p.osc[0].fine=(p.osc[0].fine||0)+det;
  if(sp.amp)p.env[0]={dst:1,idx:1,amt:100,a:sp.amp.a,d:sp.amp.d,s:sp.amp.s,r:sp.amp.r};
  if(sp.flt)p.flt[0]={typ:[1,2,3][sp.flt.type]||1,frq:sp.flt.cut,q:sp.flt.res,gn:0};
  if(sp.fen&&Math.abs(sp.fen.amt)>0.01)
    p.env[1]={dst:3,idx:1,amt:Math.round(sp.fen.amt*100),a:sp.fen.a,d:sp.fen.d,s:sp.fen.s,r:sp.fen.r};
  if(pdrop)p.env[2]={dst:2,idx:1,amt:clamp(Math.round(pdrop/24*100),-200,200),a:0.001,d:0.07,s:0,r:0.05};
  [sp.lf1,sp.lf2].forEach((lf,j)=>{
    if(!lf||!lf.dst||lf.amt<0.001)return;
    p.lfo[j]={dst:[0,1,2,3][lf.dst]||0,idx:1,wav:lf.wav,rate:lf.rate,amt:Math.round(lf.amt*100)};
  });
  if(sp.dly&&sp.dly.send>0.01)p.fx[0]={typ:1,p1:0.27,p2:0.35,mix:sp.dly.send};
  if(sp.rev&&sp.rev.send>0.01)p.fx[1]={typ:8,p1:vrbInv(0.3+sp.rev.send*4),p2:0,mix:1};
  if(sp.vox)Object.assign(p.vox,sp.vox);
  if(sp.mix)Object.assign(p.mix,sp.mix);
  return p;
}
function load(json){

    S.grv=o.grv||{typ:0,amt:0};

      ?o.master.map((m,i)=>({typ:0,rt:0,p1:0.3,p2:0.3,p3:0.5,mix:0.3,...m}))

    if(o.v<17)fx17(S.master);            // drv/crush → dist · verb size curve
    if(o.v<9&&S.master[9]&&!S.master[9].typ)S.master[9]={typ:15,rt:0,p1:0.85,p2:0.3,p3:0.5,mix:0};

    if(o.oct!==undefined)S.oct=o.oct;

      S.oct=+Object.keys(tally).reduce((a,b)=>tally[b]>tally[a]?b:a);

const screen=document.getElementById('screen');
/* ---------------- mouse ------------------------------------------------
   The keyboard is still the instrument; this is a second way in, not a
   replacement. Every value change replays the real arrow-key handler with a
   synthetic event, so the mouse can never drift away from what the keys do.

   Three gestures: click a field to focus it, drag up/down to change it,
   wheel over it to nudge. Modifiers match the keyboard — shift x10, alt x0.1.

   Listener sits on `screen`, which survives the innerHTML rebuild; the cell
   under the cursor does NOT, so drag state lives out here and pointer capture
   goes on the container. preventDefault everywhere keeps focus on body so the
   note keys keep playing mid-drag. */
const MOUSE={on:false,acc:0,y:0,kind:null,moved:false};
function mouseFocus(kind,i){
  if(kind==='cp'||kind==='set'){ if(S.layer===-1)S.setSel=i; else S.curParam=i; }
  else if(kind==='slot')S.slotParam=i;
  else if(kind==='mst')S.mParam=i;
  else if(kind==='sl'){S.curSlot=i; S.slotParam=0;}
  else if(kind==='mod'){S.curMod=i; S.curParam=0; S.slotParam=0; S.curSlot=0;}
  else if(kind==='msl'){S.mSlot=i; S.mDj=null; S.mParam=0;}
  else if(kind==='dj'){S.mDj=i; S.mParam=0;}
  else if(kind==='ch'){ if(S.layer>=2)S.editSnd=i; else S.curPreset=i; }
  /* the desk rows: pick the channel, then the drag replays the real binding
     (alt+↑↓ level, alt+←→ pan) rather than growing a second way to set them */
  else if(kind==='lvl'||kind==='pan'){ S.curPreset=i; if(S.layer>=2)S.editSnd=i; }
  else if(kind==='cell')stepCur=i;          // jump the loop cursor to a cell
  dirty=true;
}
/* tabs and rows are selections, not values — dragging one should not spin it */
const MOUSE_SELECT_ONLY=new Set(['mod','sl','msl','dj','ch','cell']);
function mouseArrow(code,o){
  onKeyDown({code,key:code,shiftKey:false,altKey:false,metaKey:false,ctrlKey:false,
    repeat:false,preventDefault(){},...o});
}
function mouseBump(dir,shift,alt){
  mouseArrow(dir>0?'ArrowUp':'ArrowDown',{shiftKey:!!shift,altKey:!!alt});
}
const hitOf=t=>{
  for(let n=t;n&&n!==screen;n=n.parentElement){
    const h=n.getAttribute&&n.getAttribute('data-h');
    if(h){const [k,i]=h.split(':');return {kind:k,i:+i};}
  }
  return null;
};
screen.addEventListener('pointerdown',e=>{
  const hit=hitOf(e.target); if(!hit)return;
  e.preventDefault();                       // focus stays on body: keys keep working
  mouseFocus(hit.kind,hit.i);
  MOUSE.on=!MOUSE_SELECT_ONLY.has(hit.kind);
  MOUSE.acc=0; MOUSE.y=e.clientY; MOUSE.x=e.clientX; MOUSE.kind=hit.kind; MOUSE.moved=false;
  try{screen.setPointerCapture(e.pointerId);}catch(_){}
});
screen.addEventListener('pointermove',e=>{
  if(!MOUSE.on)return;
  e.preventDefault();
  /* clientY delta, not movementY: movementY is distorted by pointer capture
     and OS acceleration, and is absent on synthetic events. */
  /* pan is a horizontal control, so drag it horizontally — dragging a pan pot
     up and down would be a lie about what it does */
  if(MOUSE.kind==='pan'){ MOUSE.acc+=e.clientX-MOUSE.x; }
  else MOUSE.acc+=MOUSE.y-e.clientY;        // up = increase, like the arrow keys
  MOUSE.y=e.clientY; MOUSE.x=e.clientX;
  const STEP=6;                             // px per increment
  while(Math.abs(MOUSE.acc)>=STEP){
    const d=MOUSE.acc>0?1:-1;
    MOUSE.acc-=d*STEP; MOUSE.moved=true;
    if(MOUSE.kind==='lvl')mouseArrow(d>0?'ArrowUp':'ArrowDown',{altKey:true});
    else if(MOUSE.kind==='pan')mouseArrow(d>0?'ArrowRight':'ArrowLeft',{altKey:true});
    else mouseBump(d,rs(e),e.altKey);
  }
});
const mouseUp=e=>{
  if(!MOUSE.on)return;
  MOUSE.on=false;
  try{screen.releasePointerCapture(e.pointerId);}catch(_){}
};
screen.addEventListener('pointerup',mouseUp);
screen.addEventListener('pointercancel',mouseUp);
screen.addEventListener('wheel',e=>{
  const hit=hitOf(e.target); if(!hit)return;
  e.preventDefault();
  mouseFocus(hit.kind,hit.i);
  if(!MOUSE_SELECT_ONLY.has(hit.kind))mouseBump(e.deltaY<0?1:-1,rs(e),e.altKey);
},{passive:false});

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sp=(cls,s)=>`<span class="${cls}">${esc(s)}</span>`;
/* Same span, but the contents are already markup. The cell FILL has to be one
   element: give every note its own filled span and the padding that closes the
   gaps also paints each note's background over its neighbour's glyph. */
const spRaw=(cls,html)=>`<span class="${cls}">${html}</span>`;
/* the same span, tagged with what it edits: kind selects which focus index
   to move, i is the position inside that context. The mouse layer reads these. */
const spH=(cls,s,kind,i)=>`<span class="${cls}" data-h="${kind}:${i}">${esc(s)}</span>`;
const pad=(s,n)=>s.length>=n?s.slice(0,n):s+' '.repeat(n-s.length);
const W=92;

function stateBadge(st){
  return st==='rec'?sp('ri',' REC '):st==='edit'?sp('i',' EDIT '):sp('ai',' PLAY ');
}
function loopBadge(){
  const h=curHolder(), lp=curLoop();
  const cnt=(lp.count%1?lp.count.toFixed(2):lp.count)+'';
  const lane=S.layer===1?sp('d',' lane ')+sp('a',S.curPreset+pad(S.presets[S.curPreset].name,5))+' ':' ';
  const len=lp._cap?sp('r','listening…'):sp('a',cnt+'×'+UNIT_NAMES[lp.unit])+sp('d',' ('+(Math.round(lp.len*100)/100)+'b)');
  return stateBadge(h.state)+lane+len;
}
/* The strip and the param rows a slot rack shows. Layer 2 and layer 3 now draw
   the SAME thing from the same code — the only reason a filter felt deeper than
   a voice was that this lived exclusively in the rack view.
   Abbreviations are capped: MOD's are unbounded and a fully routed rack pushed
   the strip past the 104ch page width, which re-centres every other line. */
/* Trim a line of markup to n VISIBLE characters, leaving tags intact. */
function clipLine(html,n){
  let out='',seen=0,i=0;
  while(i<html.length){
    if(html[i]==='<'){const j=html.indexOf('>',i); if(j<0)break; out+=html.slice(i,j+1); i=j+1; continue;}
    if(seen>=n){                                  // close anything still open
      const rest=html.slice(i).match(/<\/[^>]+>/g)||[];
      return out+'…'+rest.join('');
    }
    out+=html[i]; seen++; i++;
  }
  return out;
}
/* Three groups, in signal order: what decides the notes, what makes the sound,
   what happens to it after. The racks still exist underneath — this is a way of
   LOOKING at them, not a new data model, so a slot is still (module, index) and
   every mod route and mod-loop event still addresses the same thing it did. */
const CHAIN=[
  {n:'Play',  ids:['ply']},
  {n:'Sound', ids:['osc']},
  {n:'Filter',ids:['flt']},
  {n:'Mod',   ids:['mod']},
  {n:'Voice', ids:['vox']},
  {n:'FX',    ids:['fx']},
];
/* Cell width comes from how many slots are actually open, so the chain always
   fits the same 92 columns everything else uses. A channel with six mod slots
   gets tighter cells rather than a row that runs off the edge. */
const slotW=n=>clamp(Math.floor(92/Math.max(1,n)),5,10);
const ctrIn=(t0,w)=>{const t=t0.length>w?t0.slice(0,w):t0;
  const l=Math.max(0,Math.floor((w-t.length)/2));
  return ' '.repeat(l)+t+' '.repeat(Math.max(0,w-t.length-l));};
/* Every slot worth showing: the ones in use, plus the first free one in each
   section as a '+'. Ten empty boxes per rack was ten questions you had not
   asked; one '+' is the only one you might. */
function sectionChips(pre){
  return CHAIN.map(sec=>{
    const items=[]; let plus=null;
    for(const id of sec.ids){
      const mi=MODULES.findIndex(m=>m.id===id); if(mi<0)continue;
      const M=MODULES[mi];
      if(M.flat){ items.push({mi,si:-1,M,label:M.name.toLowerCase()}); continue; }
      const rack=modHolder(pre,id)[id]||[];
      rack.forEach((sl,si)=>{
        const ab=M.abbr(sl);
        if(ab!=='···')items.push({mi,si,M,label:(sl.off?'×':'')+ab,off:!!sl.off});
        else if(!plus)plus={mi,si,M,label:'+',isPlus:true};
      });
    }
    return {sec,items,plus};
  });
}
const chipList=pre=>sectionChips(pre).flatMap(g=>g.items.concat(g.plus?[g.plus]:[]));
function chipIndex(chips){
  const i=chips.findIndex(c=>c.mi===S.curMod&&(c.si===S.curSlot||c.si===-1));
  return i<0?0:i;
}
function gotoChip(c){ if(!c)return; S.curMod=c.mi; if(c.si>=0)S.curSlot=c.si; S.slotParam=0; }
function rackStrip(L,rackA,M){
  let tabs='  ';
  rackA.forEach((sl,i)=>{
    const ab=M.abbr(sl), sh=ab.length>7?ab.slice(0,7):ab;
    const lbl=` ${(i+1)%10}${sl.off?'×':''}${sh} `;
    tabs+=(i===S.curSlot?spH('i',lbl,'sl',i):(sl.off?spH('d',lbl,'sl',i)
      :ab!=='···'?spH('a',lbl,'sl',i):spH('d',lbl,'sl',i)));
  });
  L.push(tabs);
}
/* ONE row of params. Wrapping at five put the sixth parameter on a line of its
   own below the values of the first five, which read as a second slot. Squeeze
   the column instead — the whole rack is one horizontal move again. */
function rackParams(L,pre,specs){
  S.slotParam=clamp(S.slotParam|0,0,Math.max(0,specs.length-1));
  const n=Math.max(1,specs.length);
  const w=clamp(Math.floor(88/n)-1,5,10);
  let lr='   ', vr='   ';
  specs.forEach((pspec,i)=>{
    const foc=i===S.slotParam;
    const pd=prepDisp(pre,S.curMod,S.curSlot,pspec);
    const v=(pd.dot?'•':'')+fmtVal(pspec,pd.v);
    lr+=(foc?spH('a',' '+pad(pspec.lbl,w),'slot',i):spH('d',' '+pad(pspec.lbl,w),'slot',i))+' ';
    vr+=(foc?spH('i',' '+pad(v,w),'slot',i)
           :(pd.dot?spH('r k',' '+pad(v,w),'slot',i):spH('v k',' '+pad(v,w),'slot',i)))+' ';
  });
  L.push(lr); L.push(vr);
}
function gridRow(lp,cell,phCell,charFor,cur=-1,hit){
  const n=Math.ceil(lp.len/cell-1e-9);
  let out='';
  for(let i=0;i<n;i++){
    const ch=charFor(i*cell,(i+1)*cell);
    out+=hit?( (i===cur)?spH('i',ch,hit,i):(i===phCell)?spH('ai',ch,hit,i):spH('g',ch,hit,i) )
           :((i===cur)?sp('i',ch):(i===phCell)?sp('ai',ch):ch);
    if(cell<1&&i%4===3&&i<n-1)out+=sp('d','│');
    else if(cell>=1&&(i+1)*cell%4===0&&i<n-1)out+=sp('d','│');
  }
  return out;
}

function renderArr(L,pos){
  const edit=S.arr.state==='edit';
  L.push('  '+sp('d','patterns')+'      '+
    sp('d',edit?'EDIT: ←→ cursor · digits place transition · dj letters place ≈ · ⌫ clear':'digits recall · 0 twice = MASTER · REC records transitions'));
  for(let r=0;r<2;r++){
    let row='   ';
    for(let i=r*5;i<r*5+5;i++){
      const pat=S.patterns[i];
      const ev=pat.lanes.reduce((a,l)=>a+l.events.length,0);
      let cell=pad(`${i}│${ev}ev ${PATSECT[i]}`,14);
      if(i===S.curPat)cell=sp('i',cell);
      else if(ev)cell=sp('a',cell);
      else cell=sp('d',cell);
      row+=cell+'  ';
    }
    if(r===1)row+=(S.mSel?sp('i',' 0│MASTER '):sp('r',' 0│MASTER '));
    L.push(row);
  }
  L.push('');
  {let pr='  ';                                  // arrange params: ←→ focus · ↑↓ value
   ARRP.forEach((it,i)=>{
     const foc=i===(S.arrParam||0);
     pr+=(foc?sp('a','▸'+it.n):sp('d',' '+it.n))+' '+(foc?sp('i',' '+pad(it.v(),6)):sp('d',pad(it.v(),6)))+'   ';
   });
   L.push(pr+sp('d','←→ · ↑↓')+'      '+sp('d','dj pads: '))+
   L.push('  '+S.dj.map((d2,i)=>{
     const on=djHeld[i]||djLatch[i]||djAuto[i];
     return (on?sp('r',' '+DJKEYS[i]+djName(i)):sp('d',' '+DJKEYS[i]+djName(i)));
   }).join('')+sp('d','  hold=momentary ⇧=latch · edit inside MASTER 0')); }
  L.push('');
  const arr=S.arr, cell=cellOf(arr);
  const phCell=T.playing?Math.floor(fmod(pos,arr.len)/cell):-1;
  L.push('  '+sp('d','timeline ')+(S.arrOn===false?sp('r','OFF (t)'):sp('a','on'))+sp('d',' (t)')+'  '+
    (arr.events.length||edit?'':sp('d','(empty — REC + digits while playing, or EDIT to place · ⌫ clears)')));
  L.push('   '+gridRow(arr,cell,phCell,(a,b)=>{
    if(!arr.events.length)return '·';
    const hit=arr.events.find(e=>e.pattern!==undefined&&e.t>=a-1e-9&&e.t<b-1e-9);
    if(hit)return ''+hit.pattern;
    const djh=arr.events.find(e=>e.dj!==undefined&&a<e.t+(e.dur||4)-1e-9&&b>e.t+1e-9);
    if(djh)return '≈';
    const p2=fmod(a,arr.len);let best=null;
    for(const e of arr.events)if(e.pattern!==undefined&&e.t<arr.len-1e-9&&e.t<=p2+1e-9&&(!best||e.t>best.t))best=e;
    if(!best)for(const e of arr.events)if(e.pattern!==undefined&&e.t<arr.len-1e-9&&(!best||e.t>best.t))best=e;
    return best?'‧':'·';
  },edit?curCell(arr):-1)+'   '+sp('d',(cell>=4?'cell=bar':cell>=1?'cell=beat':'cell=16th')+' · ≈ dj'));
  L.push('');
  L.push('  '+sp('d','playing now: ')+sp('a','P'+(T.playing?actAt(pos).pat:S.curPat))+
    sp('d','   q ')+(CFG.qOn?sp('a','on'):sp('r','off'))+
    sp('d','   enter → edit pattern '+S.curPat));
}

/* Live per-channel meters. The analyser hanging off each channel's panner is
   already there for the auto-mix, so this costs one read per channel per frame
   and no new nodes. Peak-hold with a slow fall, because a bar that tracks the
   waveform instantly reads as noise rather than level. */
/* The channel list, in display order. Everything that draws or walks the strip
   goes through this, so re-ordering it (master into the row, music channels
   starting at 1) is one edit rather than ten. */
/* MASTER sits at the right end of the strip as channel 0, so the digit row IS
   the mixer: 1-9 are music, 0 is the master, exactly where the key is.
   presets[0] is retired rather than reindexed — renumbering every saved
   pattern to gain one channel is not a trade worth making. */
const CHANS=()=>[1,2,3,4,5,6,7,8,9];
const CH_LOW=1;
const METER={pk:new Array(11).fill(0), buf:new Float32Array(256)};
function masterLevel(){
  const a=engine.mAn; if(!a)return 0;
  a.getFloatTimeDomainData(METER.buf);
  let mx=0; for(let k=0;k<METER.buf.length;k++){const v=METER.buf[k]<0?-METER.buf[k]:METER.buf[k]; if(v>mx)mx=v;}
  METER.pk[10]=mx>METER.pk[10]?mx:METER.pk[10]*0.86;
  return METER.pk[10];
}
const BARS=' ▁▂▃▄▅▆▇█';
function chLevel(i){
  const b=engine.buses[i]; if(!b||!b.an)return 0;
  b.an.getFloatTimeDomainData(METER.buf);
  let mx=0;
  for(let k=0;k<METER.buf.length;k++){const a=METER.buf[k]<0?-METER.buf[k]:METER.buf[k]; if(a>mx)mx=a;}
  METER.pk[i]=mx>METER.pk[i]?mx:METER.pk[i]*0.86;
  return METER.pk[i];
}
/* level -> bar index, on a dB-ish curve: a linear map spends most of its
   travel on the top 6dB and reads as an on/off lamp. */
const meterCh=v=>BARS[clamp(Math.round(Math.pow(clamp(v,0,1),0.35)*8),0,8)];
/* 50L .. C .. 50R — an amount you can read, not a picture of a knob */
const panCh=v=>{
  const n=Math.round(Math.abs(v)*50);
  return n<1?'  C':(String(n)+(v<0?'L':'R')).padStart(3);
};

/* VERTICAL GRID. Time runs down, one column per channel, aligned to the mixer
   strip above so a channel and its part are one object.

   The playhead is a single line across every channel — which is the whole
   point, and something ten separate horizontal lanes cannot show.

   Lanes are polymetric here: each has its own length. So the axis is ABSOLUTE
   time from the pattern anchor and every column wraps at its own loop point,
   exactly as playback does. A 3-beat lane against a 4-beat one visibly
   phases, which the lane view could only imply. */
const VROWS=()=>CFG.vrows??32;                // ceiling on rows drawn
const CELLW=8;                                // lit characters in one cell; the 9th is the gap
const COLW=CELLW+1;                           // ...so this is the column pitch
const GUTW=4;                                 // the left label / row-number column
const ctr=g=>{const l=Math.floor((CELLW-1)/2);return ' '.repeat(l)+g+' '.repeat(CELLW-1-l);};
const velCls=v=>'n'+clamp(Math.round((v??0.9)*5),0,5);
/* Every column is its OWN loop, top to bottom, so a lane's LENGTH is the
   height of its column — the thing you could not see when the axis was
   absolute time and everything wrapped invisibly.

   Each column also carries its own playhead, because with different lengths
   they are at different places at the same moment. Watching four playheads
   drift apart is the clearest picture of polymetry the screen can give.

   White boxes are reserved for the cursor. A playing note is bright, not
   boxed — otherwise half the grid is boxes and the cursor stops meaning
   anything. */
function vGrid(L,pat,pos,anc,chans,cap){
  const step=0.25;
  let maxSteps=1;
  for(const i of chans){const l=pat.lanes[i];
    if(l&&!isAudioCh(i))maxSteps=Math.max(maxSteps,Math.round(l.len/step));}
  const rows=Math.min(maxSteps,cap||VROWS());
  const nowStep={}, nSteps={};
  for(const i of chans){
    const l=pat.lanes[i];
    nSteps[i]=l&&!isAudioCh(i)?Math.round(l.len/step):0;
    nowStep[i]=(T.playing&&l&&nSteps[i])?Math.floor(fmod(pos-anc,l.len)/step):-1;
  }
  // unit ticks come from the focused channel, so the gutter shows ITS grain
  const cu=pat.lanes[S.curPreset], uStep=cu?Math.max(1,Math.round(UNITS[cu.unit]/step)):4;
  /* Where the white box sits. Playing and not editing, it RIDES this channel's
     playhead — so the box is always telling you where you are, and stepping
     into the grid picks it up exactly where the light was rather than throwing
     you back to the top. In edit it stops and answers to the arrows. */
  const soloing=pat.lanes.some(l=>l.solo);
  const dim=i=>pat.lanes[i].mute||(soloing&&!pat.lanes[i].solo);
  const editing=pat.state==='edit';
  const parked=cu?Math.round(curCell(cu)*cellOf(cu)/step):-1;
  const curRow=editing?parked:(nowStep[S.curPreset]>=0?nowStep[S.curPreset]:parked);
  for(let r=0;r<rows;r++){
    const tick=r%uStep===0;                       // a unit boundary for the focused lane
    let line=sp(tick?'a':r%4===0?'v':'d',String(r+1).padStart(GUTW))+' ';
    for(const i of chans){
      const lane=pat.lanes[i], n=nSteps[i];
      /* base fill for this channel, and the lifted one the playhead uses —
         the same proportional step everywhere, so the moving cell reads as
         one thing across nine columns instead of nine different marks */
      const sel=i===S.curPreset, kBase=sel?(dim(i)?'kqs':'ks'):dim(i)?'kq':'k';
      const kLift=sel?(dim(i)?'ks':'ksp'):dim(i)?'kqp':'kp';
      if(!n){ line+=(isAudioCh(i)&&r===0?sp('d '+kBase,ctr('≈')):sp(kBase,' '.repeat(CELLW)))+' '; continue; }
      if(r>=n){ line+=' '.repeat(COLW); continue; }   // past this loop's end — no cell, no fill
      const t=r*step;
      const hits=lane.events.filter(e=>e.t>=t-1e-9&&e.t<t+step-1e-9)
                            .sort((x,y)=>x.midi-y.midi);      // low to high, so a chord reads
      /* a note RELEASING in this cell, with nothing starting — the only thing
         worth a mark in an otherwise empty cell, because it is the difference
         between a note still ringing and one that has stopped */
      const offs=hits.length?false:lane.events.some(e=>{
        const end=e.t+(e.dur||0.25);
        return end>t-1e-9&&end<t+step-1e-9;
      });
      const playing=nowStep[i]===r;
      const cursor=i===S.curPreset&&curRow===r;
      /* CELLW characters of room, so a chord can print as CEG instead of
         collapsing to one '≡' that told you a stack was there and nothing
         about what was in it. Past five notes the last slot becomes '+'. */
      const shown=hits.length>CELLW?hits.slice(0,CELLW-1):hits;
      const more=hits.length>CELLW;
      const txt=shown.map(h=>PCH[heardMidi(i,h.midi)%12]).join('')+(more?'+':'');
      const lp=' '.repeat(Math.max(0,Math.floor((CELLW-txt.length)/2)));
      const rp=' '.repeat(Math.max(0,CELLW-txt.length-lp.length));
      const kc=playing?kLift:kBase;                 // the playhead IS the fill
      const empty=offs?'.':' ';                     // a lone '.' means a note released here
      let cell;
      /* dim() before the flash: a channel you cannot hear must not light up as
         though it just sounded. */
      if(cursor)         cell=sp(editing?'i':'v cur',hits.length?lp+txt+rp:ctr(empty));
      else if(dim(i))    cell=sp('d '+kc,hits.length?lp+txt+rp:ctr(empty));
      else if(!hits.length)cell=sp('d '+kc,ctr(empty));
      else if(playing)   cell=sp('w '+kc,lp+txt+rp);       // flashes as it sounds
      else{
        /* one span per note for its own velocity brightness, all of them inside
           a single filled wrapper — the fill and its padding belong to the CELL */
        let inner=esc(lp);
        for(const h of shown)inner+=sp(velCls(h.vel),PCH[heardMidi(i,h.midi)%12]);
        if(more)inner+=sp('d','+');
        cell=spRaw(kc,inner+esc(rp));
      }
      line+=cell+' ';
    }
    L.push(line);
  }
  if(maxSteps>rows)L.push('   '+sp('d','… '+(maxSteps-rows)+' more steps — longest loop does not fit'));
}

function renderPat(L,pos){
  const pat=S.patterns[S.editPat];
  const edit=pat.state==='edit';
  const anc=editAnchor();
  /* The desk, one row per property, each row named down the left edge. The
     label column is GUTW wide so a column boundary here is the same column
     boundary in the grid below — read straight down from a name to its notes. */
  const soloing=pat.lanes.some(l=>l.solo);
  /* K(i) = the fill for channel i's cells: brighter on the one you are on, so
     the whole column lifts together and you can see where you are without
     hunting for a highlighted word. */
  /* A channel is DIMMED when it cannot be heard — muted, or soloed out by
     somebody else. Same treatment for both, because they are the same fact. */
  const dimmed=i=>pat.lanes[i].mute||(soloing&&!pat.lanes[i].solo);
  /* focused and silenced are independent facts, so the fill carries both */
  const K=i=>i===S.curPreset?(dimmed(i)?'kqs':'ks'):dimmed(i)?'kq':'k';
  const T=i=>i===S.curPreset?'a':dimmed(i)?'d':'u';   // white only where you are
  /* centre in exactly w — anything longer is cut, because one over-long cell
     shunts every column to its right and the strip stops lining up with the grid */
  const ctrC=(t0,w)=>{const t=t0.length>w?t0.slice(0,w):t0;
    const l=Math.max(0,Math.floor((w-t.length)/2));
    return ' '.repeat(l)+t+' '.repeat(Math.max(0,w-t.length-l));};
  const rows=[
    /* the number is the thing you press, so the number is what gets the box */
    ['Ch',  i=>{
      const m=pat.lanes[i].mute, so=pat.lanes[i].solo;
      const tag=String(i)+(so?' S':m?' M':'');
      /* the white box marks WHERE YOU ARE — unless you are editing, when the
         step cursor takes it over and two full-white marks would compete */
      const sel=i===S.curPreset&&!edit;
      return spH(sel?'i':T(i)+' '+K(i),ctrC(tag,CELLW),'ch',i)+' ';
    }, ()=>spH(S.mSel&&!edit?'i':'v k',ctrC('0',CELLW),'mst0',0)+' '],
    ['Inst',i=>spH(T(i)+' '+K(i),ctrC(S.presets[i].name,CELLW),'ch',i)+' ',
            ()=>sp((S.mSel?'a':'v')+' '+(S.mSel?'ks':'k'),ctrC('MASTR',CELLW))+' '],

    /* meter sits ON the volume row: the number you set and the level you got,
       side by side, which is the only way to tell a quiet mix from a dead one */
    ['Vol', i=>{
      const mx=S.presets[i].mix||{lvl:0.8,pan:0};
      const m=pat.lanes[i].mute, so=pat.lanes[i].solo;
      const audible=!m&&(!soloing||so);
      const bar=audible?meterCh(chLevel(i)):' ';
      return spH(T(i)+' '+K(i),
        ' '+bar+' '+String(Math.round(mx.lvl*100)).padStart(3)+'V ','lvl',i)+' ';
    }, ()=>sp((S.mSel?'a':'v')+' '+(S.mSel?'ks':'k'),' '+meterCh(masterLevel())+' '+
        String(Math.round((S.master&&S.mLvl!==undefined?S.mLvl:1)*100)).padStart(3)+'V ')+' '],

    /* what the channel IS, next to how loud it is — the two facts you want
       side by side when you are deciding whether it belongs in the mix */
    ['Eng', i=>sp(T(i)+' '+K(i),ctrC(engShort(S.presets[i]),CELLW))+' ',
            ()=>sp((S.mSel?'a':'v')+' '+(S.mSel?'ks':'k'),ctrC('bus',CELLW))+' '],
    ['Type',i=>{
      const p2=S.presets[i];
      const t=p2.cat==='proc'?(p2.pmodel||'—'):p2.cat==='audio'?'clip':(p2.cat||'misc');
      return sp(T(i)+' '+K(i),ctrC(t,CELLW))+' ';
    }, ()=>sp(S.mSel?'ks':'k',' '.repeat(CELLW))+' '],

    ['Pan', i=>spH(T(i)+' '+K(i),
              ctrC(panCh((S.presets[i].mix||{pan:0}).pan).trim(),CELLW),'pan',i)+' ',
            ()=>sp((S.mSel?'a':'v')+' '+(S.mSel?'ks':'k'),ctrC('---',CELLW))+' '],

    ['Loop',i=>{
      const l=pat.lanes[i];
      /* `auto` reads as a DIM row rather than a '~' prefix, which buys back the
         character "0.25xbar" and "16x16th" need. Strictly ASCII here: '×' and
         '¼' are a hair narrower than one cell in this font, and a fraction of a
         column per channel is half a character of skew by the ninth one. */
      const c2=l.count%1?String(l.count).replace(/^0/,''):String(l.count);
      const t=isAudioCh(i)?'clip':c2+' '+UNIT_NAMES[l.unit];
      return sp(T(i)+' '+K(i),' '+pad(t,CELLW-1))+' ';
    }, ()=>sp(S.mSel?'ks':'k',' '.repeat(CELLW))+' '],

    /* transpose in the unit it actually means. An octave down is −12st, not
       "−1" of something you have to remember the size of; the channel's octave
       and semitone offsets are one number because they are one pitch. */
    ['Tr',  i=>{
      const st=trSemis(S.presets[i]);
      return sp((st?T(i):'d')+' '+K(i),ctrC(st?(st>0?'+':'')+st+'st':'',CELLW))+' ';
    }, ()=>sp(S.mSel?'ks':'k',' '.repeat(CELLW))+' '],
  ];
  /* INNER is every channel column plus master, so the frame closes exactly on
     the last one. Text this dense reads as a spreadsheet the moment it has an
     edge; without one it is just words hanging in space. */
  for(const [name,cell,mcell] of rows){
    let row=sp('d',pad(name,GUTW))+' ';
    for(const i of CHANS())row+=cell(i);
    L.push(row+mcell());
  }
  L.push('');
  /* The rack opens BETWEEN the desk and the notes. Enter used to swap the whole
     screen for it, which meant losing sight of the mix and the pattern exactly
     when you were changing the sound they carry. The grid gets shorter to make
     room rather than disappearing — you still see the loop you are editing into. */
  if(S.layer>=2){
    (S.layer===2?renderSnd:renderSlots)(L,pos);
    L.push('');
  }
  if(CFG.vgrid){ vGrid(L,pat,pos,anc,CHANS(),S.layer>=2?Math.min(VROWS(),12):VROWS()); L.push(''); }
  const lanes=[];
  for(let i=0;i<10;i++)if(!CFG.vgrid&&(i===S.curPreset||pat.lanes[i].events.length))lanes.push(i);
  for(const li of lanes){
    const lane=pat.lanes[li];
    if(isAudioCh(li)){
      const cnt2=(lane.count%1?lane.count.toFixed(1):lane.count)+({s:'st',e:'8th',b:'bt',h:'hlf',B:'br'})[lane.unit];
      L.push('  '+(li===S.curPreset?spH('a',` ${li}${pad(S.presets[li].name,5)} `,'ch',li):spH('d',` ${li}${pad(S.presets[li].name,5)} `,'ch',li))+
        sp('d',pad(lane.solo?'SOLO':lane.mute?'MUTE':cnt2,6))+' '+
        (engine.audBuf[li]?sp('a','≈≈≈ '+(engine.audName[li]||'clip')+' ≈≈≈'):sp('d','≈ no clip — drop audio or tab-record'))+
        (engine.audRec&&engine.audRec.pi===li?sp('r','  ● REC'):''));
      continue;
    }
    if(lane._cap){
      L.push('  '+sp('a',` ${li}${pad(S.presets[li].name,5)} `)+sp('r','● listening — play; loop length suggests itself after a bar of silence'));
      continue;
    }
    const cell=cellSize(lane.len,64);
    const ph=T.playing?Math.floor(fmod(pos-anc,lane.len)/cell):-1;
    const cnt=(lane.count%1?lane.count.toFixed(1):lane.count)+({s:'st',e:'8th',b:'bt',h:'hlf',B:'br'})[lane.unit];
    let lbl=` ${li}${pad(S.presets[li].name,5)} `;
    L.push('  '+(lane.mute?spH('r',lbl,'ch',li):li===S.curPreset?spH('a',lbl,'ch',li):spH('d',lbl,'ch',li))+
      sp('d',pad(lane.solo?'SOLO':lane.mute?'MUTE':lane.auto?'new':cnt,6))+' '+
      gridRow(lane,cell,ph,(a,b)=>{
        const hits=lane.events.filter(e=>e.t>=a-1e-9&&e.t<b-1e-9);
        if(!hits.length)return '·';
        if(hits.length>1)return '≡';
        return PCH[hits[0].midi%12];
      },(edit&&li===S.curPreset)?curCell(lane):-1));
  }
}
function renderSnd(L,pos){
  /* PRST and MIX were blanked in place to keep every module index stable, so a
     cursor parked on one of them now points at nothing. Nudge it to a real
     rack rather than rendering the reserved branch. */
  if(!MODULES[S.curMod]||!MODULES[S.curMod].id)
    S.curMod=Math.max(0,MODULES.findIndex(m=>m.id));
  const pre=S.presets[S.editSnd], ml=pre.modLoop;
  const edit=ml.state==='edit';
  /* The chain reads left to right in the order it runs, each stage named over
     the slots it holds — the same label-over-value shape as a param row, so
     the whole screen is one idea repeated instead of three different ones. */
  {const groups=sectionChips(pre);
   const total=groups.reduce((a,g)=>a+Math.max(1,g.items.length+(g.plus?1:0)),0);
   const SW=slotW(total), SLIT=SW-1;
   let lab='   ', cells='   ';
   for(const g of groups){
     const all=g.items.concat(g.plus?[g.plus]:[]);
     const n=Math.max(1,all.length);
     lab+=sp('d',pad(' '+g.sec.n,n*SW));
     for(const c of all){
       const on=c.mi===S.curMod&&(c.si===S.curSlot||c.si===-1);
       cells+=spH(on?'i':(c.isPlus?'d k':c.off?'d k':'v k'),
                  ctrIn(c.label,SLIT),'mod',c.mi)+' ';
     }
     if(!all.length)cells+=' '.repeat(n*SW);
   }
   L.push(lab); L.push(cells);}
  L.push('');
  // this channel's pattern lane — only when the grid below isn't already showing it
  if(!CFG.vgrid){const pat=S.patterns[S.editPat], lane=pat.lanes[S.editSnd];
   const rec=pat.state==='rec'&&T.playing, cap=lane._cap;
   if(!isAudioCh(S.editSnd)){
     const cell=cellSize(lane.len,48), anc=editAnchor();
     const ph=T.playing?Math.floor(fmod(pos-anc,lane.len)/cell):-1;
     const cnt=lane.auto?'new':(lane.count%1?lane.count.toFixed(1):lane.count)+({s:'st',e:'8th',b:'bt',h:'hlf',B:'br'})[lane.unit];
     L.push('  '+sp(rec?'r':'d','pattern '+S.editPat+(rec?' ●REC':cap?' ○listen':'')+' ')+sp('d',pad(cnt,5))+'  '+
       (cap?sp('r','listening — play; loop sets itself'):
        gridRow(lane,cell,ph,(a,b)=>{const hits=lane.events.filter(e=>e.t>=a-1e-9&&e.t<b-1e-9);
          return !hits.length?'·':hits.length>1?'≡':PCH[hits[0].midi%12];},-1))+
       sp('d','  · tab '+(rec?'stops':'records')));
     L.push('');
   }}
  prepLine(L,pre);
  layerBanner(L,pre);
  const M=MODULES[S.curMod];
  if(M.id==='osc'&&isCodeCh(S.editSnd)){
    const e=engine.cn&&engine.cn[S.editSnd];
    const names=(e&&e.names)||[];
    const _pl=procPresets(pre.pmodel||'trumpet');
    const _pn=_pl.length?(_pl[clamp(pre.psel|0,0,_pl.length-1)]||{}).n:'';
    L.push('  '+sp('a','⚙ PROCEDURAL  ')+sp('i',' '+(pre.pmodel||'trumpet')+' ')
      +(_pn?sp('a','  '+_pn):'')
      +sp('d','  '+((PROCLIB[pre.pmodel||'trumpet']||{}).fam||'')+'   ')+(e&&e.err
      ? sp('r','error: '+e.err)
      : sp('d','worklet ')+sp(e&&e.ready?'a':'r',e&&e.ready?'live':'compiling…')
        +sp('d','  '+((pre.code||CODE_DEFAULT).split('\n').length)+' lines · '+
             (engine.act[S.editSnd]||[]).length+' voices')));
    L.push('');
    let lr='   ', vr='   ';
    CODEF().forEach((pspec,i)=>{
      const foc=i===S.curParam;
      const v=fmtVal(pspec,(pre.cp&&pre.cp[i])??0);
      lr+=(foc?spH('a','▸'+pad(names[i]||pspec.lbl,8),'cp',i):spH('d',' '+pad(names[i]||pspec.lbl,8),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,8),'cp',i):spH('v',' '+pad(v,8),'cp',i))+' ';
    });
    L.push(lr); L.push(vr);
    L.push('');
    L.push('   '+sp('d','real DSP in an audio-thread worklet · PRST ▸model picks the instrument'));
    L.push('   '+sp('d','modal = struck bars/tines · waveguide = recursion the rack cannot express'));
    L.push('   '+sp('d','←→ pick a param · ↑↓ change it while it plays · cmd+E exports the session with the code'));
  }
  else if(M.id==='osc'&&isAudioCh(S.editSnd)){
    const buf=engine.audBuf[S.editSnd];
    L.push('  '+sp('a','≈ AUDIO CHANNEL  ')+(buf
      ?sp('d','clip: ')+sp('a',(engine.audName[S.editSnd]||'clip')+' · '+buf.duration.toFixed(2)+'s')
      :sp('r','no clip — drop an audio file here, or hold tab to record the mic')));
    L.push('');
    let lr='   ', vr='   ';
    AUDF.forEach((pspec,i)=>{
      const foc=i===S.curParam;
      const v=fmtVal(pspec,pre.au[pspec.key]??0);
      lr+=(foc?spH('a','▸'+pad(pspec.lbl,8),'cp',i):spH('d',' '+pad(pspec.lbl,8),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,8),'cp',i):spH('v',' '+pad(v,8),'cp',i))+' ';
    });
    L.push(lr); L.push(vr);
    L.push('');
    L.push('   '+sp('d','loops in sync with this channel’s lane length · fit stretches trim to the loop'));
    L.push('   '+sp('d','tab = record from input (mic, or mstr = resample the master mix) · modes in settings'));
  }
  else if(M.prs){
    const p=pre, defs=prsFieldDefs(), onLayer=!!edKit(p);
    S.curParam=Math.min(S.curParam,defs.length-1);
    let lr='   ', vr='   ';
    defs.forEach((fd,i)=>{
      if(fd.br){L.push(lr);L.push(vr);L.push('');lr='   ';vr='   ';}   // start a new field row
      const foc=i===S.curParam, v=fd.v();
      lr+=(foc?spH('a','▸'+pad(fd.k,9),'cp',i):spH('d',' '+pad(fd.k,9),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,9),'cp',i):spH('v',' '+pad(v,9),'cp',i))+' ';
    });
    L.push(lr); L.push(vr);
    stackStrip(L,p);
    L.push('');
    if(onLayer)L.push('   '+sp('d','←→ field · ↑↓ set · this pad is a full chain — every rack edits it · ⌫ resets the pad'));
    else L.push('   '+sp('d','←→ field · ↑↓ act · stack = off/stack/split · layer = add & edit · enter → library'));
  }
  else if(M.flat){
    let lr='   ', vr='   ';
    M.flat.forEach((pspec,i)=>{
      const foc=i===S.curParam;
      const pd=prepDisp(pre,S.curMod,-1,pspec);
      const v=(pd.dot?'•':'')+fmtVal(pspec,pd.v);
      lr+=(foc?spH('a','▸'+pad(pspec.lbl,9),'cp',i):spH('d',' '+pad(pspec.lbl,9),'cp',i))+' ';
      vr+=(foc?spH('i',' '+pad(v,9),'cp',i):(pd.dot?spH('r',' '+pad(v,9),'cp',i):spH('v',' '+pad(v,9),'cp',i)))+' ';
    });
    L.push(lr); L.push(vr);
    L.push('');
    L.push('   '+sp('d','←→ params → next rack · shift+←→ jumps rack · digits rack · ↑↓ adjust · ⌫ reset'));
  }else if(M.slot){
    /* modHolder, not pre[M.id]: on a kit channel the rack you EDIT belongs to
       the focused pad, and rendering the channel's rack here would show one
       set of values while every edit went to another. */
    const rackA=modHolder(pre,M.id)[M.id];
    rackParams(L,pre,paramsFor(S.curMod,rackA[S.curSlot]));
  }
}

/* param display: when a note is focused, show its EFFECTIVE value in place,
   with a • marking params that carry a per-note override */
function stackStrip(){}          // (stacking removed — kits are per-pad chains)
function layerBanner(L,pre){     // which kit pad you're editing
  if(!isKit(pre))return;
  const M=MODULES[S.curMod];
  if(S.prepFocus==null){L.push('  '+sp('r','◆ KIT')+sp('d','  play a pad (a note) to pick which instrument you edit'));return;}
  const K=kitSlot(pre,S.prepFocus), pc=pcOf(S.prepFocus);
  if(M.prs)return;
  L.push('  '+sp('r','◆ pad '+NN[pc])+sp('a',' '+K.name+' ('+(K.cat||'kik')+')')+
    sp('d',' — this pad is its own full chain; every rack edits THIS pad'));
}
function prepDisp(pre,mi,si,spec){
  const holder=modHolder(pre,MODULES[mi].id);
  if(holder!==pre)return {v:getV(holder,mi,si,spec),dot:false};   // editing a layer
  const f=S.prepFocus;
  if(f==null||!pre.prep||!pre.prep.notes||!pre.prep.notes[f])
    return {v:getV(pre,mi,si,spec),dot:false};
  const node=pre.prep.notes[f];
  const key=MODULES[mi].id+':'+(MODULES[mi].flat?'-':si)+':'+spec.key;
  return {v:getV(prepEffective(pre,f),mi,si,spec),dot:!!(node.k&&node.k[key]!==undefined)};
}
function prepLine(L,pre){        // per-note prep overrides (non-kit channels)
  if(isKit(pre))return;          // kits show their pad banner instead
  const anyPrep=pre.prep&&pre.prep.notes&&Object.keys(pre.prep.notes).length;
  if(!anyPrep)return;
  const f=S.prepFocus;
  const has=f!=null&&pre.prep&&pre.prep.notes&&pre.prep.notes[f];
  L.push('  '+sp('r','◆ PREP')+
    sp('d','  note: ')+(f!=null?sp('a',NN[f%12]+(Math.floor(f/12)-1)+(has?' ●':'')):sp('d','play a note'))+
    sp('d','  ·  cmd+↑↓ tweaks this note only (• marks it) · ⌫ removes'));
  L.push('');
}
function renderSlots(L){
  const pre=S.presets[S.editSnd], M=MODULES[S.curMod];
  if(M.prs){renderExplore(L,pre);return;}
  prepLine(L,pre);
  layerBanner(L,pre);
  if(!M.slot){L.push('   '+sp('d','no slots'));return;}
  const rackA=modHolder(pre,M.id)[M.id];
  rackStrip(L,rackA,M);
  L.push('');
  const sl=rackA[S.curSlot];
  rackParams(L,pre,paramsFor(S.curMod,sl));
  L.push('');
  // per-module summary line
  let sum='  '+sp('d','rack: ');
  if(M.id==='osc'){
    rackA.forEach((o,i)=>{
      if(i>0&&o.amt<=0.001)return;
      const d=o.dst||0, dT=d>0?''+d:'prev';
      const seg=i===0?((i+1)%10)+WAVES[o.wav]
        :o.mode===1?`  ${(i+1)%10}${WAVES[o.wav]}→fm(${dT})`
        :o.mode===2?`  ${(i+1)%10}${WAVES[o.wav]}→ring(${dT})`
        :`  +${(i+1)%10}${WAVES[o.wav]}`;
      sum+=(i===S.curSlot?sp('a',seg):sp('d',seg));
    });
  }else if(M.id==='mod'){
    rackA.forEach((m2,i)=>{
      if(!m2.src)return;
      const tgts=(m2.routes||[]).map(rt=>rt.tgt?tgtLabel(rt.tgt):MDST[rt.dst||0]+((rt.dst===3||rt.dst===5)?rt.idx:'')).join(',');
      const seg=`  ${(i+1)%10}${MSRC[m2.src]}→${tgts}`;
      sum+=(i===S.curSlot?sp('a',seg):sp('d',seg));
    });
  }else{
    rackA.forEach((s2,i)=>{
      const ab=M.abbr(s2); if(ab==='···')return;
      sum+=(i===S.curSlot?sp('a','  '+((i+1)%10)+ab):sp('d','  '+((i+1)%10)+ab));
    });
  }
  /* Hard cap: this line is assembled from unbounded per-slot descriptions and
     a fully routed MOD rack reached 248ch, which shoves the whole centred page
     sideways. Trim on the rendered text, so short racks look exactly as before. */
  L.push(clipLine(sum,100));
  L.push('');
  // mod loop, scoped to this slot (dim dots = other slots of this module)
  const ml=pre.modLoop, mEdit=ml.state==='edit';
  const cellM=cellOf(ml);
  const phM=T.playing?Math.floor(fmod(posNow(),ml.len)/cellM):-1;
  const evSlot=ml.events.filter(e=>e.m===S.curMod&&(e.s??-1)===S.curSlot);
  const evMod=ml.events.filter(e=>e.m===S.curMod);
  /* armed has to READ as armed — this was dim grey next to the point count,
     which is indistinguishable from not being armed at all */
  L.push('  '+sp('d','mod loop (slot '+((S.curSlot+1)%10)+'): '+evSlot.length+' pts · rack '+evMod.length)
    +(ml.state==='rec'?sp('r',T.playing?'   ● REC — param moves record here':'   ● armed — press space'):'')
    +sp('d','  ·  ⇧⌫ clear slot pts'));
  L.push('   '+gridRow(ml,cellM,phM,(a,b)=>
    evSlot.some(e=>e.t>=a-1e-9&&e.t<b-1e-9)?'▪':
    evMod.some(e=>e.t>=a-1e-9&&e.t<b-1e-9)?'∙':'·',mEdit?curCell(ml):-1,'cell'));
  if(mEdit)L.push('  '+sp('i',' EDIT ')+' '+sp('a',(curCell(ml)+1)+'/'+stepCells(ml))+
    sp('d','  ←→ cursor · shift+←→ slot · ↑↓ set point · ⌫ clear cell'));
  L.push('');
  const hints={osc:'dest routes fm/ring/sync at any op · sync: ratio = the sweep, pitch follows the master · edits are live on held notes',
    flt:'peq/lsh/hsh use gain — stack EQ bands alongside filters',
    mod:'src = env/lfo/vel/key/rnd/press · dest = amp/pitch/filt/pan/op · cmd+C then cmd+V learns any param',
    fx:'serial chain top to bottom · dist holds every drive/crush curve (drv + crush retired into it)',
    ply:'chord (±strum: + low→high, − high→low) · arp needs transport · grv = this part’s groove · rpit = per-note random pitch'};
  L.push('   '+sp('d','←→ flows params → next slot · shift+←→ jumps slot · digits pick slot · ↑↓ value'));
  L.push('   '+sp('d',hints[M.id]||''));
}

function renderExplore(L,pre){
  const cat=pre.cat||'misc', pool=libAll().filter(en=>en.cat===cat);
  S.libSel=clamp(S.libSel||0,0,Math.max(0,pool.length-1));
  const page=Math.floor(S.libSel/10), pages=Math.max(1,Math.ceil(pool.length/10));
  L.push('  '+sp('d','library / ')+sp('a',cat)+sp('d','  ·  '+pool.length+' presets · page '+(page+1)+'/'+pages));
  L.push('');
  if(!pool.length)L.push('   '+sp('d','(empty — save or randomize some '+cat+' sounds first)'));
  for(let i=page*10;i<Math.min(pool.length,page*10+10);i++){
    const en=pool[i], sel=i===S.libSel, loaded=en.name===pre.name;
    L.push('   '+sp('d',((i%10+1)%10)+' ')+
      (sel?sp('i',' '+pad(en.name,10)):sp(loaded?'a':'d',' '+pad(en.name,10)))+
      (loaded?sp('a',' ● loaded'):'')+(en.factory?sp('d','  factory'):sp('d','  yours')));
  }
  L.push('');
  L.push('   '+sp('d','digits/↑↓ audition · ←→ page · letters play · ⌫ delete (yours only)'));
  if(S.libStash)L.push('   '+sp('a','enter = keep this sound')+sp('d','  ·  ')+
    sp('a','esc = back to your '+S.libStash.name)+sp('d','  (browsing never loses your sound)'));
}

function renderMaster(L){
  if(!Array.isArray(S.master)){S.master=mkMaster(); dirtySave=true;

    const ab=sl2.typ?XTYPES[sl2.typ]:'···';
    const lbl=` ${(i+1)%10}${ab}${sl2.typ?(Math.round(sl2.rt)===1?'ˢ':'ᵐ'):''} `;
    tabs+=(!onDj&&i===(S.mSlot||0)?spH('i',lbl,'msl',i):(sl2.typ?spH('a',lbl,'msl',i):spH('d',lbl,'msl',i)));
  });

    djr+=(onDj&&i===S.mDj?spH('i',lbl,'dj',i):on?spH('r',lbl,'dj',i):(sl2.typ?spH('a',lbl,'dj',i):spH('d',lbl,'dj',i)));

  L.push('   '+sp('d','route: ˢsend = parallel bus (channels feed it via an fx \'send\' slot) · ᵐmstr = mix insert'));
  L.push('   '+sp('d','dj pads play from ARRANGE: hold = momentary · shift = latch · rec/edit = automation (≈)'));
}

let lastR=0, lastF=0, cpuLoad=0;
(function raf(t){
  requestAnimationFrame(raf);
  if(lastF){                       // main-thread load: how far frames stretch past 60fps
    const gap=t-lastF;
    if(gap<500)cpuLoad=cpuLoad*0.95+clamp((gap-17)/17,0,1)*100*0.05;
  }
  lastF=t;
  eraseSweep();
  if(T.playing)finalizeCaptures(false);
  if(!T.playing&&t-lastR>250)dirty=true;   // keep the cpu meter live while idle
  if((T.playing||dirty)&&t-lastR>33){lastR=t;dirty=false;render();}
})(0);
