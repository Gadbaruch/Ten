    }
    return;
  }
  if(c==='Enter'){e.preventDefault(); if(!e.repeat)diveIn(); return;}
  if(c==='Escape'){e.preventDefault();
    if(HE.cancelLearn())return;
    if(CHSEL.size){CHSEL.clear(); flash('channel selection cleared'); dirty=true; return;}
    if(SELALL!=null){SELALL=null; flash('note selection cleared'); dirty=true; return;}
    const h=curHolder();
    if(S.layer===3&&MODULES[S.curMod].prs&&S.libStash){   // leaving explorer: restore what you came in with
      const st=S.libStash; S.libStash=null;
      if(JSON.stringify(st.data)!==JSON.stringify(presetData(S.presets[S.editSnd]))){
        applyPresetData(S.editSnd,st.name,st.cat,st.data);
        flash('↩ back to your '+st.name);
      }
    }
    if(rs(e))S.layer=1;
    else if(h.state==='edit')h.state='on';
    else if(S.layer===1){S.layer=-1;S.sessSel=null;}   // up from the pattern = settings
    else surface();
    dirty=true; return;}
  if(c==='CapsLock'){e.preventDefault(); return;}   // the state is read, not toggled
  /* ` IS THE INSTRUMENT and \\ IS THE DICE. They swapped places: the scope you
     reach for constantly wanted the key under your finger, and the one that
     rerolls everything is better off somewhere you have to mean it. */
  if(c==='Backquote'&&S.layer>0&&!e.repeat&&!e.metaKey){
    e.preventDefault(); HOLD.i=true; HOLD.iUsed=false; return;}
  if(c==='Slash'){e.preventDefault();
    if(!e.repeat){HOLD.r=true; HOLD.rUsed=false; HOLD.rLatch=KM.sl; if(KM.sl)LATCH.used=true;}
    return;}
  if(S.layer===0&&DJCODE[c]!==undefined){e.preventDefault();     // DJ pads: full home row
    if(e.repeat)return;
    const k=DJCODE[c];
    if(!rs(e)&&S.arr.state==='edit'){                        // edit: toggle a dj block at the cursor
      pushUndo('dj place');
      const cell=cellOf(S.arr), t0=curCell(S.arr)*cell;
      const ex=S.arr.events.findIndex(ev=>ev.dj===k&&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
      if(ex>=0)S.arr.events.splice(ex,1);
      else S.arr.events.push({t:t0,dj:k,dur:cell});
      dirtySave=true; djApply(); return;
    }
    if(!rs(e)&&!djLatch[k]&&S.arr.state==='rec'&&T.playing)
      djRecStart[k]=posNow();                                     // record the fx move into the arrangement
    djPress(k,KM.sl); return;}
  if(c==='Comma'||c==='Period'){
    const d=c==='Period'?1:-1;
    if(S.layer===1&&!rs(e)){          // quick channel volume in the pattern layer
      const p=S.presets[S.curPreset];
      p.mix.lvl=+fToVol(clamp(volToF(p.mix.lvl)+d*2,0,100)).toFixed(4);
      engine.refresh(S.curPreset);
      flash(p.name+' vol '+volToF(p.mix.lvl).toFixed(0));
      dirty=true; dirtySave=true; return;
    }
    setBpm(T.bpm+d*(rs(e)?10:1)); return;
  }
  if(c==='KeyB'&&ctlOf(e)&&!HOLD.q){
    if(!e.repeat){HOLD.m=true; HOLD.mUsed=false;}
    return;}
  if(c==='KeyT'&&S.layer===0&&!e.repeat){        // t = timeline on/off (focus mode)
    S.arrOn=S.arrOn===false?true:false;
    flash(S.arrOn?'timeline ON — arrangement drives the song':'timeline OFF — looping the current pattern');
    dirty=true; dirtySave=true; return;}
  if(c==='KeyQ'&&ctlOf(e)&&!e.repeat&&!e.shiftKey&&S.layer>=1){
    e.preventDefault(); HOLD.q=true; HOLD.qUsed=false; return;}
  if(c==='KeyQ'&&ctlOf(e)&&!e.repeat){           // ⌃q = live-quantize toggle, everywhere
    /* ⇧Q SNAPS WHAT IS ALREADY RECORDED, and it took three things to reach:
       the RIGHT shift, layer 1, and a lane with notes — and missing any of
       them it did nothing and said nothing, which is indistinguishable from
       a key that does not exist. Either shift now, on any layer that has a
       channel, and it always reports what it did. */
    if(e.shiftKey&&S.layer>=1){                 // shift+Q = snap this channel's notes NOW
      /* AND THE KEY-UP MUST NOT ALSO TOGGLE. The snap ran, then releasing q
         counted as a tap and flipped live quantize — whose message landed on
         top of the snap's a moment later. It looked like ⇧Q only toggled Q. */
      HOLD.q=false; HOLD.qUsed=true;
      const ch=S.layer>=2?S.editSnd:S.curPreset;
      const tg=(S.layer<2&&CHSEL.size)?[...CHSEL].sort((a,b)=>a-b):[ch];
      let moved=0, total=0;
      pushUndo('quantize');
      for(const i of tg){
        const lane=S.patterns[S.editPat].lanes[i]; if(!lane)continue;
        const st=lane.qlive??1, g=gridOf(lane);
        lane.events.forEach(ev=>{const was=ev.t;
          ev.t=fmod(ev.t+(qz(ev.t,g)-ev.t)*st,lane.len);
          total++; if(Math.abs(ev.t-was)>1e-6)moved++;});
      }
      const g0=gridOf(S.patterns[S.editPat].lanes[tg[0]]||{});
      flash(!total?'ch '+tg.join(' ')+' has no notes to snap'
        :moved?'snapped '+moved+' of '+total+' notes to '+gridName(g0)+' · ch '+tg.join(' ')
              :'already on the '+gridName(g0)+' grid · ch '+tg.join(' '));
      dirty=true; dirtySave=true; return;
    }
    CFG.qOn=CFG.qOn?0:1; saveCfg();
    flash('live quantize '+(CFG.qOn?'ON':'OFF')+' — what you hear is what records');
    dirty=true; return;}

  const lp=curLoop();
  if(c==='Backspace'&&(HOLD.dig>=0||HOLD.n)){e.preventDefault();
    if(HOLD.dig>=0){clearLane(HOLD.dig); HOLD.digUsed=true;}
    else{const tg=chTargets(); tg.forEach(clearLane); HOLD.nUsed=true;
      if(tg.length>1)chSay('cleared',tg.length);}
    return;}
  if(c==='Backspace'&&HOLD.c){e.preventDefault();
    const tg=chTargets();
    pushUndo('mix reset');
    tg.forEach(i=>{const pc=S.presets[i]; pc.mix.lvl=0.8; pc.mix.pan=0; engine.refresh(i);});
    chSay('mix reset — 80V centre',tg.length);
    HOLD.cUsed=true; dirty=true; dirtySave=true; return;}
  /* tab is REC, so tab+⌫ RECORDS THE SILENCE: hold it and the playhead wipes
     the lane as it passes, exactly the span that ⌫ alone would only have
     silenced. Erasing by playing over a passage is how you take something out
     of a loop — reaching for a step editor to do it is a different instrument. */
  if(c==='Backspace'&&HOLD.tab&&!rs(e)&&!e.repeat){e.preventDefault();
    if(!T.playing){flash('press space — erase happens as the playhead passes');return;}
    pushUndo('erase');
    eraseHold={sweep:posNow(),bornAt:performance.now()};
    engine.chokeSeq(focusCh());
    flash('erasing ch '+focusCh()+' while held');
    HOLD.tabUsed=true; return;}
  if(c==='Backspace'&&HOLD.tab){e.preventDefault();
    if(loopOps(e,c,curLoop()))HOLD.tabUsed=true;
    return;}
  if(c==='Backspace'){e.preventDefault();
    if(e.repeat)return;
    if(rs(e)){clearTimeout(delHoldTimer);delHoldTimer=setTimeout(layerInit,800);}
    /* AUTOMATION IS CLEARED WHERE YOU CAN SEE IT. The 'mod clear' branches
       further down were unreachable — ⇧⌫ is the lane, at every depth, which is
       how it was asked for — so there was no key at all for the points. Option
       takes the same two shapes: this rack, or the whole channel. */
    /* …and while the overlay is up it takes a third and better shape: the ONE
       knob you are looking at. Clearing by rack was as precise as the display
       could be; now the display is precise, so the erase is too. */
    if(altOf(e)&&!rs(e)&&autoOn()&&!S.mSel){
      const pre=S.presets[S.curPreset], fr=aFront(pre);
      if(!fr){flash('no automation on '+pre.name);return;}
      pushUndo('automation clear');
      const was=Math.max(0,aIndexOf(autoLanes(pre),fr.k));
      pre.modLoop.clear(ev=>sameAddr(evAddr(pre,ev),fr.a));
      flash(fr.pts.length+' points cleared — '+destLabel(fr.a));
      const rest=autoLanes(pre);                 // land on a knob that still exists
      S.aAddr=rest.length?rest[Math.min(was,rest.length-1)].k:null;
      dirty=true; dirtySave=true; return;
    }
    if(altOf(e)&&S.layer>=2&&!S.mSel){
      const ml=S.presets[S.editSnd].modLoop;
      if(!ml.events.length){flash('no automation on '+S.presets[S.editSnd].name);return;}
      pushUndo('automation clear');
      if(rs(e)){ml.events=[]; flash('all automation cleared on '+S.presets[S.editSnd].name);}
      else{
        const n0=ml.events.length;
        {const pre=S.presets[S.editSnd], rk=MODULES[S.curMod]&&MODULES[S.curMod].id;
         ml.events=ml.events.filter(ev=>{const a=evAddr(pre,ev);return !a||a.rack!==rk;});}
        flash((n0-ml.events.length)+' '+MODULES[S.curMod].name.toLowerCase()+' points cleared');
      }
      dirty=true; dirtySave=true; return;
    }
    if(rs(e)&&S.layer>=2&&!S.mSel){clearLane(focusCh());return;}   // same key, either depth
    if(rs(e)&&S.layer===1&&CHSEL.size>1){
      const tg=chTargets(); tg.forEach(clearLane); chSay('cleared',tg.length); return;}
    if(S.layer>=2&&!rs(e)&&!MODULES[S.curMod].prs&&!S.mSel&&resetParam())return;
    if(S.layer>=2&&!rs(e)&&MODULES[S.curMod].prs){   // reset the focused kit pad
      const p=S.presets[S.editSnd], K=edKit(p);
      if(K){pushUndo('kit pad');
        p.kit[pcOf(S.prepFocus)]=null; kitSlot(p,S.prepFocus,true);
        flash('pad '+NN[pcOf(S.prepFocus)]+' reset'); dirty=true; dirtySave=true; return;}
    }
    if(S.layer===0&&rs(e)){          // clear everything inside the selected pattern
      pushUndo('pattern clear');
      const p=S.patterns[S.curPat];
      p.lanes.forEach(l=>{l.clear();delete l._cap;});
      retroBuf.forEach(b=>b.length=0);
      flash('pattern '+S.curPat+' cleared (all lanes)');
      dirty=true; dirtySave=true; return;}
    if(inEdit()){
      pushUndo('cell clear');
      const cell=cellOf(lp), t0=curCell(lp)*cell;
      if(S.layer>=2){const pre=S.presets[S.editSnd], rk=MODULES[S.curMod]&&MODULES[S.curMod].id;
        lp.clear(ev=>{const a=evAddr(pre,ev);
          return a&&a.rack===rk&&String(a.slot)===String(S.curSlot)
                 &&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9;});}
      else lp.clear(ev=>ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
      dirty=true; dirtySave=true; return;}
    const recing=T.playing&&curHolder().state==='rec'&&S.layer>0;
    if(recing&&!rs(e)){
      eraseHold={sweep:posNow(),bornAt:performance.now()};
      flash('erasing while held'); return;}
    if(S.layer===0){pushUndo('timeline clear');lp.clear();flash('timeline cleared');}
    else if(S.layer===1){
      if(rs(e))clearLane(focusCh());   // notes and length both, back to listening
      else if(T.playing){muteHold={lane:S.curPreset};engine.chokeSeq(S.curPreset);
        flash('holding '+S.presets[S.curPreset].name+' silent — ⇧⌫ clears');return;}
      else{flash('⇧⌫ clears the lane');return;}
    }
    else if(S.layer===3&&MODULES[S.curMod].prs){   // explorer: delete selected user preset
      const p=S.presets[S.editSnd], pool=libAll().filter(en=>en.cat===(p.cat||'misc'));
      const en=pool[S.libSel||0];
      if(!en){flash('nothing selected');}
      else if(en.factory){flash(en.name+' is a factory preset');}
      else{
        libStore(libAll().filter(x=>x.name!==en.name));
        S.libSel=Math.max(0,(S.libSel||0)-1);
        flash('deleted '+en.name+' from library');
      }
      dirty=true; return;}
    else if(S.layer>=2&&rs(e)){pushUndo('mod clear');
      const pre=S.presets[S.editSnd], rk=MODULES[S.curMod]&&MODULES[S.curMod].id;
      curHolder().clear(ev=>{const a=evAddr(pre,ev);
        return a&&a.rack===rk&&(S.layer===2||String(a.slot)===String(S.curSlot));});
      flash((S.layer===2?'mod':'slot mod')+' points cleared');}
    else {resetParam();return;}
    dirty=true; dirtySave=true; return;}

  /* hold q, press a digit: THIS channel's grid. The digits are the divisions
     in order of how coarse they are, so 4 (16ths) sits where your hand already
     is and either direction from it is finer or broader — and 0, past the
     coarsest, is no grid at all.

     HOLD.qUsed is set before anything can go wrong with the digit, including
     on a repeat: choosing a grid must never be mistaken for a tap, or setting
     one would switch quantize off on the way out. */
  /* WHERE YOU HEAR IT vs WHERE IT LANDS. Snapping the note you hear onto the
     grid is the whole feel of playing this thing — and it is also why a roll
     faster than the grid loses notes, because two hits inside one step become
     two note-ons at the SAME instant and a mono channel can only sound one.
     No downstream fix exists: four grid points can hold four events. So the
     monitor is a switch. Grid = locked to the beat, rolls thin out. Live = you
     hear your fingers, the grid still owns what records. */
  if(c==='KeyM'&&ctlOf(e)&&HOLD.q&&S.layer>=1){
    e.preventDefault(); HOLD.qUsed=true;
    if(e.repeat)return;
    CFG.qMon=CFG.qMon===0?1:0; saveCfg();
    flash(CFG.qMon?'monitor → GRID — you hear yourself locked to the beat'
                  :'monitor → LIVE — you hear every hit as you play it; the grid still records');
    dirty=true; return;
  }
  if(/^Digit\d$/.test(c)&&HOLD.q&&S.layer>=1){
    e.preventDefault();
    HOLD.qUsed=true;
    if(e.repeat)return;
    const n=+c.slice(5), g=GRIDS[n];
    if(n===0){
      CFG.qOn=0; saveCfg();
      flash('quantize OFF — notes land exactly where you played them');
      dirty=true; return;
    }
    if(!g){flash('grids are 1-8, or 0 for none: '+GRIDN.slice(1).join(' · '));return;}
    const tg=chTargets(), pat=S.patterns[S.editPat];
    tg.forEach(i=>{const l=pat.lanes[i]; if(l)l.grid=g;});
    if(!CFG.qOn){CFG.qOn=1; saveCfg();}          // asking for a grid is asking to be on it
    chSay('grid → '+GRIDN[n],tg.length);
    dirty=true; dirtySave=true;
    return;
  }
  if(/^Digit\d$/.test(c)&&HOLD.tab&&S.layer>=1){
    e.preventDefault();
    if(!e.repeat){
      HOLD.tabUsed=true;
      const bars=(+c.slice(5))||10;                  // 0 = ten bars
      retroBars(bars);
    }
    return;
  }
  if(/^Digit\d$/.test(c)){
    const n=+c.slice(5);
    if(!e.repeat&&S.layer>=1&&!rs(e)&&!altOf(e)){HOLD.dig=n; HOLD.digUsed=false;}
    if(S.layer===0){
      if(S.arr.state==='edit'){
        pushUndo('place');
        const cell=cellOf(S.arr), t0=curCell(S.arr)*cell;
        S.arr.clear(ev=>ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
        S.arr.events.push({t:t0,pattern:n});
        stepCur=(curCell(S.arr)+1)%stepCells(S.arr);
        dirty=true; dirtySave=true; return;}
      if(n===0&&S.curPat===0&&!S.mSel&&S.arr.state!=='rec'){  // 0 again on pattern 0 = select MASTER
        S.mSel=true; dirty=true; return;}
      S.mSel=false; S.curPat=n;
      if(T.playing)requestSwitch(n,posNow());
      if(S.arr.state==='rec'&&T.playing){
        const L=S.arr.len, t=fmod(qz(fmod(posNow(),L),1),L);
        S.arr.clear(ev=>Math.abs(ev.t-t)<1e-6);
        S.arr.events.push({t,pattern:n}); dirtySave=true;
      }
    }
    else if(S.layer>=1){
      const l2=S.patterns[S.editPat].lanes[n];
      if(rs(e)&&!e.repeat){
        /* ⇧+digit used to solo. Solo has ⌥s now, and this is the gesture that
           was needed for picking several channels out at once — which is the
           only way "turn these into one kit" can be asked for. */
        if(CHSEL.has(n))CHSEL.delete(n); else CHSEL.add(n);
        S.curPreset=n; S.mSel=false; stepWalked=false;
        flash(CHSEL.size?[...CHSEL].sort().join(' ')+'  ·  ⌘⌥⇧K makes them one kit · esc clears'
                        :'selection cleared');
        dirty=true; return;
      }
      if(false){
        const kind='mute';
        if(e.repeat)return;
        /* MUTE AND SOLO ARE TOGGLES. They were momentary-with-latch like rec
           and the roll, which is right for a thing you are performing but wrong
           for a thing you are deciding: you mute a channel because it should
           not be in the mix, and that is a state, not a gesture. Press once for
           on, once more for off, and nothing to remember about which modifier
           you were holding when you did it. */
        const other=kind==='solo'?'mute':'solo';
        pushUndo(kind);
        /* GO TO THE CHANNEL YOU JUST TOUCHED. Muting something is a statement
           about it, and the next thing you want is almost always to look at
           it — turn it back up, hear it alone, change what it is playing. */
        if(S.layer<2){S.curPreset=n; S.mSel=false; SELALL=null; stepWalked=false;}
        l2[kind]=!l2[kind];
        /* you cannot both insist on a channel and silence it — asking for one
           withdraws the other, rather than leaving the pair contradicting */
        if(l2[kind])l2[other]=false;
        flash('lane '+n+' '+S.presets[n].name+' '+kind.toUpperCase()+(l2[kind]?'':' off'));
        dirty=true; dirtySave=true;
      }else if(n===0){                     // 0 = the master strip, at the row's end
        /* stays on the pattern: the master is a channel now, and picking a
           channel has never meant leaving the view it lives in */
        S.mSel=true; S.mSlot=S.mSlot||0; S.mDj=null; S.mParam=0;
        flash('master'); dirty=true;
      }else{S.mSel=false; S.curPreset=n; if(S.layer>=2)S.editSnd=n;}   // the view follows
    }
    else if(MODULES[S.curMod].prs){        // explorer: digit loads the nth entry on the page
      const p=S.presets[S.editSnd], pool=libAll().filter(en=>en.cat===(p.cat||'misc'));
      const idx=Math.floor((S.libSel||0)/10)*10+(n===0?9:n-1);
      if(pool[idx]){S.libSel=idx;applyPresetData(S.editSnd,pool[idx].name,pool[idx].cat,pool[idx].data);flash('loaded '+pool[idx].name);}
    }
    else {
      const si=n===0?9:n-1, M=MODULES[S.curMod];
      if(si===S.curSlot&&M.slot&&!M.prs){        // same slot again = bypass on/off
        const sl=modHolder(S.presets[S.editSnd],M.id)[M.id][si];
        pushUndo('bypass');
        sl.off=sl.off?0:1;
        engine.rebuildRack(S.editSnd); engine.refresh(S.editSnd);
        if(M.id==='osc')engine.oscLive(S.editSnd,'off');   // mute the operator now, not next note
        flash(M.name+' slot '+((si+1)%10)+(sl.off?' BYPASSED':' back on'));
        dirtySave=true;
      }else S.curSlot=si;      // hold the param index, as shift+←→ does; curAddr clamps
    }
    dirty=true; return;
  }

  if((c==='ArrowLeft'||c==='ArrowRight'||c==='ArrowUp'||c==='ArrowDown')&&
     (HOLD.tab||HOLD.m||HOLD.c||HOLD.n||HOLD.r||HOLD.i||HOLD.v)){
    e.preventDefault();
    const dv=(c==='ArrowUp'||c==='ArrowRight')?1:-1, vert=c==='ArrowUp'||c==='ArrowDown';
    if(HOLD.r){                                    // how loaded the dice are — one global number
      if(vert){CFG.wild=clamp(Math.round((CFG.wild??35)+dv*(rs(e)?1:5)),0,100);
        saveCfg(); flash('wild '+CFG.wild+'%'); HOLD.rUsed=true; dirty=true;}
      return;
    }
    if(HOLD.c){                                    // CHANNEL: this channel's place in the mix
      const tg=chTargets();
      /* the same three sizes every other param uses: ⇧ coarse, plain, ⌥ fine.
         In fader units that is 10 · 1 · 0.1. */
      const stV=rs(e)?10:altOf(e)?0.1:1;
      tg.forEach(i=>{
        const pc=S.presets[i];
        if(vert){
          const f=clamp(Math.round((volToF(pc.mix.lvl)+dv*stV)*10)/10,0,100);
          pc.mix.lvl=+fToVol(f).toFixed(4);
        }else pc.mix.pan=clamp(Math.round((pc.mix.pan+dv*(rs(e)?0.25:altOf(e)?0.01:0.05))*100)/100,-1,1);
        engine.refresh(i);
      });
      const p0=S.presets[tg[0]];
      chSay(vert?p0.name+' vol '+volToF(p0.mix.lvl).toFixed(1)
                :p0.name+' pan '+panCh(p0.mix.pan).trim(),tg.length);
      HOLD.cUsed=true; dirty=true; dirtySave=true; return;
    }
    if(HOLD.v){                                    // VEL: how hard this channel plays
      if(vert&&rs(e)){                             // ⇧ = the KEYBOARD's velocity, not the channel's
        EXP.bump(dv*0.05);
        flash('keyboard vel '+Math.round(clamp(CFG.kvel??0.9,0.02,1)*127));
      }else if(vert){
        /* an offset ON TOP of what each note carries, so a lane keeps its own
           dynamics and just sits harder or softer in the mix */
        const tg=chTargets();
        tg.forEach(i=>{const pv=S.presets[i];
          pv.vof=clamp(Math.round(((pv.vof||0)+dv*0.05)*100)/100,-0.9,0.9);});
        const p0=S.presets[tg[0]];
        chSay(p0.name+' vel '+(p0.vof>0?'+':'')+Math.round((p0.vof||0)*100)+'%',tg.length);
      }
      HOLD.vUsed=true; dirty=true; dirtySave=true; return;
    }
    if(HOLD.i){                                    // INST: which sound this channel IS
      const what=vert&&rs(e)?'engine':vert?'prst':rs(e)?'model':'type';
      const tgI=chTargets();
      if(tgI.length>1){
        /* instAction works on the focused channel, so walk the cursor across
           the selection and put it back — one gesture, every channel moved */
        const keep=S.curPreset, keepE=S.editSnd;
        tgI.forEach(i=>{S.curPreset=i; S.editSnd=i; instAction(what,dv);});
        S.curPreset=keep; S.editSnd=keepE;
        chSay(what+' '+(dv>0?'+':'−')+'1',tgI.length);
      }else instAction(what,dv);
      HOLD.iUsed=true; return;
    }
    if(HOLD.n){                                    // NOTES: the pitch of what this channel plays
      const tgN=chTargets();
      if(tgN.length>1){
        const step2=vert?12:1;
        tgN.forEach(i=>{const p2=S.presets[i];
          const tot=clamp(trSemis(p2)+dv*step2,-36,36); p2.tr=0; p2.trs=tot;});
        chSay(trLabel(S.presets[tgN[0]]),tgN.length);
        HOLD.nUsed=true; dirty=true; dirtySave=true; return;
      }
      const pi2=tgN[0], pn=S.presets[pi2];
      /* ONE number, in semitones. Octaves and semitones were separately
         clamped at ±3 and ±12, so the two gated each other: twelve semitones
         up and the semitone key stopped working even though the channel had
         two octaves of room left. Both keys now move the same total. */
      {
        const step2=vert?12:1;
        const tot=clamp(trSemis(pn)+dv*step2,-36,36);
        pn.tr=0; pn.trs=tot;
        flash(pn.name+' '+trLabel(pn));
      }
      HOLD.nUsed=true; dirty=true; dirtySave=true; return;
    }
    if(HOLD.m){                                    // tempo: shift ×10, option ×0.1
      if(c==='ArrowUp'||c==='ArrowDown'){
        const step=altOf(e)?0.1:rs(e)?10:1, d2=c==='ArrowUp'?1:-1;

      }
      return;
    }
    {const tg=chTargets(), pat=S.patterns[S.editPat];
     let did=false;
     tg.forEach(i=>{ if(loopOps(e,c,pat.lanes[i]))did=true; });

  if(c==='ArrowLeft'||c==='ArrowRight'){e.preventDefault();

         swallow shift too — so in EDIT you could change neither slot nor param
         and could only ever place points on whatever was already focused. */
      const l2=curLoop(); stepCur=fmod(curCell(l2)+d,stepCells(l2));
    }
    else if(S.layer===0){
      if(rs(e)){                            // ⇧←→ = jump between parts (master at the end)
        if(S.mSel&&d<0){S.mSel=false;S.curPat=9;}
        else if(S.mSel&&d>0){S.mSel=false;S.curPat=0;}
        else if(S.curPat+d>9||S.curPat+d<0)S.mSel=true;
        else S.curPat=S.curPat+d;
        if(!S.mSel&&T.playing)requestSwitch(S.curPat,posNow());
      }else S.arrParam=fmod((S.arrParam||0)+d,ARRP.length);
    }
    else if(S.mSel&&S.layer>=2){                     // master: ←→ walks its params
      const dk=djEditing();
      if(dk!=null){                                  // ...or the held pad's
        const nP2=1+FX_P(S.dj[dk]||{}).length;
        S.mParam=clamp((S.mParam||0)+d,0,nP2-1);
        dirty=true; return;
      }
      const slM=S.master[S.mSlot||0];
      const nP=FX_P(slM).length+1+(S.master.some(x=>!x.typ)?1:0);
      if(rs(e)){const live=S.master.map((x,k)=>x.typ?k:-1).filter(k=>k>=0);
        if(live.length){const at=live.indexOf(S.mSlot||0);
          S.mSlot=live[fmod((at<0?0:at)+d,live.length)]; S.mParam=0;}}
      else S.mParam=clamp((S.mParam||0)+d,0,nP-1);
      dirty=true; return;
    }
    else if(S.layer===1){
      if(S.mSel)S.mSel=false;      // stepping off the master lands on a channel
      else S.curPreset=CH_LOW+fmod(S.curPreset-CH_LOW+d,10-CH_LOW);
      /* ⇧←→ USED TO DRAG A SELECTION and it was in the way: the arrows are how
         you walk the desk, and doing that with a thumb on shift quietly built a
         multi-channel selection you did not ask for. ⇧+digits is the one way
         to select channels now — you name them rather than sweep them. */
      SELALL=null;                 // a note selection belongs to the channel you made it on
      stepWalked=false;}
    else if(S.layer===2){
      /* Params flow left to right and spill into the next rack at the ends —
         the same gesture whether the rack is flat or holds slots. shift picks
         the SLOT, because digits already pick the rack and doing it twice left
         slots with no control of their own. On a rack with no slots shift still
         jumps rack, so the chord is never dead. */
      const pre2=S.presets[S.editSnd];
      const stepMod=dir=>{                       // next rack that actually exists
        let i=S.curMod,g=0;
        do{ i=fmod(i+dir,MODULES.length); g++; }while(!MODULES[i].id&&g<MODULES.length);
        return i;
      };
      const nParams=mi2=>{
        const M2=MODULES[mi2];
        if(M2.prs)return instFields().length;
        if(M2.flat)return M2.flat.length;
        if(M2.id==='osc'&&isCodeCh(S.editSnd))return CODEF().length;
        if(M2.id==='osc'&&isAudioCh(S.editSnd))return AUDF.length;
        if(M2.slot){const base=paramsFor(mi2,modHolder(pre2,M2.id)[M2.id][S.curSlot]).length;
          return base+(freeSlotHere(pre2)!=null&&mi2===S.curMod?1:0);}
        return 1;
      };
      const setParam=(mi2,px)=>{ if(flatView(mi2))S.curParam=px; else S.slotParam=px; };
      if(rs(e)){
        /* ONE list of slots, across all three sections. Racks used to be pages
           you jumped between with a separate gesture; now the only structure
           you move through is the chain itself, in the order it runs. Landing
           on '+' selects the first free slot in that section, so opening a new
           one is the same key as reaching the end of the row. */
        const chips=chipList(pre2);
        if(chips.length){
          gotoChip(chips[fmod(chipIndex(chips)+d,chips.length)]);
          S.curParam=0;
        }
      }else{
        const cur=flatView(S.curMod)?S.curParam:S.slotParam;
        const np=cur+d;
        if(np>=0&&np<nParams(S.curMod))setParam(S.curMod,np);

      }
    }
    else if(MODULES[S.curMod].prs){        // explorer: page
      S.libSel=Math.max(0,(S.libSel||0)+d*10);
    }
    else{
      const pre=S.presets[S.editSnd], M=MODULES[S.curMod], hold=modHolder(pre,M.id);
      const specs=paramsFor(S.curMod,hold[M.id][S.curSlot]);   // same holder the render uses
      const np=S.slotParam+d;
      if(rs(e)||np<0||np>=specs.length){  // ran off the end: next slot, same strip
        /* WHERE YOU WERE IN THE SLOT YOU ARE LEAVING. Jumping out and back
           used to dump you on the first param every time, so checking one
           slot against another meant walking the row again on every trip. */
        PSLOT[S.editSnd+'|'+M.id+'|'+S.curSlot]=S.slotParam;
        S.curSlot=fmod(S.curSlot+d,10);
        const s2=paramsFor(S.curMod,hold[M.id][S.curSlot]);
        const back=PSLOT[S.editSnd+'|'+M.id+'|'+S.curSlot];
        S.slotParam=(rs(e)&&back!=null&&back<s2.length)
          ? back                                   // shift+←→ is the jump: put me back
          : ((rs(e)||d>0)?0:s2.length-1);
      }else S.slotParam=np;
    }
    dirty=true; return;}
  if(c==='ArrowUp'||c==='ArrowDown'){e.preventDefault();
    const d=c==='ArrowUp'?1:-1;
    if(S.mSel&&S.layer<2){
      /* the master owns its own row: nothing here should move the instrument
         channel you happened to be on before you pressed 0 */
      flash('master — ←→ picks a channel, 0 stays here'); return;
    }
    /* a live selection owns the vertical arrows, because moving what you
       selected is the only reason you selected it */
    if(SELALL!=null&&S.layer>=1){
      const lane=S.patterns[S.editPat].lanes[SELALL];
      if(lane&&lane.events.length){
        pushUndo('nudge');
        /* DOWN IS LATER, because the grid runs top to bottom and the notes you
           are moving are right there on it. Moving them the other way from the
           key you pressed is the kind of thing you only get used to. */
        const g=gridOf(lane)*-d, L=lane.len;
        lane.events.forEach(ev=>{ev.t=fmod(ev.t+g,L);});
        flash('↕ '+lane.events.length+' notes '+(d<0?'+':'−')+'1 '+gridName(gridOf(lane)));
        dirty=true; dirtySave=true; return;
      }
    }
    if(S.layer===1){
      /* The grid runs top to bottom, so down means LATER. Walking into it is
         also how you get in: there is no mode to arm, you just move onto a
         step and start typing notes. (transpose moved to ⌥↑↓, volume to ⇧↑↓) */
      const pat1=S.patterns[S.editPat], lane1=pat1.lanes[S.curPreset];
      if(isAudioCh(S.curPreset)){flash('audio channel — no steps to edit');return;}
      /* Walking the grid no longer switches modes — caps lock owns that, and
         two ways into one mode meant they could disagree. The cursor still
         picks itself up from under the playhead the first time you move it. */
      const entering=!stepWalked;
      stepWalked=true;
      if(entering&&T.playing){
        /* the box was riding the playhead — freeze it exactly there instead of
           snapping to wherever the cursor happened to be parked last time */
        stepCur=Math.floor(fmod(posNow()-editAnchor(),lane1.len)/cellOf(lane1));
      }else stepCur=fmod(curCell(lane1)-d,stepCells(lane1));
      dirty=true; return;}
    /* THE MASTER IS ASKED FIRST. This branch used to sit below three that test
       S.layer===2 and the channel's current rack — and diveIn() leaves curMod
       on PRST — so pressing ↑↓ with the master selected edited the INSTRUMENT
       of whichever channel you had been on last, silently, while the master
       rack sat on screen looking selected. */
    if(S.mSel&&S.layer>=2){
      const dk=djEditing();
      if(dk!=null){                                  // the held pad's own effect
        if(!Array.isArray(S.dj))S.dj=DJ0();
        const sl2=S.dj[dk]||(S.dj[dk]={typ:0,p1:0.3,p2:0.3,p3:0.5,mix:0.5});
        const specs2=[SP('fx','typ','enum',{opts:XTYPES})].concat(FX_P(sl2));
        const spec2=specs2[clamp(S.mParam|0,0,specs2.length-1)];
        if(spec2){
          pushUndo('dj pad');
          if(spec2.set)spec2.set(sl2,adjust(spec2,getSP(sl2,spec2),d,kmult(e)));
          else sl2[spec2.key]=adjust(spec2,sl2[spec2.key],d,kmult(e));
          djApply(true);
          flash('dj '+DJKEYS[dk]+' · '+spec2.lbl+' '+fmtVal(spec2,getSP(sl2,spec2)));
          dirty=true; dirtySave=true;
        }
        return;
      }
      const slM=S.master[S.mSlot||0];
      const specs=FX_P(slM).concat([SP('route','rt','enum',{opts:['mstr','send']})]);
      const spec=specs[S.mParam];
      if(!spec){                                     // on the '+': open an insert
        const free=S.master.findIndex(x=>!x.typ);
        if(free<0){flash('master rack is full');return;}
        pushUndo('master slot'); S.mSlot=free; S.mParam=0;
        flash('new master insert — ↑↓ picks what it is');
      }else{
        pushUndo('master');
        if(spec.set)spec.set(slM,adjust(spec,getSP(slM,spec),d,kmult(e)));
        else slM[spec.key]=adjust(spec,slM[spec.key],d,kmult(e));
        engine.rebuildMaster();

    }
    if(S.layer===2&&MODULES[S.curMod].id==='osc'&&isCodeCh(S.editSnd)){
      pushUndo('code'); codeAction(d,kmult(e)); return;}
    if(S.layer===2&&MODULES[S.curMod].id==='osc'&&isAudioCh(S.editSnd)){
      pushUndo('audio'); audAction(d,kmult(e)); return;}
    if(S.layer>=2&&MODULES[S.curMod].prs){
      if(S.layer===3){                    // explorer: move + load
        const p=S.presets[S.editSnd], pool=libAll().filter(en=>en.cat===(p.cat||'misc'));
        if(pool.length){
          S.libSel=clamp((S.libSel||0)-d,0,pool.length-1);
          const en=pool[S.libSel];
          applyPresetData(S.editSnd,en.name,en.cat,en.data);
        }
        dirty=true; return;
      }
      {const flds=instFields(), fd=flds[S.curParam];
       if(fd&&fd.spec){                       // voice half: an ordinary param
         pushUndo('voice');
         const pv=S.presets[S.editSnd];
         pv.vox[fd.spec.key]=adjust(fd.spec,pv.vox[fd.spec.key],d,kmult(e));

    if(S.layer>=2){adjustParam(d,kmult(e));return;}   // shift=×10 · option=×0.1 (prep lives on cmd)
    if(S.layer===1){                      // ⌥↑↓ transposes THIS CHANNEL; z/x move the one global kb register
      const p=S.presets[S.curPreset];
      p.tr=clamp((p.tr||0)+d,-3,3);
      flash(S.presets[S.curPreset].name+' transpose '+(p.tr>=0?'+':'')+p.tr+' oct');
      dirty=true; dirtySave=true; return;}
    if(S.layer===0){                     // arrange params live on the arrows
      pushUndo('arrange param');
      const it=ARRP[S.arrParam||0]; it.a(d);
      flash(it.n+' = '+it.v());
      dirty=true; dirtySave=true; return;}
    S.oct=clamp(S.oct+d,-3,3); dirty=true; return;}

  if(c==='KeyZ'&&ctlOf(e)&&!e.repeat){S.oct=clamp(S.oct-1,-3,3);dirty=true;return;}
  if(c==='KeyX'&&ctlOf(e)&&!e.repeat){S.oct=clamp(S.oct+1,-3,3);dirty=true;return;}
  /* c / v = velocity down / up for the laptop keyboard, the way z / x move the
     octave. A real velocity source (midi, and later the hall-effect board)
     overrides this per note; this is what you play with until then. */
  if(c==='KeyC'&&ctlOf(e)&&S.layer>0&&!e.repeat&&HOLD.dig<0){
    e.preventDefault(); HOLD.c=true; HOLD.cUsed=false; return;}
  if(c==='KeyN'&&ctlOf(e)&&S.layer>0&&!e.repeat&&HOLD.dig<0){
    e.preventDefault(); HOLD.n=true; HOLD.nUsed=false; return;}
  if(c==='KeyV'&&ctlOf(e)&&S.layer>0&&!e.repeat&&HOLD.dig<0){
    e.preventDefault(); HOLD.v=true; HOLD.vUsed=false; return;}

  /* the master's own pads: the dj row, where you are rather than off in a
     layer you had to leave the mix to reach */
  if(S.mSel&&S.layer>=1&&DJCODE[c]!==undefined&&!e.repeat&&HOLD.dig<0){
    e.preventDefault();
    const k=DJCODE[c];
    if(S.patterns[S.editPat].state==='rec'&&T.playing&&!djLatch[k])djRecStart[k]=posNow();
    djPress(k,KM.sl);      // latch is the left shift, like every other momentary

  }
  /* a MODIFIED letter is never a note — the modifier is what says "this is a
     control, not a pitch", and it has to hold in both directions or ⌃c would

  if(isNoteKey(c)&&!e.repeat&&S.layer>0&&!e.ctrlKey&&!e.metaKey&&!altOf(e)){
    e.preventDefault();
    /* midi solo: the board's own keystrokes are noise — only the events EXP
       synthesises for a midi note get through, so a note can't fire twice */
    if(EXP.muted(c)&&!EXP.synth)return;
    /* the same key again releases what it is holding — the way out is the key
       you came in on, exactly like rec and the dj pads */
    if(SUS.has(c)){endNote(c); dirty=true; return;}
    if(KM.sl){noteLatch.add(c); LATCH.used=true;}
    const wasHeld=new Set(kbHeld); kbHeld.add(c);
    const pi=S.layer===1?S.curPreset:S.editSnd;
    const midi=60+S.oct*12+noteOf(c);
    const hitVel=EXP.take();          // MIDI velocity if this key came from EXP, else the c/v value
    if(isAudioCh(pi)){flash('audio channel — tab records mic, drop a file to load a clip');return;}
    const pat=S.patterns[S.editPat];
    if(S.layer===1&&pat.state==='edit'){
      pushUndo('step');
      const lane=pat.lanes[S.curPreset], cell=cellOf(lane), n=stepCells(lane);
      const t0=curCell(lane)*cell;
      const i=lane.events.findIndex(ev=>ev.midi===midi&&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
      if(i>=0)lane.events.splice(i,1);
      else{
        /* A CHORD IS SOMETHING YOU HOLD. Typing three notes in a row at one
           step used to build a stack you never asked for — you were trying
           each one in turn. So: nothing else down, this note replaces the
           cell; something else already held, it joins it. */
        if(!wasHeld.size)lane.clear(ev=>ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
        lane.events.push({t:t0,midi,vel:hitVel,dur:cell,born:performance.now()});
        lane.auto=false;
        engine.trigger(AC.currentTime+0.005,pi,midi,0.9,cell*spb());
      }
      dirty=true; dirtySave=true; return;
    }
    let at=AC.currentTime+0.005;
    const lane=(S.layer===1?pat:S.patterns[S.editPat]).lanes[pi];
    const recording=S.layer>=1&&pat.state==='rec'&&T.playing;   // record into the channel's lane from sound layer too
    /* overwrite mode, playing live but NOT recording: your live notes still
       silence the recorded lane underneath — same feel as recording, minus the write */
    if(S.layer===1&&!recording&&(CFG.overdub||0)===0&&T.playing){
      liveMute[pi]++; engine.chokeSeq(pi); nlive[c]=pi;
    }
    const patEmpty=pat.lanes.every(l=>!l.events.length);
    {
      if(recording&&patEmpty&&!lane._cap){
        T.startTime=at; T.startBeat=0; T.schedBeat=0;
        acts=[{pat:S.editPat,start:-1e9,anchor:0}];
        if(lane.auto&&CFG.listen){startCapture(lane,0);flash('● the ONE is set — listening…');}
        else if(lane.auto){lane.unit='B';lane.count=DEFLENS[CFG.defLen];lane.auto=false;
          flash('● the ONE is set — '+lane.count+' bar loop');}
        else flash('● the ONE is set');
        pend[c]={t0:0,sweep:0,ts:0,bornAt:performance.now(),lane:pi,qt:0,midi,vel:hitVel};
      }else{
        /* live quantize applies whenever it's on — stopped or playing, rec or not */
        /* live quantize applies whenever it's on — stopped or playing, rec or not */
        const t0=gridNow();
        const q=qnext(t0,gridOf(lane));               // → the NEXT grid point, never earlier
        let tr=CFG.qOn?t0+(q-t0)*(lane.qlive??1):t0;
        if(recording&&S.hum)tr+=(Math.random()*2-1)*S.hum*0.12;
        if(tr<t0)tr=t0;
        /* monitor exactly where playback will put it: groove included, full
           strength — playback applies the same groove to the stored note */
        /* q+m picks which of these you hear: the grid point, or your finger */
        const heard=CFG.qMon===0?t0:tr+grooveOff(pi,tr);
        at=Math.max(at,gridTime(heard));
        /* THE NOTE ON IS QUANTIZED; THE NOTE OFF MUST BE TOO. The key-up fires
           in real time, so a tap shorter than the quantize delay released a note
           that had not begun — and release() clamps to startAt+5ms, which is a
           25ms stub of a snare. THAT is the choke, and it had nothing to do with
           mono: it hit every fast note with Q on and no note with Q off, which
           is exactly the shape of the complaint.
           Remember where this one starts and when the key went down, so the
           key-up can carry the length you held across the quantize: a 40ms tap
           is a 40ms note wherever on the grid it lands. */
        livePress[c]={start:at,press:AC.currentTime};
        if(S.layer>=1)rPend[c]={pi,ts:tr,midi,vel:hitVel};   // retro memory hears everything
        /* an active arp generates the notes — record ITS output (recPlayNote), not the held note */
        const plyOf=isKit(S.presets[pi])?(kitSlot(S.presets[pi],midi)||{ply:[]}).ply:S.presets[pi].ply;
        const arpOn=T.playing&&plyOf.some(sl=>(sl.typ===2||sl.typ===1||sl.typ===13)&&!sl.off&&Math.round(sl.p6||0)===1);
        if(recording&&arpOn&&lane.auto&&!lane._cap&&!lane.events.length){   // arp: still start the listen window
          if(CFG.listen)startCapture(lane,tr);
          else{lane.unit='B';lane.count=DEFLENS[CFG.defLen];lane.auto=false;}
        }
        if(recording&&!arpOn){
          if(lane.auto&&!lane._cap&&!lane.events.length){
            if(CFG.listen)startCapture(lane,tr);
            else{lane.unit='B';lane.count=DEFLENS[CFG.defLen];lane.auto=false;}
          }
          const qt=lane._cap?Math.max(0,tr-lane._cap.t0):fmod(tr-editAnchor(),lane.len);
          // qt stored straight (groove is a playback layer); ts = where it actually sounds
          pend[c]={t0,sweep:t0,ts:heard,bornAt:performance.now(),lane:pi,qt,midi,vel:hitVel};
        }
      }
    }
    liveV[c]=engine.trigger(at,pi,midi,hitVel);
    if(S.layer>=2)S.prepFocus=engine.lastMidi[pi];   // last played note = per-note focus (any channel)
    dirty=true; return;
  }
};
document.addEventListener('keydown',onKeyDown);



let djHeld={},djLatch={},djAuto={},djRecStart={};
function djPress(k,shift){        // shared pad logic: tap on a latched pad unlatches it
  if(shift){if(djLatch[k])delete djLatch[k];else djLatch[k]=1;}
  else if(djLatch[k])delete djLatch[k];
  else djHeld[k]=1;
  djApply();
}
function djApply(silent){
  const keys=[...new Set([...Object.keys(djLatch),...Object.keys(djHeld),...Object.keys(djAuto)])].map(Number);
  engine.setDj(keys);
  if(!silent)flash(keys.length?'DJ: '+keys.map(djName).join(' + ')
    +(Object.keys(djLatch).length?'  [latched: '+Object.keys(djLatch).map(k=>DJKEYS[k]).join(' ')+']':'')
    :'DJ off');
  dirty=true;
}
/* Everything that happens when a note stops: write its length into the lane,
   give the recorded lane back its voice, and release what you are hearing.
   Pulled out of the keyup because a LATCHED note stops later than its key
   does, and both paths have to do exactly the same thing. */
function endNote(c){
  SUS.delete(c); noteLatch.delete(c);
  let relAt=AC.currentTime+0.005;
  /* HOW LONG YOU HELD IT, not how long ago the grid point was. Live quantize
     delays the attack; without the same delay on the release a fast tap asked a
     note to stop before it had started, and it came out as a stub. */
  const lp=livePress[c]; delete livePress[c];
  const heldSec=lp?Math.max(0.02,AC.currentTime-lp.press):0;
  if(lp)relAt=Math.max(relAt,lp.start+heldSec);
  if(pend[c]){
    const p=pend[c], lane=S.patterns[S.editPat].lanes[p.lane];
    spanUnmark(lane);                 // the hold is over; nothing ahead of it was covered
    /* length is the length you HELD the key. Measuring it from the quantized
       start instead docked every note by however far the quantize had moved it. */
    const relG=T.playing?gridNow():p.ts+0.25;
    const dur=lp?Math.max(0.05,heldSec/spb()):Math.max(0.05,relG-p.ts);
    lane.clear(ev=>ev.midi===p.midi&&Math.abs(ev.t-p.qt)<1e-6);
    lane.events.push({t:p.qt,midi:p.midi,vel:p.vel??0.9,dur,born:performance.now()});
    if(lane._cap)lane._cap.lastEnd=Math.max(lane._cap.lastEnd,p.qt+dur);
    relAt=Math.max(relAt,gridTime(p.ts+dur));   // hold the monitored note to that same length
    delete pend[c]; dirty=true; dirtySave=true;
  }
  if(nlive[c]!=null){liveMute[nlive[c]]=Math.max(0,liveMute[nlive[c]]-1);delete nlive[c];}
  if(liveV[c]){liveV[c]&&liveV[c].release&&liveV[c].release(relAt);delete liveV[c];}
}

/* ---------------- persistence + migration ---------------------------- */
const LS='ten-v1';
const SAVEV=21;                       // bump BOTH: serialize writes it, load checks it
/* WHAT A SAVE SAYS vs WHAT THE RUNTIME USES.
   In memory a waveform is an index into WAVES, because every read site is then
   an array lookup and some of them are warm. In the FILE it is the word "saw",
   because an index is a pointer into a list — and reordering that list silently
   re-aimed every preset pointing past the change. That is exactly how sorting
   the division lists turned every saved 1/16 arp into a 1/4T.
   So the conversion lives at the boundary, in these two functions, rather than
   in five hundred read sites. A name survives reordering and insertion; a beat
   value survives renaming too, which is why divisions are stored as the number
   of beats rather than as "1/16". Anything the tables below do not name is
   written through untouched. */
const PORT_ENUM={osc:{wav:()=>WAVES}, flt:{typ:()=>FTYPES}, fx:{typ:()=>XTYPES},
                 ply:{typ:()=>PTYPES}, mod:{src:()=>MSRC, wav:()=>LFOW}};
const PORT_FLAT={vox:{mode:()=>MODE}};
/* divisions: the number of beats, and which key holds one depends on what the
   slot IS — p1 is a rate on an arp and something else entirely on a chord */
const PORT_DIV={
  mod:{rdiv:()=>LFODIV.map(d=>d[1])},
  /* reads typ in EITHER form on purpose: the enum pass in conv() runs first
     and has already turned 2 into 'arp' by the time this is asked, so testing
     only the number silently declined to convert every arp rate ever saved */
  ply:{p1:sl=>{const t=sl.typ;
    const i=typeof t==='string'?PTYPES.indexOf(t):Math.round(t||0);
    return i===PTYPES.indexOf('arp')?ARPDIVB:null;}},
};
function portPreset(p,out){
  if(!p)return p;
  const q=JSON.parse(JSON.stringify(p));
  const conv=(sl,tbl,div)=>{
    for(const k in (tbl||{})){
      const list=tbl[k](sl); if(!list)continue;
      const v=sl[k];
      if(out){ if(typeof v==='number')sl[k]=list[clamp(Math.round(v),0,list.length-1)]; }
      else if(typeof v==='string'){const i=list.indexOf(v); if(i>=0)sl[k]=i;}
    }
    for(const k in (div||{})){
      const list=div[k](sl); if(!list)continue;
      const v=sl[k];
      if(out){ if(typeof v==='number')sl[k]={b:list[clamp(Math.round(v),0,list.length-1)]}; }
      else if(v&&typeof v==='object'&&typeof v.b==='number'){
        /* nearest beat value, so a division that no longer exists lands on the
           closest one that does rather than on entry zero */
        let bi=0,bd=Infinity;
        list.forEach((x,i)=>{const d=Math.abs(x-v.b); if(d<bd){bd=d;bi=i;}});
        sl[k]=bi;
      }
    }
  };
  for(const rid in PORT_ENUM)for(const sl of (q[rid]||[]))if(sl)conv(sl,PORT_ENUM[rid],PORT_DIV[rid]);
  for(const rid in PORT_DIV)if(!PORT_ENUM[rid])for(const sl of (q[rid]||[]))if(sl)conv(sl,null,PORT_DIV[rid]);
  for(const rid in PORT_FLAT)if(q[rid])conv(q[rid],PORT_FLAT[rid],null);
  if(Array.isArray(q.kit))q.kit=q.kit.map(k=>k?portPreset(k,out):null);
  return q;
}
function serialize(){return JSON.stringify({v:SAVEV,bpm:T.bpm,metro:S.metro,hum:S.hum,grv:S.grv,oct:S.oct,master:S.master,dj:S.dj,arrOn:S.arrOn!==false,
  clips:S.clips,scenes:S.scenes,clipAt:S.clipAt,sceneAt:S.sceneAt,
  arr:S.arr,
  patterns:S.patterns.map(p=>({state:p.state==='edit'?'on':p.state,sw:p.sw||0,lanes:p.lanes})),

  if(sp.ops)sp.ops.forEach((op,j)=>{if(op)Object.assign(p.osc[j],op,{ph:0});});
  else if(sp.osc&&sp.osc.type!==undefined)p.osc[0].wav=sp.osc.type;
  p.osc[0].rat=(p.osc[0].rat||1)*Math.pow(2,oct);

  if(sp.flt)p.flt[0]={typ:[1,2,3][sp.flt.type]||1,frq:sp.flt.cut,q:sp.flt.res,gn:0};

  const n=chans[0].length, nc=chans.length, bytes=44+n*nc*2;

  const str=(o,s2)=>{for(let i=0;i<s2.length;i++)v.setUint8(o+i,s2.charCodeAt(i));};
  str(0,'RIFF'); v.setUint32(4,bytes-8,true); str(8,'WAVE');
  str(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,nc,true); v.setUint32(24,rate,true);
  v.setUint32(28,rate*nc*2,true); v.setUint16(32,nc*2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40,n*nc*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<nc;c++){
    const x=Math.max(-1,Math.min(1,chans[c][i]));

  sp.onaudioprocess=e=>{ if(!on)return;
    L.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    R.push(new Float32Array(e.inputBuffer.getChannelData(1)));};

  node.connect(sp); sp.connect(sink); sink.connect(AC.destination);
  return {stop(){on=false; try{node.disconnect(sp);}catch(_){} try{sp.disconnect();sink.disconnect();}catch(_){}
      const flat=a=>{const n=a.reduce((s2,x)=>s2+x.length,0), o=new Float32Array(n);

      return [flat(L),flat(R)];}};

     was decided by what used to be in it. Keeping a 4-bar loop after wiping
     the 4 bars leaves you playing into a shape you can no longer see the
     reason for — so the length goes back to listening along with the notes. */
  initLane(l);
  if(retroBuf[pi])retroBuf[pi]=[];
  flash(pi===0?'master timeline cleared'
             :'ch '+pi+CLIPKEYS[(S.clipAt||{})[pi]??0]+' cleared — back to 1 bar, listening');
  dirty=true; dirtySave=true;
}
/* the first free slot in the rack you are on, or null if it is full */
const freeSlotHere=pre=>{const M=MODULES[S.curMod];
  if(!M||!M.slot)return null;
  const rack=modHolder(pre,M.id)[M.id]||[];
  const si=rack.findIndex(sl=>M.abbr(sl)==='···');
  return si<0?null:si;};
function chipIndex(chips){
  const i=chips.findIndex(c=>c.mi===S.curMod&&(c.si===S.curSlot||c.si===-1));
  return i<0?0:i;
}
function gotoChip(c){ if(!c)return; S.curMod=c.mi; if(c.si>=0)S.curSlot=c.si; S.slotParam=0; }
/* one label row over one row of cells — the shape a param row already uses */
/* Every rack gets the SAME share of the row, and its open slots split that
   share evenly. So a rack's position never moves as you add to it — only the
   cells inside get narrower — and the widest a rack ever has to be is however
   many slots it can hold at one letter each. Labels grow with the cell. */
function chainRow(L,pre,groups){
  const RW=Math.max(10,Math.floor(92/groups.length));
  let lab='   ', cells='   ';
  for(const g of groups){
    const all=g.items, n=Math.max(1,all.length);
    const cw=Math.max(1,Math.floor(RW/n));
    const lit=cw>=3?cw-1:cw;                 // keep a gap once there is room for one
    lab+=sp('d',pad(' '+g.sec.n,RW));
    let used=0;
    for(const c of all){
      const on=c.mi===S.curMod&&(c.si===S.curSlot||c.si===-1);
      cells+=spH(on?'i':(c.empty||c.off?'d k':'v k'),ctrIn(c.label,lit),'mod',c.mi)
            +' '.repeat(cw-lit);
      used+=cw;
    }
    cells+=' '.repeat(Math.max(0,RW-used));
  }
  L.push(lab); L.push(cells);
}
function rackStrip(L,rackA,M){
  let tabs='  ';
  rackA.forEach((sl,i)=>{
    const ab=M.abbr(sl), sh=ab.length>7?ab.slice(0,7):ab;
    const lbl=` ${(i+1)%10}${sl.off?'×':''}${sh} `;
    tabs+=(i===S.curSlot?spH('i',lbl,'sl',i):(sl.off?spH('d',lbl,'sl',i)
      :ab!=='···'?spH('a',lbl,'sl',i):spH('d',lbl,'sl',i)));
  });
  L.push(tabs);
}
/* ONE row of params. Wrapping at five put the sixth parameter on a line of its
   own below the values of the first five, which read as a second slot. Squeeze
   the column instead — the whole rack is one horizontal move again. */
/* WHAT IS ALREADY ACTING ON THIS KNOB. A dot means automation is recorded on
   it; a tilde means something in the mod rack is pointed at it. Without these
   the only way to find out was to turn it and wonder why it sprang back. */
function paramMarks(pre,mi,si,spec){
  const M=MODULES[mi]; if(!M||!M.id||M.prs||!spec)return '';
  const a={rack:M.id,slot:M.flat?0:si,key:spec.key,lbl:spec.lbl};
  if(!M.flat){const rk=(modHolder(pre,M.id)||{})[M.id];
    if(rk&&rk[si]&&rk[si].id!=null)a.sid=rk[si].id;}
  let m='';
  const ml=pre.modLoop;
  if(ml&&ml.events.length&&ml.events.some(ev=>sameAddr(evAddr(pre,ev),a)))m+='\u00b7';
  const hit=rt=>{ const b=rt&&rt.addr; if(!b)return false;
    if(b.rack!==a.rack||b.key!==a.key||b.lbl!==a.lbl)return false;
    return b.slot==='*'||sameAddr(b,a); };     // the wildcard aims at every slot
  if((pre.mod||[]).some(md=>md&&md.src&&!md.off&&(md.routes||[]).some(hit)))m+='~';
  return m;
}
function rackParams(L,pre,specs){
  /* '+' is the last cell of the param row: reaching the end of what this slot
     has and pressing on is how you get another one. It is not a button parked
     somewhere else — it is the next thing to the right. */
  const free=freeSlotHere(pre);
  const extra=free!=null?1:0;
  S.slotParam=clamp(S.slotParam|0,0,Math.max(0,specs.length-1+extra));
  /* CELLS ARE NOT ALL THE SAME SIZE ANY MORE. Every column was one tenth of
     the row, which is fine for '5.0Hz' and hopeless for an address — a
     destination reading `fx1·color` had nowhere to be. A spec can ask for more
     with `w`, and the rest share what is left. */
  const wts=specs.map(sp=>sp.w||1); if(extra)wts.push(1);
  const tot=wts.reduce((a,b)=>a+b,0)||1;
  const unit=clamp(Math.floor(88/tot),6,11);
  const wAt=i=>clamp(unit*(wts[i]||1)-1,5,26);
  const w=wAt(wts.length-1);
  let lr='   ', vr='   ';
  specs.forEach((pspec,i)=>{
    const foc=i===S.slotParam, cw=wAt(i);
    const pd=prepDisp(pre,S.curMod,S.curSlot,pspec);
    const v=(pd.dot?'•':'')+fmtVal(pspec,pd.v);
    const mk=paramMarks(pre,S.curMod,S.curSlot,pspec);
    const lbl=pad(pspec.lbl+(mk?' '+mk:''),cw);
    lr+=(foc?spH('a',' '+lbl,'slot',i):spH('d',' '+lbl,'slot',i))+' ';
    vr+=(foc?spH('i',' '+pad(v,cw),'slot',i)
           :(pd.dot?spH('r k',' '+pad(v,cw),'slot',i):spH('v k',' '+pad(v,cw),'slot',i)))+' ';
  });
  if(extra){
    const i=specs.length, foc=i===S.slotParam;
    lr+=sp('d',' '+pad('new',w))+' ';
    vr+=spH(foc?'i':'d k',' '+pad('+',w),'slot',i)+' ';
  }
  L.push(lr); L.push(vr);
}
/* Turn the '+' into a real slot: the first free one in this rack, selected,
   with the cursor on its type so the next keypress says what it becomes. */
function openSlotHere(){
  const pre=S.presets[S.editSnd], M=MODULES[S.curMod];
  const si=freeSlotHere(pre);
  if(si==null){flash('rack is full');return false;}
  pushUndo('new slot');
  /* an operator you asked for is one you want to hear */
  if(M.id==='osc'){const o=modHolder(pre,'osc').osc[si]; if(o&&o.amt<=0.001)o.amt=1;}
  /* AFTER the slot you are on, not at the end of the rack. A chain is an order
     and you were pointing at where you wanted the new thing — shuffling the
     empties up leaves everything live exactly where it was. */
  const rack=modHolder(pre,M.id)[M.id];
  const want=Math.min(S.curSlot+1,rack.length-1);
  if(si>want){const moved=rack.splice(si,1)[0]; rack.splice(want,0,moved);}
  S.curSlot=si>want?want:si; S.slotParam=0;
  engine.rebuildRack(S.editSnd);
  flash('new '+MODULES[S.curMod].name.toLowerCase()+' slot — ↑↓ picks what it is');
  dirty=true; dirtySave=true; return true;
}
/* ...and the mirror of it. A rack is a CHAIN, so removing link three means
   four becomes three — the empty goes to the back where the '+' will find it
   again, rather than sitting in the middle as a hole you have to step over. */
function removeSlotHere(){
  if(S.mSel&&S.layer>=2){
    const i=S.mSlot||0, sl=S.master[i];
    if(!sl||!sl.typ){flash('that insert is already empty');return false;}
    pushUndo('remove master slot');
    S.master.splice(i,1);
    S.master.push({typ:0,rt:0,p1:0.3,p2:0.3,p3:0.5,mix:0.3});
    S.mSlot=clamp(i,0,S.master.length-1); S.mParam=0;
    engine.rebuildMaster();
    flash('master insert removed'); dirty=true; dirtySave=true; return true;
  }
  const pre=S.presets[S.editSnd], M=MODULES[S.curMod];
  if(!M||!M.slot){flash('nothing to remove here');return false;}
  const rack=modHolder(pre,M.id)[M.id];
  const sl=rack[S.curSlot];
  if(!sl||M.abbr(sl)==='···'){flash('that slot is already empty');return false;}
  pushUndo('remove slot');
  const mk=RACK_MK[M.id];
  rack.splice(S.curSlot,1);
  /* mkOsc(i) gives the ROOT operator a level of 1 and every other slot 0 —
     calling it with no index made the blank we push back a full-volume sine.
     So removing an OSC slot removed one and added an audible one: the rack
     looked like it lost two, and the "live slot" scan that moves the cursor
     counted the new sine as occupied. Every other rack was fine because
     nothing else has an index-dependent default. */
  rack.push(mk?mk(rack.length):{});
  /* LAND SOMEWHERE REAL. Clamping to the array length left the cursor on the
     empty that had shuffled up into the gap — you deleted a slot and arrived
     at nothing. Take the one that closed the gap, or the one before it, and if
     the rack is empty now, step back to the previous rack that has anything. */
  /* LAND ON THE ONE TO THE LEFT. Taking a slot out of a chain, the thing you
     were working on is what came before it — that is where the signal is
     coming from and where you are most likely to look next. */
  const live=rack.map((x,k)=>M.abbr(x)!=='···'?k:-1).filter(k=>k>=0);
  if(live.length){
    const before=[...live].reverse().find(k=>k<S.curSlot);
    S.curSlot=before!==undefined?before:live[0];
  }else{
    const pre2=S.presets[S.editSnd];
    let mi=S.curMod, g=0;
    do{ mi=fmod(mi-1,MODULES.length); g++; }
    while(g<MODULES.length&&(()=>{const M2=MODULES[mi];
      if(!M2.id||M2.prs)return true;
      if(!M2.slot)return false;
      return !modHolder(pre2,M2.id)[M2.id].some(x=>M2.abbr(x)!=='···');})());
    S.curMod=mi; S.curSlot=0;
    const M3=MODULES[mi];
    if(M3&&M3.slot){
      const r3=modHolder(pre2,M3.id)[M3.id];
      const l3=r3.map((x,k)=>M3.abbr(x)!=='···'?k:-1).filter(k=>k>=0);
      if(l3.length)S.curSlot=l3[l3.length-1];
    }
  }
  S.slotParam=0;
  engine.rebuildRack(S.editSnd);
  flash(M.name.toLowerCase()+' slot removed');
  dirty=true; dirtySave=true; return true;
}
/* '+' from anywhere in a rack, not only from the cell marked '+'. The master
   keeps its own slot list, so it gets the same key through its own door. */
function addSlotHere(){
  if(S.mSel&&S.layer>=2){
    const free=S.master.findIndex(x=>!x.typ);
    if(free<0){flash('master rack is full');return false;}
    pushUndo('master slot'); S.mSlot=free; S.mParam=0;
    flash('new master insert — ↑↓ picks what it is');
    dirty=true; dirtySave=true; return true;
  }
  const M=MODULES[S.curMod];

function gridRow(lp,cell,phCell,charFor,cur=-1,hit){
  const n=Math.ceil(lp.len/cell-1e-9);
  let out='';
  for(let i=0;i<n;i++){
    const ch=charFor(i*cell,(i+1)*cell);
    out+=hit?( (i===cur)?spH('i',ch,hit,i):(i===phCell)?spH('ai',ch,hit,i):spH('g',ch,hit,i) )
           :((i===cur)?sp('i',ch):(i===phCell)?sp('ai',ch):ch);
    if(cell<1&&i%4===3&&i<n-1)out+=sp('d','│');
    else if(cell>=1&&(i+1)*cell%4===0&&i<n-1)out+=sp('d','│');
  }
  return out;
}
