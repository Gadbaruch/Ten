  }
  if(f==='engine'){
    /* Sampler and Grain are listed so the shape of the thing is visible, but
       cycling steps OVER them — landing on an engine that does nothing is a
       worse experience than not seeing it yet. */
    const cur=Math.max(0,ENGINES.findIndex(e=>e.k===engineOf(p)));
    let i=cur, guard=0;
    do{ i=fmod(i+(d<0?-1:1),ENGINES.length); guard++; }
    while(ENGINES[i].soon&&guard<ENGINES.length);
    const e2=ENGINES[i];
    if(e2.soon){flash(e2.n+' — coming next');dirty=true;return;}
    pushUndo('engine');
    if(setEngine(pi,e2.k)){
      S.curParam=0;
      flash('engine: '+e2.n+(e2.k==='synth'?' · '+(p.cat||'misc'):
            e2.k==='proc'?' · '+(p.pmodel||''):''));
    }
    dirty=true; dirtySave=true; return;
  }
  if(f==='ainfo'||f==='kinfo'){dirty=true;return;}
  if(f==='model'){
    const i=PROCNAMES.indexOf(p.pmodel||PROCNAMES[0]);
    p.pmodel=PROCNAMES[fmod((i<0?0:i)+d,PROCNAMES.length)];
    p.name=p.pmodel.slice(0,5).toUpperCase();
    p.psel=0;
    const L0=procPresets(p.pmodel);
    if(L0.length)applyProcPreset(pi,L0[0]); else {p.cp=[1,1,1,0.5,0.4,0,0.5,0.2];procDefaults(p);}
    engine.codeNode(pi); engine.rebuildRack(pi); engine.codeCfg(pi);
    flash('⚙ '+p.pmodel+'  ('+(PROCLIB[p.pmodel]||{}).fam+')');
    dirty=true; dirtySave=true; return;
  }
  if(f==='preset'){
    const L=procPresets(p.pmodel||PROCNAMES[0]);
    if(!L.length){flash('no presets for '+(p.pmodel||'?'));dirty=true;return;}
    pushUndo('proc preset');
    p.psel=fmod((p.psel|0)+d,L.length);
    applyProcPreset(pi,L[p.psel]);
    flash('⚙ '+(p.pmodel)+' · '+L[p.psel].n);
    dirty=true; dirtySave=true; return;
  }
  if(f==='prst')scrollPreset(pi,d);
  else if(f==='type'){
    const i0=Math.max(0,SYNTHCATS.indexOf(p.cat||'misc'));
    const cat=SYNTHCATS[fmod(i0+d,SYNTHCATS.length)];
    const pool=libAll().filter(en=>en.cat===cat);
    if(pool.length)applyPresetData(pi,pool[0].name,pool[0].cat,pool[0].data);
    else p.cat=cat;
    p._scat=cat;
    flash('sound type: '+cat+(pool.length?' → '+pool[0].name:''));
    dirtySave=true;}
  else if(f==='save')saveToLib(pi);
  else if(f==='wild'){
    CFG.wild=clamp((CFG.wild??35)+d*5,0,100); saveCfg();
    flash('rnd wildness '+CFG.wild+'% — low = tame/typical, high = more slots & motion');}
  else if(f==='rnd')randomizeChannel(pi);
  /* Anything unmatched used to fall into randomizeChannel and reroll the whole
     channel. A field key renamed in one place and not the other would have
     destroyed the user's sound rather than doing nothing — say so instead. */
  else flash('unhandled PRST field: '+f);
  dirty=true;
}

/* A rack whose params render as one inline row: PRST, the flat modules, and OSC
   on proc/audio channels (which show their own field list). Everything else is
   a slot rack, and a slot rack is addressed the same way on EVERY layer. */
function flatView(mi){
  const M=MODULES[mi];
  if(!M||!M.id||M.prs||M.flat)return true;
  /* OSC on a proc/audio channel shows its own field list INSTEAD of the
     operator rack — but only in the channel view. The rack view always draws
     the real ten operators, so answering 'flat' there pointed the edit at the
     code cursor while the highlight followed the slot cursor: arrows moved the
     ▸ and ↑ rewrote whatever index the code cursor happened to hold, usually
     0, which is the waveform enum. */
  return S.layer!==3&&M.id==='osc'&&(isCodeCh(S.editSnd)||isAudioCh(S.editSnd));
}
/* True when the OSC view on screen is the code/audio field list rather than the
   operator rack. Those fields are edited by codeAction/audAction against their
   OWN spec lists, so anything that resolves a param against OSC_P must refuse
   here rather than write an operator nobody can see. */
const oscFieldView=mi=>MODULES[mi]&&MODULES[mi].id==='osc'&&S.layer!==3&&
  (isCodeCh(S.editSnd)||isAudioCh(S.editSnd));
/* Resolved (mi,si,px) for the focused parameter. This used to fork on
   S.layer===3, which meant layer 2 addressed slot racks with S.curParam — a
   cursor the layer-2 navigation pinned to 0. Param 0 of every slot rack is its
   TYPE enum, so editing from layer 2 did not nudge a value, it rewrote the
   slot and stamped p:0 into any automation being recorded. One cursor now:
   slot racks are S.slotParam wherever you are. */
function curAddr(){
  const M=MODULES[S.curMod];
  if(flatView(S.curMod))return [S.curMod,M&&M.flat?-1:S.curSlot,S.curParam];
  const pre=S.presets[S.editSnd], hold=modHolder(pre,M.id);
  const n=paramsFor(S.curMod,hold[M.id][S.curSlot]).length;
  /* clamp here, not just in the render: a kit pad swap or a slot type change
     shortens the spec list under a live cursor. One PAST the end is legal when
     the rack has room — that index is the '+', and clamping it away is what
     made the cell reachable but not pressable. */
  const extra=freeSlotHere(pre)!=null?1:0;
  S.slotParam=clamp(S.slotParam|0,0,Math.max(0,n-1+extra));
  return [S.curMod,S.curSlot,S.slotParam];
}
/* shift+↑↓ = per-note tweak: the change applies ONLY to the last-played note.
   Works on any channel, any module — no play slot or type needed. */
function prepTweak(d,m){
  const pre=S.presets[S.editSnd];
  if(S.prepFocus==null){flash('play a note first — shift-tweaks land on that note only');return;}
  const [mi,si,px]=curAddr(); const M=MODULES[mi];
  if(!M.id||M.prs){flash('focus a channel parameter');return;}
  if(oscFieldView(mi)){flash('code params cannot be prepped per note');return;}
  const slot=M.flat?null:modHolder(pre,M.id)[M.id][si];
  const specs=paramsFor(mi,slot), spec=specs[px]; if(!spec)return;
  pushUndo('prep');
  pre.prep=pre.prep||{notes:{}};
  const node=pre.prep.notes[S.prepFocus]=pre.prep.notes[S.prepFocus]||{};
  node.k=node.k||{};
  const key=M.id+':'+(M.flat?'-':si)+':'+spec.key;
  const eff=prepEffective(pre,S.prepFocus);
  const base=node.k[key]!==undefined?node.k[key]:getV(eff,mi,si,spec);
  node.k[key]=adjust(spec,base,d,m);
  flash('◆ '+NN[S.prepFocus%12]+(Math.floor(S.prepFocus/12)-1)+' only · '+spec.lbl+' = '+fmtVal(spec,node.k[key]));
  dirty=true; dirtySave=true;
}
/* ⌫ on a param = the value it was born with. Every spec already knows its own
   default through basePreset, so this asks a fresh one rather than keeping a
   second table of defaults that could drift from the first. */
function resetParam(){
  const [mi,si,px]=curAddr(); const M=MODULES[mi];
  if(!M.id)return false;
  const pre=S.presets[S.editSnd], holder=modHolder(pre,M.id);
  const slot=M.flat?null:holder[M.id][si];
  const spec=paramsFor(mi,slot)[px]; if(!spec)return false;
  pushUndo('param init');
  const virgin=basePreset('x');
  const src=M.flat?virgin[M.id]:(virgin[M.id]||[])[si]||{};
  const v=spec.get?spec.get(src):src[spec.key];
  if(v===undefined)return false;
  if(spec.set)spec.set(M.flat?holder[M.id]:slot,v); else (M.flat?holder[M.id]:slot)[spec.key]=v;
  engine.rebuildRack(S.editSnd); engine.refresh(S.editSnd);
  flash(spec.lbl+' → '+fmtVal(spec,v));
  dirty=true; dirtySave=true; return true;
}
function adjustParam(d,m){
  const [mi,si,px]=curAddr(); const M=MODULES[mi];
  if(!M.id){flash('reserved');return;}
  const pre=S.presets[S.editSnd], holder=modHolder(pre,M.id);
  const slot=M.flat?null:holder[M.id][si];
  const specs=paramsFor(mi,slot), spec=specs[px];
  if(!spec){ if(px>=specs.length)openSlotHere(); return; }   // past the end = the '+'
  pushUndo('tweak');
  const ml=pre.modLoop;
  if(ml.state==='edit'&&S.layer>=2&&holder===pre){   // mod-loop records channel params only
    const cell=cellOf(ml), t0=curCell(ml)*cell;
    const a0=autoAddr(pre,mi,si,px);
    let pt=ml.events.find(ev=>sameAddr(evAddr(pre,ev),a0)&&ev.t>=t0-1e-9&&ev.t<t0+cell-1e-9);
    if(!pt){pt={t:t0,a:a0,m:mi,s:si,p:px,v:getV(pre,mi,si,spec)};ml.events.push(pt);}
    pt.v=adjust(spec,pt.v,d,m);
    applyParam(S.editSnd,mi,si,px,pt.v);
  }else{
    const nv=adjust(spec,getV(holder,mi,si,spec),d,m);
    writeParam(S.editSnd,mi,si,px,nv);
    if(holder===pre)recAuto(S.editSnd,pre,mi,si,px,nv);
  }
  dirty=true;
}
function resetParam(){
  const [mi,si,px]=curAddr(); const M=MODULES[mi];
  if(!M.id)return;
  /* PRST is not a rack — presets have no `prs` key, so resolving a slot here
     threw. The layer-2 guard used to catch it by accident; now it is explicit. */
  if(M.prs)return;
  if(oscFieldView(mi)){flash('code params: ←→ then ↑↓ · ⌫ resets rack params only');return true;}
  const pre=S.presets[S.editSnd];
  if(S.prepFocus!=null&&pre.prep&&pre.prep.notes&&pre.prep.notes[S.prepFocus]){
    const slot0=M.flat?null:modHolder(pre,M.id)[M.id][si];
    const specs0=paramsFor(mi,slot0), spec0=specs0[px];
    const key=M.id+':'+(M.flat?'-':si)+':'+(spec0&&spec0.key);
    const node=pre.prep.notes[S.prepFocus];
    if(node.k&&node.k[key]!==undefined){
      pushUndo('prep clear');
      delete node.k[key];
      if(!Object.keys(node.k).length&&!node.preset)delete pre.prep.notes[S.prepFocus];
      flash('prep override removed'); dirty=true; dirtySave=true; return true;
    }
  }
  const holder=modHolder(pre,M.id);
  const slot=M.flat?null:holder[M.id][si];
  const specs=paramsFor(mi,slot), spec=specs[px]; if(!spec)return;
  /* ⌫ ON A WAVE EMPTIES THE OPERATOR, the way ⌫ empties any other slot's type.
     Resetting it to "sin at full level" is not what the key means anywhere
     else in the instrument. */
  /* ⌫ ON THE TYPE EMPTIES THE SLOT, in every rack. It already did this in the
     Sound rack because an operator's "type" is its wave; everywhere else the
     same key only reset a parameter, so deleting a filter or an fx felt like
     it did nothing and the cursor had no reason to move. One key, one meaning:
     on the field that says WHAT this slot is, ⌫ means "nothing". */
  const TYPEKEY={osc:'wav',flt:'typ',fx:'typ',ply:'typ',mod:'src'};
  if(slot&&TYPEKEY[M.id]===spec.key){
    pushUndo(M.name.toLowerCase()+' slot off');
    if(M.id==='osc')slot.amt=0; else if(M.id==='mod')slot.src=0; else slot.typ=0;
    /* switching an operator off is removing it as far as the eye is concerned,
       so the cursor goes where removeSlotHere would put it — the live slot to
       the left, or the first one still making sound */
    const rk=holder[M.id];
    const live=rk.map((x,k)=>M.abbr(x)!=='···'?k:-1).filter(k=>k>=0);
    if(live.length){
      const left=[...live].reverse().find(k=>k<si);
      S.curSlot=left!==undefined?left:live[0];
    }
    S.slotParam=0;
    engine.rebuildRack(S.editSnd);
    /* TRUE, not a bare return. The caller is `if(...&&resetParam())return;` —
       an undefined result reads as "nothing handled", so it fell through to the
       branches below and deleted a SECOND operator. One key, two slots gone. */
    if(M.id==='fx'||M.id==='flt')engine.rebuildRack(S.editSnd);
    flash(M.name.toLowerCase()+' '+((si+1)%10)+' off'); dirty=true; dirtySave=true; return true;
  }
  pushUndo('reset');
  let dv;
  if(M.flat)dv=basePreset('')[M.id][spec.key];
  else{
    /* MOD's dest/slot#/amt/center live inside routes[] and are reached only
       through the spec accessors, so reading the key off a fresh slot gave
       undefined and wrote it straight back. */
    const fresh=RACK_MK[M.id](si);
    dv=spec.get?spec.get(fresh):fresh[spec.key];
    if(dv===undefined)return;
  }
  writeParam(S.editSnd,mi,si,px,dv);
  /* ...and TRUE here too. Every early exit in this function returns undefined,
     which the caller reads as "not handled" — so a plain ⌫ on a param reset the
     param AND then fell into whatever the next Backspace branch does. Two
     actions on one key, everywhere, not just in the OSC rack. */
  flash(spec.lbl+' reset'); dirty=true; dirtySave=true; return true;
}

/* ---------------- edit / erase / capture helpers --------------------- */
/* TWO KEYBOARDS.
   PIANO is the old one: the home row is the white keys and the row above holds
   the black ones, so the shape of the instrument is the shape of a piano.
   FULL is every letter, three rows, bottom row lowest — one key, one note, no
   key repeating a note another key already plays. That last part is why it
   exists: on piano the same pitch class turns up under several fingers, and
   with a scale on or chords running globally you get the same note back twice.
   In full mode a row is an OCTAVE OF THE SCALE when a scale is on, and a
   chromatic run when it is off. Either way the rows stack upward. */
const NOTEKEYS_PIANO={KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,
                KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14,KeyP:15,Semicolon:16,Quote:17};
/* LETTERS ONLY, and contiguous. Twenty-six keys read bottom row first, then
   home, then top — one continuous run from low to high with nothing repeated,
   which is the whole point: on the piano map the same pitch class turns up
   under several fingers, and a scale or a global chord then hands you the same
   note twice. Punctuation is not a note in either keyboard, so it stays
   available for controls. */
const KBSEQ=['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM',
             'KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL',
             'KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP'];
function kbNote(code){
  const i=KBSEQ.indexOf(code); if(i<0)return null;
  const sc=CFG.scaleOn?SCALES[CFG.scale][1]:null;
  if(!sc)return i;                                  // chromatic, one semitone a key
  /* a scale DEGREE a key, so the run climbs the scale and never repeats a note */
  return Math.floor(i/sc.length)*12+sc[i%sc.length];
}
const kbFull=()=>(CFG.kbd??'full')!=='piano';
/* what a key is worth right now, or null if it is not a note key at all */
function noteOf(code){
  if(kbFull())return kbNote(code);
  const v=NOTEKEYS_PIANO[code];
  return v===undefined?null:v;
}
const isNoteKey=code=>noteOf(code)!=null;
/* kept for the places that want the piano map itself */
const NOTEKEYS=NOTEKEYS_PIANO;
/* which key plays a given offset — rebuilt per keyboard, because full mode
   maps a different set and the highlight has to follow */
function keyForOffset(off){
  if(!kbFull()){for(const k in NOTEKEYS_PIANO)if(NOTEKEYS_PIANO[k]===off)return k;return null;}
  for(const code of KBSEQ)if(kbNote(code)===off)return code;
  return null;
}
const KEYFOR=new Proxy({},{get:(_,k)=>keyForOffset(+k)});

/* ---------------- expressive input ------------------------------------
   Velocity and per-note pressure, from wherever they come from. The laptop
   keyboard has no sensors, so it plays at a fixed velocity you step with
   c / v (Ableton's convention — z/x already move the octave).

   A MIDI note that lands inside the current key range is played by SYNTHESISING
   its keydown, so it inherits the whole recording path — retro capture, live
   quantize, the ONE. Out-of-range notes fall back to a direct trigger.
   Pressure (poly aftertouch, channel pressure, or CC11/CC2/CC1) drives the
   `press` MOD source on that note's own voices — under MPE, where each note
   owns a channel, channel pressure is therefore genuinely per-note.        */
const EXP={
  pend:null, synth:false,          // velocity for, and a marker on, the keydown we synthesise
  midiOn:false, midiName:'', access:null,
  held:{},                         // 'ch:note' -> {code} | {h,pi}
  kvel(){return clamp(CFG.kvel??0.9,0.02,1);},
  take(){const v=this.pend; this.pend=null; return v==null?this.kvel():clamp(v,0.02,1);},
  bump(d){CFG.kvel=clamp(this.kvel()+d,0.02,1); saveCfg();
    flash('velocity '+Math.round(this.kvel()*127)); dirty=true;},

  /* off → solo (midi plays, the board's own keystrokes are ignored) → +kbd (both).
     'solo' is the one you want with a hall-effect keyboard: it types AND sends
     midi, so without it every note fires twice, at two different velocities. */
  async cycleMidi(d){
    const nx=fmod((CFG.midiIn|0)+(d<0?-1:1),3);
    CFG.midiIn=nx; saveCfg();
    if(!nx){this.midiOn=false; this.allOff(); flash('midi in off'); dirty=true; return;}
    if(!await this.connect())CFG.midiIn=0;
    else flash('midi in '+['','solo','+kbd'][nx]+': '+(this.midiName||'no inputs')
      +' — route pressure with a MOD slot: src=press');
    dirty=true;
  },
  async connect(quiet){
    if(!navigator.requestMIDIAccess){if(!quiet)flash('no Web MIDI here — use Chrome or Edge');return false;}
    try{
      if(!this.access)this.access=await navigator.requestMIDIAccess({sysex:false});
      this.midiOn=true; this.bind();
      this.access.onstatechange=()=>{if(this.midiOn)this.bind();};
      return true;
    }catch(err){if(!quiet)flash('midi blocked — '+(err&&err.message||err)); return false;}
  },
  bind(){
    const ins=[...this.access.inputs.values()];
    this.midiName=ins.map(i=>i.name).join(', ');
    for(const i of ins)i.onmidimessage=e=>{if(this.midiOn)try{this.msg(e.data);}catch(_){}};
    dirty=true;
  },
  msg(d){
    const st=d[0]&0xf0, ch=d[0]&0x0f;
    if(st===0x90&&d[2]>0)this.noteOn(ch,d[1],d[2]/127);
    else if(st===0x80||(st===0x90&&!d[2]))this.noteOff(ch,d[1]);
    else if(st===0xA0)this.pressNote(ch,d[1],d[2]/127);      // poly aftertouch
    else if(st===0xD0)this.pressChan(ch,d[1]/127);           // channel pressure (= per-note under MPE)
    else if(st===0xB0&&(d[1]===11||d[1]===2||d[1]===1))this.pressChan(ch,d[2]/127);
  },
  noteOn(ch,note,vel){
    const pi=S.layer===1?S.curPreset:S.editSnd;
    const code=KEYFOR[note-(60+S.oct*12)];
    if(code&&this.keyDown(code,vel)){         // in range: take the real key path
      this.held[ch+':'+note]={code};
      return;
    }
    const h=engine.trigger(AC.currentTime+0.005,pi,note,vel);
    if(T.playing)recPlayNote(pi,posNow(),note,vel,0.25);
    this.held[ch+':'+note]={h,pi};
  },
  noteOff(ch,note){
    const k=ch+':'+note, v=this.held[k]; if(!v)return; delete this.held[k];
    if(v.code)this.keyUp(v.code);
    else if(v.h&&v.h.release)v.h.release(AC.currentTime+0.005);
  },
  voicesOf(ch,note){
    const v=this.held[ch+':'+note]; if(!v)return null;
    const h=v.code?liveV[v.code]:v.h;
    return h&&h.voices||null;
  },
  pressNote(ch,note,x){
    const vs=this.voicesOf(ch,note); if(!vs)return;
    for(const v of vs)v.setPressure(x);
  },
  pressChan(ch,x){
    for(const k in this.held)if(+k.slice(0,k.indexOf(':'))===ch)
      this.pressNote(ch,+k.slice(k.indexOf(':')+1),x);
  },
  allOff(){for(const k in this.held){const [a,b]=k.split(':'); this.noteOff(+a,+b);}},

  /* solo = something else is playing the notes, so keystrokes must be ignored.
     For midi that is all of them. For a hall-effect board it is NOT: the laptop
     keyboard is still a keyboard and must go on working while hid is on. The
     browser cannot say which keyboard a keydown came from — but an HE keystroke
     always has an analog stroke behind it, so suppress only keys the board is
     actually touching and let everything else through. */
  solo(){return this.midiOn&&(CFG.midiIn|0)===1;},
  muted(code){return this.solo()||HE.owns(code);},
  /* key-level entry points shared by hid and by in-range midi notes */
  keyDown(code,vel){
    if(liveV[code]||S.layer<1)return false;
    this.pend=vel; this.synth=true;
    try{document.dispatchEvent(new KeyboardEvent('keydown',{code,key:code,bubbles:true}));}
    finally{this.synth=false; this.pend=null;}
    return true;
  },
  keyUp(code){
    this.synth=true;
    try{document.dispatchEvent(new KeyboardEvent('keyup',{code,key:code,bubbles:true}));}
    finally{this.synth=false;}
  },
  keyPress(code,x){
    const h=liveV[code];
    if(h&&h.voices)for(const v of h.voices)v.setPressure(x);
  },
};
/* ---------------- hall-effect keyboards over WebHID ---------------------
   The board's analog stream is the only trigger — we never look at its
   keystrokes (those are typing, and arrive at the actuation point with too
   little of the stroke measured to get a velocity from). A note fires when
   travel crosses a SOFTWARE threshold, so set actuation deep (2-3mm) or park
   the playing keys on a layer with no keycode and the board stops spraying
   text; velocity is unaffected either way.

   Velocity = the steepest single frame of the downstroke. A hard hit is over
   in one or two frames at 250Hz, so anything that needs a multi-ms ramp
   measures a key that already stopped moving. Peak slope degrades gracefully:
   a one-frame slam still yields a finite, monotonic number.

   Two transports, same estimator on normalised travel + timestamps:
     · analogsense — Keychron raw-HID matrix, request/response (0xA9 0x31)
     · rongyuan    — MonsGeek FUN60 / Attack Shark, event-driven push (0x1B)
   Neither is verified against hardware here. `hid dump` prints raw reports
   and `hid probe` names the slot a held key moves, for debugging on the day. */
/* slope ends in travel-per-ms, read off the report's captures at ~250Hz: a soft
   tap moves 0.03-0.06 of travel per frame (0.0075-0.015/ms), a slam goes rest to
   bottomed inside one frame (~0.25/ms). Starting too high pins soft playing on
   the floor; `auto` refines both ends as you play. */
/* These are the numbers the sibling MIDI tool has been running on a FUN60, and
   they are fixed there — no learning of any kind. Auto-range is off by default
   here for the same reason: it is a second mechanism that can only make the map
   worse until it converges, and every velocity complaint so far has traced back
   to a learned end rather than to the slope maths. `hid range` turns it on.
   floor is 1/127 so the quietest hit is velocity 1, matching the tool exactly. */
const HEDEF={rest:0.03,trig:0.15,look:1,gamma:0.5,soft:0.005,hard:0.130,floor:1/127,auto:0};
/* Fastest slope a finger can actually produce, in travel/ms. Full key travel in
   2ms is already superhuman; anything above this is a measurement artifact. */
const HE_MAX_SLOPE=0.5;
/* Bumped when a change invalidates a learned velocity range. The travel-count
   fix rescaled every slope, so ranges learned before it are meaningless and
   would otherwise sit there squashing real hits for thousands of keystrokes. */
const HE_RANGE_VER=3;
/* The hard end is a property of the BOARD, not of taste. A Keychron polls a
   whole matrix every 4ms, so a slam shows up as one enormous step; the FUN60
   reports each key as it moves and the same slam arrives spread over several
   samples, topping out near half the slope. 0.130 is the FUN60 figure, measured
   on hardware; the Keychron entry is separate so tuning one cannot move the
   other. */
const HE_HARD={1:0.250,2:0.090};
/* The soft end matters as much: set it at 0 and the quietest real taps still
   land near a third of full velocity, because the curve has nowhere to put
   them. Both ends below are fitted from 37 labelled hits on a FUN60 — 19 soft,
   18 hard — using the same 12th/88th percentile rule the MIDI tool's wizard
   applies, so they are measurements rather than taste. */
const HE_SOFT={1:0.005,2:0.012};
/* A saved end outside these bounds cannot have come from playing — it is the
   residue of a bug, and version stamps are not enough to catch it: a stamp
   written by a build that failed to clear the value marks the bad value as
   current, which is exactly what happened here. Judge the value itself. */
const HE_SANE={soft:[0.0002,0.08], hard:[0.01,HE_MAX_SLOPE]};
/* The Keychron full-matrix report is a fixed 6x16 row-major scan, so the slot a
   playing key lands in is known in advance and `hid keys` is not needed on these
   boards. Slot = row*16+col; this is the K2 HE / Q3 HE order (Q1 and Q5 are 15
   and 19 columns wide — learn those). Anything not listed is left unmapped. */
const KC_SLOTS={34:'KeyW',35:'KeyE',37:'KeyT',38:'KeyY',39:'KeyU',41:'KeyO',42:'KeyP',
                49:'KeyA',50:'KeyS',51:'KeyD',52:'KeyF',53:'KeyG',54:'KeyH',55:'KeyJ',
                56:'KeyK',57:'KeyL',58:'Semicolon',59:'Quote'};
/* RongYuan boards number keys by matrix position, id = column*6 + row + 1.
   Confirmed against a full learn pass on a FUN60, and it is a property of the
   matrix wiring rather than the model, so it should hold across the family —
   `hid keys` still overrides it for any board that disagrees. Shipping it means
   a FUN60 plays the moment it connects, like the Keychron already does. */
const RY_SLOTS={1:'Escape',2:'Tab',3:'CapsLock',4:'ShiftLeft',5:'ControlLeft',7:'Digit1',
                8:'KeyQ',9:'KeyA',13:'Digit2',14:'KeyW',15:'KeyS',16:'KeyZ',17:'MetaLeft',
                19:'Digit3',20:'KeyE',21:'KeyD',22:'KeyX',23:'AltLeft',25:'Digit4',26:'KeyR',
                27:'KeyF',28:'KeyC',31:'Digit5',32:'KeyT',33:'KeyG',34:'KeyV',37:'Digit6',
                38:'KeyY',39:'KeyH',40:'KeyB',41:'Space',43:'Digit7',44:'KeyU',45:'KeyJ',
                46:'KeyN',49:'Digit8',50:'KeyI',51:'KeyK',52:'KeyM',55:'Digit9',56:'KeyO',
                57:'KeyL',58:'Comma',61:'Digit0',62:'KeyP',63:'Semicolon',64:'Period',
                65:'AltRight',67:'Minus',68:'BracketLeft',69:'Quote',70:'Slash',73:'Equal',
                74:'BracketRight',81:'Enter'};
const HE={
  on:false, srcName:'', dev:null, kind:0,          // 1 = analogsense, 2 = rongyuan
  keys:{},                                          // keyId -> stroke state
  recent:{},                                        // TEN key code -> last time the board touched it
  /* Is this keystroke the analog board's, rather than the laptop's? Refreshed
     for as long as the key is off its rest position, so a held key (and its
     auto-repeat) stays suppressed, and released 200ms after it comes back up. */
  owns(code){return this.on&&(performance.now()-(this.recent[code]||-1e9))<200;},
  map:null,                                         // keyId -> TEN key code
  fps:0, period:0, _fN:0, _fT:0, _fL:0, _fD:[], lastVel:0, lastId:null,
  learn:null, dump:0, dumped:[], probe:0, probeBest:null,
  cfg(){
    /* Drop a velocity range learned before the travel-count fix. Those slopes
       were measured against a wrong full-scale, so the saved ends are simply
       the wrong units — keeping them makes every hard hit read about a third of
       what it should. Runs once, then the stamp stops it. */
    /* Throw away a saved range that cannot be right. Judged on the value, not
       on a version stamp — a build that stamped without clearing leaves a bad
       value looking current, and no later stamp can tell the difference. */
    if(CFG.he){
      const bad=(k,b)=>{const v=CFG.he[k];
        return v!==undefined&&(!(v>0)||v<b[0]||v>b[1]);};
      /* Two reasons to drop a saved range. Out of physical bounds is obvious.
         The other is that until rv 3 the auto-range wrote what it learned into
         `soft`/`hard` — the same keys the configured range uses — so any board
         default was shadowed by whatever the last session happened to learn,
         permanently and invisibly. Those values have to go once. */
      if(bad('soft',HE_SANE.soft)||bad('hard',HE_SANE.hard)||
         bad('aSoft',HE_SANE.soft)||bad('aHard',HE_SANE.hard)||
         CFG.he.rv!==HE_RANGE_VER){
        const c=Object.assign({},CFG.he);
        delete c.soft; delete c.hard; delete c.aSoft; delete c.aHard;
        c.rv=HE_RANGE_VER; CFG.he=c; saveCfg();
      }
    }
    const d=this.kind?Object.assign({},HEDEF,{hard:HE_HARD[this.kind]||HEDEF.hard,
                                              soft:HE_SOFT[this.kind]||HEDEF.soft}):HEDEF;
    const c=Object.assign({},d,CFG.he||{});
    if(!(c.aSoft>0))c.aSoft=c.soft;      // learning starts from the fixed range
    if(!(c.aHard>0))c.aHard=c.hard;
    return c;
  },
  set(k,v){CFG.he=Object.assign({},CFG.he||{},{[k]:v}); saveCfg();},

  /* ---- transport ----
     ONE picker listing every supported board, and the transport is chosen from
     what came back. Filtering per-kind meant the arrow you pressed silently
     decided which keyboards were even offered: press the wrong one and a
     perfectly good keyboard just isn't in the chooser, with nothing to say why. */
  async connect(){
    if(!navigator.hid){flash('no WebHID here — use Chrome or Edge');return false;}
    const filters=[{vendorId:0x3151},                    // RongYuan: MonsGeek/Akko/Attack Shark
                   {vendorId:0x3434},{vendorId:0x362D},  // Keychron HE, Lemokey
                   {vendorId:0x31E3},{vendorId:0x1532},  // Wooting, Razer
                   {vendorId:0x19f5},{vendorId:0x352D},  // NuPhy, DrunkDeer
                   {vendorId:0x373b},{vendorId:0x372E}]; // Madlions, Bytech
    let devs;
    try{devs=await navigator.hid.requestDevice({filters});}
    catch(err){flash('hid: '+(err&&err.message||err));return false;}
    if(!devs||!devs.length){flash('no device chosen');return false;}

    /* Gather every interface of the chosen board, including granted siblings the
       chooser did not hand back, then pick by COLLECTION rather than by array
       position: these boards expose two or three HID interfaces and devs[0] is
       just as likely to be the typing one, which opens fine and never answers. */
    const pool=[...devs];
    try{for(const d of await navigator.hid.getDevices())
      if(!pool.includes(d)&&devs.some(x=>x.vendorId===d.vendorId&&x.productId===d.productId))pool.push(d);
    }catch(_){}
    const cols=d=>(d.collections||[]).map(c=>
      '0x'+c.usagePage.toString(16).toUpperCase()+'/0x'+c.usage.toString(16).toUpperCase()).join(' ');
    console.log('HE interfaces:\n'+pool.map(d=>
      '  '+d.productName+' '+d.vendorId.toString(16)+':'+d.productId.toString(16)+' ['+cols(d)+']').join('\n'));

    const has=(d,pg,us)=>(d.collections||[]).some(c=>c.usagePage===pg&&(us==null||c.usage===us));
    const vend=d=>(d.collections||[]).some(c=>(c.usagePage&0xFF00)===0xFF00);
    const kind=pool.some(d=>d.vendorId===0x3151)?2:1;
    let cfgDev,inDev;
    if(kind===2){
      cfgDev=pool.find(d=>has(d,0xFFFF,0x02));
      inDev =pool.find(d=>d!==cfgDev&&vend(d))||cfgDev;
      cfgDev=cfgDev||inDev;
    }else{
      inDev=pool.find(d=>has(d,0xFF60))||pool.find(vend)||pool[0];
      cfgDev=inDev;
    }
    if(!inDev){flash('hid: no vendor collection on that device — pick the keyboard itself, not a sub-entry');return false;}

    /* Open what we can; only the stream interface is fatal. An interface that
       refuses to open is usually one macOS has claimed, not a reason to give up
       on the ones that did open. */
    let oerr=null;
    for(const d of new Set([inDev,cfgDev])){
      if(d.opened)continue;
      try{await d.open();}catch(err){oerr=err; if(d===inDev)break;}
    }
    if(!inDev.opened){
      flash('hid open failed: '+(oerr&&oerr.message||oerr||'?')
        +' — another tab or app has this keyboard, or macOS Input Monitoring is off for Chrome');
      return false;
    }
    if(kind===2&&!cfgDev.opened){cfgDev=inDev;}   // fall back to enabling on the stream interface

    /* Drop a learned range that cannot mean anything any more: one from before
       the travel-count fix (wrong units), or one learned on a different family
       of board — see HE_HARD. Both checks must run BEFORE the stamps are
       written, or stamping is what makes the stale range look current. */
    if(CFG.he&&(CFG.he.rv!==HE_RANGE_VER||(CFG.he.k!==undefined&&CFG.he.k!==kind))){
      const c=Object.assign({},CFG.he);
      delete c.soft; delete c.hard; delete c.aSoft; delete c.aHard; CFG.he=c;
    }
    CFG.he=Object.assign({},CFG.he||{},{k:kind,rv:HE_RANGE_VER}); saveCfg();

    this.dev=inDev; this.cfgDev=cfgDev; this.kind=kind;
    this.srcName=inDev.productName||'hid';
    this.keys={}; this._fN=0; this._fT=performance.now(); this.fps=0;
    this.full=0; this.chunk=0; this._started=0; this.ready=0;
    this.map=(CFG.he&&CFG.he.map)||(kind===1?KC_SLOTS:RY_SLOTS);
    inDev.oninputreport=e=>this.report(e);
    this.on=true;
    if(kind===2)await this.ryEnable(); else this.kcProbe();
    this.watch=setInterval(()=>this.tick(),60);
    flash('hid: '+this.srcName+(this.map?'':' — run `hid keys` to map the keys'));
    dirty=true; return true;
  },
  disconnect(){
    this.on=false; clearInterval(this.watch); this.recent={};
    for(const id in this.keys)this.release(id);
    if(this.dev){try{this.dev.oninputreport=null;}catch(_){} try{this.dev.close();}catch(_){}}
    this.dev=null; this.keys={}; flash('hid off'); dirty=true;
  },
  async ryEnable(){                                  // FUN60: one feature report turns analog on
    const b=new Uint8Array(64); b[0]=0x1B; b[1]=0x01;
    let sum=0; for(let i=0;i<7;i++)sum+=b[i];
    b[7]=(255-sum)&0xff;
    /* the enable command goes to the CONFIG interface, which is not the one the
       analog reports come back on */
    try{await (this.cfgDev||this.dev).sendFeatureReport(0,b);}
    catch(err){flash('fun60 enable failed: '+(err&&err.message||err));}
  },
  kcProbe(){                                         // Keychron: what can this firmware do?
    const b=new Uint8Array(32); b[0]=0xA9; b[1]=0x01;
    this._reqAt=performance.now();
    this.dev.sendReport(0,b).catch(err=>flash('hid probe failed: '+(err&&err.message||err)));
    /* stock firmware answers without the marker and only does one key per round
       trip — far too slow for velocity. Say so rather than sitting silent. */
    setTimeout(()=>{if(this.on&&!this.ready){this.ready=1; this.kcRequest();}},300);
  },
  kcRequest(){                                       // Keychron: ask for the whole matrix
    if(!this.dev||!this.on)return;
    const b=new Uint8Array(32); b[0]=0xA9; b[1]=0x31;
    this.chunk=0; this._reqAt=performance.now(); this._started=1;
    /* exactly ONE request in flight — pipelining two per frame buries the MCU
       and the chunks carry no sequence number to resync against. The counter is
       zeroed as the request goes out, so alignment is re-derived every frame
       instead of accumulating: a dropped report costs one frame, not the stream. */
    this.dev.sendReport(0,b).catch(()=>{this._started=0;});
  },
  tick(){                                            // watchdog: the board went quiet
    if(!this.on)return;
    if(this.kind===1&&this.ready&&performance.now()-(this._reqAt||0)>60)this.kcRequest();
  },
  report(e){
    /* e.data is a DataView over the report WITHOUT the report id. Taking
       .buffer alone ignores byteOffset/byteLength and can shift every byte. */
    const d=new Uint8Array(e.data.buffer,e.data.byteOffset,e.data.byteLength);
    if(this.dump>0){this.dump--; this.dumped.push([...d].slice(0,20).map(x=>x.toString(16).padStart(2,'0')).join(' '));
      if(!this.dump)console.log('HID dump:\n'+this.dumped.join('\n'));}
    const t=performance.now();
    if(this.kind===2){                               // [0x1B, lo, hi, keyId]
      if(d[0]!==0x1B)return;
      const raw=d[1]|(d[2]<<8), id=d[3];
      /* Seed the full-travel count and let it grow. 350 is right: a capture
         that actually bottomed keys out reports every value as an exact integer
         over 365, with full presses at 340-363, matching the published Attack
         Shark teardown. A brief experiment with 75 — read off earlier captures
         whose deepest press happened to be shallow — made every press clip at
         1.0, which poisoned the auto-learned range and capped velocity around a
         third of full scale. Seeding from the first sample instead would make
         the first press of every session read as bottomed out. */
      if(!this.full)this.full=350;
      if(raw>this.full)this.full=raw;                // firmware scale differs per model
      this.sample(id,Math.min(raw/this.full,1),t);
      this.frame(t);
      return;
    }
    /* analog and RGB share this pipe, so demux on the command byte: 0xA9 is the
       analog channel, 0xA8 the RGB one. Both put a two byte header in front of
       the payload. Anything else is not ours. */
    if(d[0]!==0xA9)return;
    if(d[1]===0x01){                                 // capability reply
      this.ready=1;
      const full=d[31]===0x45;
      flash(full?'hid: full-matrix analog v'+d[2]
                :'hid: STOCK firmware — one key per round trip, too slow for velocity');
      this.kcRequest();
      return;
    }
    const c=this.chunk||0;
    if(c>=4)return;                                  // surplus report: ignore, don't wrap
    for(let i=0;i<30;i++){
      const v=d[2+i]; if(v===undefined)break;
      this.sample(c*30+i,Math.max(0,v-5)/230,t);     // 5/235 is the library's dead zone
    }
    this.chunk=c+1;
    if(this.chunk>=4){this.frame(t); this.kcRequest();}
  },
  /* The sampling period has to be the MEDIAN GAP BETWEEN REPORTS, not a count
     over wall-clock time. On an event-driven board reports only arrive while a
     key is moving, so counting them over half a second averages in all the
     silence and under-reports the rate several times over. That matters because
     the period sets the floor `dt` is clamped to: under-report it and the
     sub-millisecond bursts a hard hit arrives in get widened, dividing the slope
     down. Soft hits never noticed — their gaps are already wider than the floor
     — so the symptom was hard hits alone stuck around half velocity. */
  frame(t){
    this._fN++;
    if(this._fL){
      const d=t-this._fL;
      if(d>0.05&&d<200){ this._fD.push(d); if(this._fD.length>240)this._fD.shift(); }
    }
    this._fL=t;
    if(!this.period||(this._fN&31)===0){
      const a=this._fD.slice().sort((x,y)=>x-y);
      if(a.length)this.period=a[a.length>>1];
    }
    if(t-this._fT>=500){
      this.fps=this.period?Math.round(1000/this.period):0;
      this._fN=0; this._fT=t; dirty=true;
    }
  },

  /* ---- stroke tracking + velocity ---- */
  sample(id,v,t){
    const C=this.cfg();
    let k=this.keys[id];
    if(!k)k=this.keys[id]={st:0,pv:0,pt:t,peak:0,top:0,code:null,fireV:0,fireT:0};
    /* Clamp dt to a sane window around the measured frame period. Two reports
       delivered back to back after a stalled event loop would otherwise read as
       an enormous slope and fire a pianissimo note at 127. */
    /* Absolute 0.5ms floor as well as the period-relative one: no finger crosses
       meaningful travel inside half a millisecond, and on a push-based board the
       median gap tracks how many keys are moving rather than how fast one is
       sampled. Ceiling never below 12ms so a long gap before a stroke is not
       treated as part of it. Same guards as the MIDI tool. */
    const P=this.period>0?this.period:4;
    const dt=clamp(t-k.pt,Math.max(0.5,P*0.4),Math.max(P*3.5,12)), slope=(v-k.pv)/dt;
    /* claim the key while it is off rest, so its typed keystroke is ignored and
       the laptop keyboard's identical keystroke is not */
    if(v>C.rest&&this.map){const mc=this.map[id]; if(mc)this.recent[mc]=t;}
    if(this.probe&&v>0.25&&(!this.probeBest||v>this.probeBest.v))this.probeBest={id,v};
    if(k.st===0){                                    // resting
      if(v<=C.rest){k.pv=v; k.pt=t; return;}
      k.st=1; k.peak=Math.max(0,slope); k.top=v; k.wait=0;
      /* fall straight through to the trigger test: a slam crosses rest and
         bottoms out on the SAME frame, and waiting for the next one is 4ms
         of latency on exactly the hits that need it least */
    }
    if(k.st===1){                                    // downstroke, not yet spoken
      k.peak=Math.max(k.peak,slope); k.top=Math.max(k.top,v);
      if(v<=C.rest){k.st=0;}                         // a nudge that never got there
      else if(v>=C.trig){
        // bottomed out, or learning (which only needs identity): no point waiting
        if(k.wait>=C.look||v>0.97||this.learn){this.fire(id,k,v,t);}
        else k.wait++;
      }
    }else if(k.st===2){                              // sounding
      if(v<C.rest*0.8){this.release(id);}
      /* Re-attack. A key resting past the trigger — fingers parked, a high
         zero, a press that stopped short — sits here, and from there a
         full-force hit makes no sound at all. A light touch missing is fine;
         mashing a key and hearing silence is not.

         The key must have SETTLED first. Without that, an ordinary press that
         keeps accelerating past the trigger on its way to bottoming out fires a
         second note — which is the double-hit this was meant to avoid. A finger
         that has come to rest and then drives down is unambiguous; a single
         continuous downstroke never stops moving. */
      else if(k.calm&&slope>=0.02&&v>k.fireV+0.08&&t-k.fireT>40){
        this.release(id);
        k.st=1; k.peak=Math.max(0,slope); k.top=v; k.wait=0;
        this.fire(id,k,v,t);
      }
      else{
        /* "calm" must be ELAPSED stillness, never one unchanged sample. The
           Keychron path re-steps all 96 keys every frame and the RongYuan one
           repeats a key until it moves, so a single dv=0 test marks a key
           settled the instant anything else reports — and the rest of its own
           downstroke then reads as a fresh attack and fires a second note. */
        k.calm=(t-(k.moveT||k.fireT))>60;   // BEFORE recording this sample's move:
        if(Math.abs(v-k.pv)>0.004)k.moveT=t; // the re-attack sample IS movement
        if(k.code){
          const x=C.trig<0.99?clamp((v-C.trig)/(1-C.trig),0,1):v;
          EXP.keyPress(k.code,x);                    // the rest of the stroke is expression
        }
      }
    }
    k.pv=v; k.pt=t;
  },
  fire(id,k,v,t){
    const C=this.cfg();
    if(this.learn){this.learnHit(id); k.st=2; k.code=null; return;}
    const code=this.map&&this.map[id];
    k.st=2; k.code=null;
    k.fireV=v; k.fireT=t||k.pt; k.calm=0; k.moveT=t||k.pt;   // re-attack baseline
    this.lastId=id;
    if(!code)return;
    const vel=this.vel(k.peak,C);
    this.lastVel=vel;
    if(EXP.keyDown(code,vel)){
      k.code=code;                                   // only track it if it actually spoke
      /* seed pressure from the depth we fired at, so a swell patch speaks now
         rather than on the next frame */
      EXP.keyPress(code,C.trig<0.99?clamp(((v??C.trig)-C.trig)/(1-C.trig),0,1):(v??0));
    }
  },
  release(id){
    const k=this.keys[id]; if(!k)return;
    if(k.st===2&&k.code)EXP.keyUp(k.code);
    k.st=0; k.code=null; k.peak=0; k.top=0;
  },
  vel(slope,C){
    if(C.auto){
      /* Learn the ends of your own playing — but they have to be able to come
         BACK. A pure min/max ratchet only ever widens: one accidental brush
         pins `soft` at the floor, one wild slam pins `hard` at the ceiling, and
         from then on everything real is squashed into the middle of a range
         nothing reaches. So the ends chase fast toward a new extreme and creep
         slowly back in when nothing is beating them. */
      /* Learned ends live in their OWN keys. Sharing storage with the
         configured range meant a value the auto-range happened to learn was
         written straight over the board default and then shadowed it forever —
         `cfg()` merges saved config on top of the defaults, so a learned 0.25
         silently outranked the 0.090 this board needs, whatever the default
         said and long after auto had been switched off. */
      let s=C.aSoft,h=C.aHard;
      /* Never learn the hard end from a physically impossible stroke. A finger
         cannot cross the key in under a couple of milliseconds, so anything past
         HE_MAX_SLOPE is a timing artifact — a burst of queued reports, a stalled
         event loop, or a mis-scaled travel count. One of those pins `hard` at
         ten times any real hit, and since the ends only creep back at 0.05% a
         hit it never recovers: every genuine mash then reads about a third of
         full velocity. Clamp what can be learned; the clamp below still maps a
         freakishly fast reading to full velocity. */
      if(slope>0.0005&&slope<=HE_MAX_SLOPE){
        if(slope<s)s=Math.max(0.0005,slope*0.7+s*0.3);   // new soft end: move most of the way
        else       s=s*0.9995+slope*0.0005;              // nothing softer lately: drift up
        if(slope>h)h=slope*0.7+h*0.3;
        else       h=Math.max(s*3,h*0.9995+slope*0.0005);
        /* keep them in RAM and only persist occasionally — `set` writes
           localStorage, and one write per keystroke is a lot of writes */
        C.aSoft=s; C.aHard=h;
        CFG.he=Object.assign({},CFG.he||{},{aSoft:s,aHard:h});
        if(((this._save=(this._save|0)+1)&31)===0)saveCfg();
      }
    }
    const S=C.auto?C.aSoft:C.soft, H=C.auto?C.aHard:C.hard;
    const lo=Math.min(S,H*0.5), hi=Math.max(H,lo*1.5);
    const n=clamp((slope-lo)/(hi-lo),0,1);
    return clamp(C.floor+(1-C.floor)*Math.pow(n,C.gamma),1/127,1);
  },

  /* ---- key learn: press each playing key in turn, we record which slot moved ---- */
  startLearn(){
    if(!this.on){flash('connect a hid keyboard first');return;}
    this.learn={i:0,map:{},order:Object.keys(NOTEKEYS)};
    flash('LEARN: press '+this.learn.order[0]+' on the keyboard · esc cancels');
    dirty=true;
  },
  learnHit(id){
    const L=this.learn;
    if(L.map[id]!==undefined)return;                 // that slot is already spoken for
    L.map[id]=L.order[L.i++];
    if(L.i<L.order.length){flash('LEARN '+L.i+'/'+L.order.length+' · press '+L.order[L.i]);}
    else{
      this.map=L.map; this.set('map',L.map); this.learn=null;
      flash('◎ hid keys mapped — '+Object.keys(L.map).length+' keys');
    }
    dirty=true;
  },

PARAMS = ['pluck','damp','decay','body','pos','stiff','noise','drive']
function noteOn(v,f,vel,p){

  var L=Math.max(8,Math.round(sampleRate/f));

     not just this one — a waveguide retunes by changing its length, and it
     cannot lengthen past its buffer */

  v.i=0; v.y=0; v.dc=0;
  var k=Math.max(1,Math.round(L*(0.08+p[4]*0.42)));   // pluck position -> comb
  for(var n=0;n<L;n++) v.buf[n]=(Math.random()*2-1);
  for(var n=L-1;n>=k;n--) v.buf[n]-=v.buf[n-k]*0.7;
  var g=0.5;                                          // soften the excitation
  for(var n=1;n<L;n++) v.buf[n]=v.buf[n]*(1-g)+v.buf[n-1]*g;
  v._l=0;v._b=0;v._h=0;

/* retune = change the string's LENGTH. The energy already circulating in the
   delay line stays there, so the note keeps ringing at the new pitch instead
   of being replucked — which is what separates legato from a retrigger. */
function setF(v,f){
  var L=Math.max(8,Math.round(sampleRate/f));
  if(L>v.buf.length)L=v.buf.length;
  v.f=f; v.L=L; if(v.i>=L)v.i=0;

function noteOff(v){ v.rel=true }
function render(v,p){
  var s=v.buf[v.i];
  // the loop filter: every trip round the string loses treble. This recursion
  // is the instrument — it produces every partial with correct coupling.
  var d=0.02+p[1]*0.33;                               // damp: 0.02..0.35, not 0.9
  v.y=(1-d)*s+d*v.y;
  // loss per SAMPLE: 0.9992 is a 28ms time constant, i.e. the string was dying
  // in under 200ms. T60 = 6.9/(1-loss)/sr, so 2s needs ~0.99992.
  var loss=0.999975-(1-p[2])*0.00012;

  v.buf[v.i]=v.y*loss;
  v.i++; if(v.i>=v.L)v.i=0;
  var y=s;
  if(p[3]>0){                                         // body resonance
    var bp=_svf(v,y,6.2832*220*srI,0.22);

   which is what turns one violin into a section. */

  v.ph=[0,0,0,0,0]; v.dr=[0,0,0,0,0]; v.vp=[];
  for(var i=0;i<5;i++){ v.ph[i]=Math.random(); v.dr[i]=(Math.random()*2-1);

     the top octave for about one. Radiation damping and internal friction both

/* --- RHODES. A hammer hits a stiff TINE next to a tonebar; a magnetic pickup
   reads it. The signature is a bell-like inharmonic partial that barks on the
   attack and dies well before the fundamental does. -------------------- */
_mk('tine','struck',`
PARAMS = ['strike','decay','tine','bark','trem','warm','tone','drive']
/* Electric piano: a hammer strikes a stiff steel TINE which sits beside a
   TONEBAR, and the pair behaves as an ASYMMETRIC TUNING FORK read by a
   magnetic pickup. Two sounds in one: the tine gives the bell-like attack,
   the tonebar the round sustain.
   FM is the right tool for the bell half — this is exactly how the DX7 made
   its famous electric pianos: a modulator at ratio 1 whose INDEX decays fast,
   so the note is bright at the strike and settles to a near-pure tone.
   [sweetwater.com/insync/tine-piano · en.wikipedia.org/wiki/Rhodes_piano] */
function noteOn(v,f,vel,p){
  v.f=f; v.vel=vel; v.t=0; v.rel=false; v.env=1;
  v.pc=0; v.pm=0; v.pb=0; v.pt=0; v.lz=0; v.dc=0; v.hpz=0;
  v.hard=0.25+0.75*vel;
}
function noteOff(v){ v.rel=true }
function render(v,p){
  var t=v.t, dec=0.18+p[1]*5.2;   // reaches genuinely short now
  var body=Math.exp(-t/dec);

  var mod=Math.sin(v.pm)*idx;
  v.pc+=6.2832*v.f*srI;

   either of the two things this does.

   table is built for the nominal frequency, so at high index the band-limiting
   stops matching the instantaneous frequency and it folds. Here the modulator
   simply MOVES THE READ POINT of a sine. A sine has no discontinuity, so there
   is nothing to alias no matter how hard it is driven: index 20 is clean.

   AND A REAL LADDER, saturating inside the feedback loop.

   ramp — so the wave knob crosses from "clean analog" to "clean FM" without
   either side being a compromise. */

function noteOn(v,f,vel,p){

function noteOff(v){ v.rel=true }
function render(v,p){

/* SNARE — a head with wires lying under it. The wires do not have their own
   envelope: they rattle when the head MOVES, so their noise is gated by the
   head's own displacement. That coupling is why a snare buzzes in sympathy
   and why it chokes when you damp the head. */
_mk('kick','membrane',`
PARAMS = ['tune','punch','decay','click','body','sub','trem','drive']
function noteOn(v,f,vel,p){
  v.f=f; v.vel=vel; v.t=0; v.rel=false; v.env=1; v._q=0;
  v.f0=(38+p[0]*72)*(f/261.6*0.6+0.4);
  v.drop=1+p[1]*p[1]*7.5;                      // how far above f0 it starts
  v.pk=Math.exp(-1/((0.006+p[1]*0.05)*sampleRate));
  v.pf=v.f0*v.drop;
  v.dec=0.08+p[2]*p[2]*1.1;
  v.ph=0; v.ph2=0; v.b=0; v.l=0; v.dc=0;
}
function noteOff(v){ v.rel=true }
function render(v,p){
  var t=v.t;
  v.pf=v.f0+(v.pf-v.f0)*v.pk;                  // the drop, per sample
  v.ph+=6.2832*v.pf*srI;
  var e=Math.exp(-t/v.dec);
  var y=Math.sin(v.ph)*e;
  // shell/port: a lower mode that arrives just after the head
  v.ph2+=6.2832*v.f0*0.5*srI;
  y+=Math.sin(v.ph2)*Math.exp(-t/(v.dec*1.6))*p[5]*0.7*(1-Math.exp(-t/0.012));
  y*=(0.5+p[4]*0.9);
  if(t<0.006){                                  // beater
    var nz=_noise();
    var fc=6.2832*3200*srI;
    var h=nz-v.l-0.7*v.b; v.b+=fc*h; v.l+=fc*v.b;
    y+=(nz-v.l)*p[3]*0.9*Math.exp(-t/0.0013);
  }
  v.dc+=(y-v.dc)*0.0003; y-=v.dc;
  if(v.rel){ v.env*=(1-v._rr); if(v.env<0.0006)v.done=true; }
  v._q=Math.abs(y)>v._q?Math.abs(y):v._q*0.9997;
  if(t>0.06&&v._q<1e-5)v.done=true;
  y=Math.tanh(y*(1+p[7]*4));
  v.t+=srI;
  return y*v.vel*v.env*0.5;
}`);

/* ---------------- procedural presets -----------------------------------
   Ten per model. Each carries the model's own eight params plus a filter, an
   amp envelope, voice settings and an fx chain — so a preset is a whole voice,
   not just a timbre tweak. Mostly built to sound like the real instrument in a
   real room; the last one or two of each set deliberately are not.
   PP(name, cp[8], flt|null, env[a,d,s,r], vox|null, fx[])
     flt : [type, freq, q]              type: 1 lp · 2 hp · 3 bp · 5 peq
     vox : [mode, uni, sprd, wide, glide]
     fx  : [[typeName, p1, p2, p3, mix], …]                                  */
const PP=(n,cp,flt,env,vox,fx)=>({n,cp,flt,env,vox,fx});
const PROCPRE={};
function applyProcPreset(pi,pre){
  const p=S.presets[pi];
  procDefaults(p);
  p.cp=pre.cp.slice(0,8);
  if(pre.flt){const [t,f,q]=pre.flt; Object.assign(p.flt[0],{typ:t,frq:f,q:q});}
  else p.flt[0].typ=0;
  const [a,d,su,r]=pre.env||[0.002,6,1,0.12];
  p.mod[0]={src:1,rsel:0,routes:[{dst:1,idx:1,amt:100,ctr:0,tgt:null}],
            a,d,s:su,r,crv:0,wav:0,rate:5,ph:0};
  if(pre.vox){const [m,u,sp,w,g]=pre.vox;
    Object.assign(p.vox,{mode:m,uni:u,sprd:sp,wide:w,glide:g,slop:0.004});}
  p.fx.forEach((f,i)=>p.fx[i]=mkFx());
  (pre.fx||[]).forEach((f,i)=>{
    if(i>9)return;
    const ti=XTYPES.indexOf(f[0]);
    if(ti<0)return;
    p.fx[i]={typ:ti,p1:f[1],p2:f[2],p3:f[3],mix:f[4]};
  });
  p.name=pre.n.slice(0,5).toUpperCase();
  engine.rebuildRack(pi); engine.refresh(pi); engine.codeCfg(pi);
  /* codeCfg carries the filter, mod and voice config — NOT the model's own
     eight params. Without this the worklet kept the previous preset's values
     and only the name changed, so switching preset did nothing you could
     hear. Changing MODEL appeared to work only because a new source rebuilds
     the node, which sends the params as a side effect. */
  engine.codeParams(pi);
}
const procPresets=m=>PROCPRE[m]||[];

   directions, and the reason is measurable: play twenty notes a second into
   each model and count how many are still sounding a second later. A bell
   holds all sixty. A kick holds three. The ringing models are the ones that
   pile up — they are not more expensive per voice, there are simply twenty of
   them alive where a drum has two — so they get the smaller cap, and the
   percussive ones get room they were being denied for no reason.

/* Sensible starting rack for a procedural channel. The amp envelope sits at
   sustain 1 with a long decay, so while a key is held it does nothing at all —
   its only job is to give TEN's RELEASE control over a model that otherwise
   decides its own. Without it, release genuinely has no effect, which is
   exactly what it felt like. */
function procDefaults(p){

function retroCapture(){

  if(!recent.length){flash('retro: play something first, then tab');return;}
  let seg=[recent[recent.length-1]];                 // walk back until a gap > 1 bar
  for(let i=recent.length-2;i>=0;i--){
    if(seg[0].t-(recent[i].t+Math.min(recent[i].dur||0.25,0.5))>4)break;
    seg.unshift(recent[i]);

  if(!lane.auto){
    /* A LENGTH YOU SET IS A DECISION. This used to also require the lane to
       still have notes in it, so clearing a hand-sized loop and playing it
       again handed the length straight back to the estimator — you got 2 or 4

       is yours the take goes INTO it; only `auto` invites a guess.

       And only the LAST cycle of it. The gap-walk above collects everything

    const off=fmod(t0-editAnchor(),L);

  if(on){ if(h.state!=='rec'){h.state='edit'; flash('▦ pattern edit');} }

let capsWas=false;

      }

         held, latch across the hold = stay on. Those were three settings, so

         differently depending on a screen you were not looking at. */
      const noteCh=S.layer>=2?S.editSnd:S.curPreset;
      if(S.layer>=1&&isAudioCh(noteCh)){                 // audio channel: tab = mic record

       thing these two keys cannot do: they are a minus and a plus. */
    {const tg=chTargets(), pat=S.patterns[S.editPat], f=c==='Minus'?0.5:2;
     let did=false;
     tg.forEach(i=>{ if(stretchLoop(pat.lanes[i],f))did=true; });
     if(did){HOLD.tabUsed=true; if(tg.length>1)chSay(f<1?'▸▸ double speed':'▸ half speed',tg.length);}}
    return;
  }

     free: the '[ ] \\ - =' loop bindings moved onto tab+arrows a while ago and
     nothing took the keys back. */
  if((c==='Equal'||c==='Minus')&&S.layer>=2&&!e.metaKey&&!e.ctrlKey&&!e.repeat){

    if(c==='Equal')addSlotHere(); else removeSlotHere();

     standing on the filter cutoff because you were thinking about the filter
     cutoff, and the old flow was: remember what it was called, leave, open the
     mod rack, find a free slot, open the destination browser, find your way
     back to it. Now: press r.

     slot's amount so the next thing you press is the thing you meant.

     other one plays a note or is already bound. Spent here because this is the
     gesture that gets used a hundred times a session. */
  if(c==='KeyR'&&!e.repeat&&!e.metaKey&&!e.ctrlKey&&S.layer>=2&&!PICK&&!DPICK){

    if(!M||!M.id||M.prs){flash('nothing to modulate here');return;}
    const hold=modHolder(pre,'mod');
    const specs=paramsFor(S.curMod,M.flat?null:modHolder(pre,M.id)[M.id][S.curSlot]);
    const spec=specs[flatView(S.curMod)?S.curParam:S.slotParam];
    if(!spec){flash('nothing to modulate here');return;}
    if(spec.type==='enum'||(spec.key&&spec.key[0]==='_')){
      flash(spec.lbl+' is a menu — modulation needs a range');return;}

    if(!rate){flash('nothing can drive '+M.name.toLowerCase()+'·'+spec.lbl+' yet');return;}
    const addr={rack:M.id,slot:M.flat?0:S.curSlot,key:spec.key,lbl:spec.lbl};
    if(!M.flat){const sid=slotId(pre,M.id,S.curSlot); if(sid!=null)addr.sid=sid;}
    /* an existing modulator already pointed here? go to it rather than making
       a second one — pressing r twice should take you back, not pile up */
    let at=-1;
    hold.mod.forEach((m,i)=>{ if(at>=0||!m||!m.src)return;
      if((m.routes||[]).some(rt=>rt.addr&&sameAddr(rt.addr,addr)))at=i; });
    if(at<0){
      at=hold.mod.findIndex(m=>!m||!m.src);
      if(at<0){flash('all ten mod slots are in use');return;}
      pushUndo('route');
      const m=hold.mod[at];
      Object.assign(m,mkMod(at),{src:2,off:false});     // an LFO is the useful default

      m.rsel=0;
      flash('◎ lfo → '+destLabel(addr)+'  ('+(rate==='audio'?'audio rate':rate==='ctrl'?'live':'next note')+')');
    }else flash('◎ already routed — '+MSRC[hold.mod[at].src]+' → '+destLabel(addr));
    /* land on the new modulator's AMOUNT, because that is always the next
       thing you want and it is the one value that decides whether you can
       hear what you just made */
    S.curMod=MODULES.findIndex(M2=>M2&&M2.id==='mod');
    S.curSlot=at;
    const ms=paramsFor(S.curMod,hold.mod[at]);
    S.slotParam=Math.max(0,ms.findIndex(x=>x.key==='amt'));
    engine.refresh(S.editSnd); engine.lfoLive(S.editSnd);
    dirty=true; dirtySave=true; return;
  }
  /* THE AUTOMATION OVERLAY. Recorded knob moves were a number in a text row at
     the bottom of the third layer — you could see that there were fourteen
     points and nothing about what they did. They are curves over the notes
     now, in the same column, on the same clock, so a filter opening across a
     bar is a shape next to the notes it is opening under.
     Backslash because it was one of five keys left, and because it sits under
     the brackets that walk between the knobs. */
  if(c==='Backslash'&&!e.repeat&&!e.metaKey&&!e.ctrlKey&&!PICK&&!DPICK){
    e.preventDefault();
    if(S.aView!==null){S.aView=null; flash('automation hidden'); dirty=true; return;}
    const pre=S.presets[S.curPreset], ls=autoLanes(pre);
    S.aView=0; S.aAddr=ls.length?(aFront(pre)||ls[0]).k:null;
    flash(ls.length?'automation — '+ls.length+' knob'+(ls.length>1?'s':'')+' on '+pre.name
                   :'automation — nothing recorded on '+pre.name+' yet');
    dirty=true; return;
  }
  if((c==='BracketLeft'||c==='BracketRight')&&!e.metaKey&&!e.ctrlKey&&!PICK&&!DPICK){
    e.preventDefault();
    if(S.aView===null){flash('\\ shows the automation first');return;}
    const pre=S.presets[S.curPreset], ls=autoLanes(pre);
    if(ls.length<2){flash(ls.length?'only one knob is automated here':'nothing recorded on '+pre.name);return;}
    const at=Math.max(0,aIndexOf(ls,S.aAddr));
    const nx=ls[(at+(c==='BracketRight'?1:ls.length-1))%ls.length];
    S.aAddr=nx.k; dirty=true;

       looking at is the parameter your arrows are on, or the overlay is a
       picture of somewhere else. */
    const w=autoWhere(pre,nx.a);
    if(w&&S.layer>=2&&S.editSnd===S.curPreset){
      S.curMod=w.mi; if(w.si>=0)S.curSlot=w.si;
